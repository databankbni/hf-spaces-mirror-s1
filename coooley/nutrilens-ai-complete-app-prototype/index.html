<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NutriLens AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        },
                        slate: {
                            850: '#1e293b',
                            950: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            overscroll-behavior-y: none;
            -webkit-font-smoothing: antialiased;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass {
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
        }
        .dark .glass {
            background: rgba(30,41,59,0.72);
        }
        .glass-card {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .dark .glass-card {
            background: rgba(30,41,59,0.6);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .progress-ring-circle {
            transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .page-transition {
            animation: pageIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes pageIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .slide-up {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .micro-bounce {
            animation: microBounce 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        @keyframes microBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .scan-line {
            animation: scanLine 2s linear infinite;
        }
        @keyframes scanLine {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .pulse-ring {
            animation: pulseRing 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulseRing {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 0.3; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }
        .score-excellent { color: #16a34a; }
        .score-verygood { color: #22c55e; }
        .score-good { color: #84cc16; }
        .score-fair { color: #eab308; }
        .score-poor { color: #ef4444; }
        .bg-score-excellent { background-color: #16a34a; }
        .bg-score-verygood { background-color: #22c55e; }
        .bg-score-good { background-color: #84cc16; }
        .bg-score-fair { background-color: #eab308; }
        .bg-score-poor { background-color: #ef4444; }
        .ingredient-tag {
            transition: all 0.2s ease;
        }
        .ingredient-tag:active {
            transform: scale(0.96);
        }
        .tab-active {
            position: relative;
        }
        .tab-active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            border-radius: 2px;
            background: #22c55e;
        }
        .dark .tab-active::after {
            background: #4ade80;
        }
        .nutrient-bar {
            height: 6px;
            border-radius: 3px;
            background: #e2e8f0;
            overflow: hidden;
        }
        .dark .nutrient-bar {
            background: #334155;
        }
        .nutrient-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-press:active {
            transform: scale(0.985);
            transition: transform 0.1s;
        }
        .bottom-sheet {
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .bottom-sheet.open {
            transform: translateY(0);
        }
        .overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .radar-chart {
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.06));
        }
        .research-card {
            border-left: 3px solid #22c55e;
        }
        .warning-pill {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
        }
        .dark .warning-pill {
            background: linear-gradient(135deg, #451a03 0%, #78350f 100%);
        }
        .ai-glow {
            box-shadow: 0 0 20px rgba(34,197,94,0.15);
        }
        .meal-photo {
            transition: transform 0.3s ease;
        }
        .meal-photo:active {
            transform: scale(0.97);
        }
        @media (prefers-color-scheme: dark) {
            .auto-dark { color-scheme: dark; }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 overflow-hidden">
    <div id="app" class="h-screen w-full max-w-md mx-auto relative bg-white dark:bg-slate-950 shadow-2xl overflow-hidden">
        <!-- Status Bar -->
        <div id="statusBar" class="h-11 w-full flex items-center justify-between px-6 pt-2 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md z-50 fixed top-0 max-w-md">
            <span id="clock" class="text-sm font-semibold">9:41</span>
            <div class="flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
                <div class="flex items-center gap-0.5">
                    <div class="w-6 h-3 border border-current rounded-sm relative">
                        <div class="absolute inset-0.5 bg-current rounded-sm" style="width: 75%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Screen Container -->
        <div id="screenContainer" class="h-full pt-11 pb-20 overflow-y-auto hide-scrollbar">
            <!-- Screens injected by JS -->
        </div>

        <!-- Bottom Navigation -->
        <nav id="bottomNav" class="fixed bottom-0 w-full max-w-md h-20 bg-white/90 dark:bg-slate-950/90 backdrop-blur-xl border-t border-gray-200/50 dark:border-slate-800/50 flex justify-around items-center px-2 pb-2 z-50 hidden">
            <button onclick="app.navigate('dashboard')" class="nav-btn flex flex-col items-center gap-0.5 p-2 w-16" data-screen="dashboard">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
                <span class="text-[10px] font-medium">Today</span>
            </button>
            <button onclick="app.navigate('diary')" class="nav-btn flex flex-col items-center gap-0.5 p-2 w-16" data-screen="diary">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg>
                <span class="text-[10px] font-medium">Diary</span>
            </button>
            <button onclick="app.navigate('log')" class="nav-btn flex flex-col items-center justify-center -mt-4" data-screen="log">
                <div class="w-14 h-14 rounded-full bg-brand-500 flex items-center justify-center shadow-lg shadow-brand-500/30">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                </div>
            </button>
            <button onclick="app.navigate('progress')" class="nav-btn flex flex-col items-center gap-0.5 p-2 w-16" data-screen="progress">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z"/></svg>
                <span class="text-[10px] font-medium">Progress</span>
            </button>
            <button onclick="app.navigate('profile')" class="nav-btn flex flex-col items-center gap-0.5 p-2 w-16" data-screen="profile">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
                <span class="text-[10px] font-medium">Profile</span>
            </button>
        </nav>

        <!-- Overlay for bottom sheets -->
        <div id="overlay" class="overlay fixed inset-0 bg-black/40 backdrop-blur-sm z-40 max-w-md mx-auto" onclick="app.closeBottomSheet()"></div>

        <!-- Bottom Sheet -->
        <div id="bottomSheet" class="bottom-sheet fixed bottom-0 w-full max-w-md bg-white dark:bg-slate-900 rounded-t-3xl z-50 shadow-2xl max-h-[85vh] overflow-y-auto hide-scrollbar">
            <div class="w-12 h-1 bg-gray-300 dark:bg-slate-600 rounded-full mx-auto mt-3 mb-2"></div>
            <div id="bottomSheetContent"></div>
        </div>

        <!-- Scan Overlay -->
        <div id="scanOverlay" class="fixed inset-0 bg-black z-[60] hidden max-w-md mx-auto">
            <div class="relative h-full w-full">
                <video id="scanVideo" class="h-full w-full object-cover" autoplay playsinline muted></video>
                <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/40"></div>
                <div class="absolute top-16 left-0 right-0 text-center">
                    <p class="text-white/80 text-sm font-medium">Scanning barcode...</p>
                </div>
                <div class="absolute inset-16 border-2 border-white/30 rounded-3xl">
                    <div class="absolute top-0 left-8 right-8 h-0.5 bg-brand-400 scan-line"></div>
                    <div class="absolute top-4 left-4 w-6 h-6 border-t-2 border-l-2 border-brand-400 rounded-tl-lg"></div>
                    <div class="absolute top-4 right-4 w-6 h-6 border-t-2 border-r-2 border-brand-400 rounded-tr-lg"></div>
                    <div class="absolute bottom-4 left-4 w-6 h-6 border-b-2 border-l-2 border-brand-400 rounded-bl-lg"></div>
                    <div class="absolute bottom-4 right-4 w-6 h-6 border-b-2 border-r-2 border-brand-400 rounded-br-lg"></div>
                </div>
                <button onclick="app.stopScan()" class="absolute bottom-12 left-1/2 -translate-x-1/2 w-14 h-14 bg-white/20 backdrop-blur rounded-full flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ============ APP STATE ============
        const app = {
            currentScreen: 'welcome',
            darkMode: false,
            user: null,
            todayLog: {
                calories: { consumed: 1240, goal: 2200 },
                protein: { consumed: 89, goal: 165 },
                carbs: { consumed: 112, goal: 220 },
                fat: { consumed: 48, goal: 73 },
                fiber: { consumed: 18, goal: 35 },
                sugar: { consumed: 32, goal: 50 },
                water: { consumed: 5, goal: 8 }
            },
            foodQuality: {
                score: 78,
                ultraProcessed: 15,
                avgAdditiveRating: 3.2,
                artificialCount: 2,
                seedOilIntake: 8,
                addedSugar: 12
            },
            meals: [
                { id: 1, name: 'Breakfast', time: '7:30 AM', foods: [
                    { name: 'Greek Yogurt, Plain', brand: 'Fage', calories: 130, protein: 23, carbs: 6, fat: 0, score: 92, qty: '1 cup' },
                    { name: 'Blueberries, Fresh', brand: 'Organic', calories: 84, protein: 1, carbs: 21, fat: 0, score: 96, qty: '1 cup' },
                    { name: 'Honey, Raw', brand: 'Local', calories: 64, protein: 0, carbs: 17, fat: 0, score: 72, qty: '1 tbsp' }
                ]},
                { id: 2, name: 'Lunch', time: '12:15 PM', foods: [
                    { name: 'Grilled Chicken Breast', brand: 'Homemade', calories: 284, protein: 53, carbs: 0, fat: 6, score: 95, qty: '6 oz' },
                    { name: 'Quinoa, Cooked', brand: 'Organic', calories: 222, protein: 8, carbs: 39, fat: 4, score: 88, qty: '1 cup' },
                    { name: 'Olive Oil, Extra Virgin', brand: 'California Olive', calories: 120, protein: 0, carbs: 0, fat: 14, score: 91, qty: '1 tbsp' }
                ]},
                { id: 3, name: 'Snack', time: '3:00 PM', foods: [
                    { name: 'Protein Bar', brand: 'RXBAR', calories: 210, protein: 12, carbs: 24, fat: 9, score: 68, qty: '1 bar' }
                ]}
            ],
            ingredientDetail: null,
            scannedProduct: null,

            init() {
                this.updateClock();
                setInterval(() => this.updateClock(), 60000);
                this.checkDarkMode();
                this.navigate('welcome');
            },

            updateClock() {
                const now = new Date();
                const hours = now.getHours();
                const mins = now.getMinutes();
                const ampm = hours >= 12 ? 'PM' : 'AM';
                const displayHours = hours % 12 || 12;
                const displayMins = mins.toString().padStart(2, '0');
                document.getElementById('clock').textContent = `${displayHours}:${displayMins}`;
            },

            checkDarkMode() {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    this.darkMode = true;
                    document.documentElement.classList.add('dark');
                }
            },

            toggleDarkMode() {
                this.darkMode = !this.darkMode;
                document.documentElement.classList.toggle('dark');
            },

            navigate(screen) {
                this.currentScreen = screen;
                const container = document.getElementById('screenContainer');
                const nav = document.getElementById('bottomNav');
                
                // Show/hide bottom nav
                const navScreens = ['dashboard', 'diary', 'log', 'progress', 'profile'];
                if (navScreens.includes(screen)) {
                    nav.classList.remove('hidden');
                    // Update active tab
                    document.querySelectorAll('.nav-btn').forEach(btn => {
                        btn.classList.remove('tab-active', 'text-brand-600', 'dark:text-brand-400');
                        if (btn.dataset.screen === screen) {
                            btn.classList.add('tab-active', 'text-brand-600', 'dark:text-brand-400');
                        } else {
                            btn.classList.add('text-gray-400', 'dark:text-slate-500');
                        }
                    });
                } else {
                    nav.classList.add('hidden');
                }

                // Render screen
                container.innerHTML = this.screens[screen] ? this.screens[screen]() : '';
                container.scrollTop = 0;
                
                // Animate entry
                const content = container.firstElementChild;
                if (content) content.classList.add('page-transition');
            },

            // ============ SCREEN RENDERERS ============
            screens: {
                welcome() {
                    return `
                    <div class="h-full flex flex-col items-center justify-center px-8 pb-20">
                        <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center mb-8 shadow-xl shadow-brand-500/20 micro-bounce">
                            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        </div>
                        <h1 class="text-3xl font-bold mb-2 tracking-tight">NutriLens AI</h1>
                        <p class="text-gray-500 dark:text-slate-400 text-center text-sm leading-relaxed mb-10 max-w-[260px]">
                            See beyond calories. Understand every ingredient, its quality, and how it truly affects your body.
                        </p>
                        <div class="w-full space-y-3">
                            <button onclick="app.navigate('onboarding')" class="w-full h-14 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-2xl shadow-lg shadow-brand-500/25 transition-all active:scale-[0.98]">
                                Get Started
                            </button>
                            <button onclick="app.navigate('dashboard')" class="w-full h-14 bg-gray-100 dark:bg-slate-800 hover:bg-gray-200 dark:hover:bg-slate-700 font-medium rounded-2xl transition-all text-sm">
                                Continue as Guest
                            </button>
                        </div>
                        <p class="mt-6 text-xs text-gray-400 dark:text-slate-500">
                            By continuing, you agree to our Terms and Privacy Policy
                        </p>
                    </div>`;
                },

                onboarding() {
                    return `
                    <div class="h-full flex flex-col px-6 pt-4 pb-6">
                        <div class="flex items-center justify-between mb-8">
                            <button onclick="app.navigate('welcome')" class="p-2 -ml-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
                            </button>
                            <div class="flex gap-1.5">
                                <div class="w-8 h-1.5 rounded-full bg-brand-500"></div>
                                <div class="w-8 h-1.5 rounded-full bg-gray-200 dark:bg-slate-700"></div>
                                <div class="w-8 h-1.5 rounded-full bg-gray-200 dark:bg-slate-700"></div>
                            </div>
                            <div class="w-10"></div>
                        </div>
                        <h2 class="text-2xl font-bold mb-6">About You</h2>
                        <div class="space-y-5 flex-1">
                            <div>
                                <label class="text-sm font-medium text-gray-500 dark:text-slate-400 mb-2 block">Age</label>
                                <input type="number" value="32" class="w-full h-14 px-4 bg-gray-50 dark:bg-slate-800 rounded-2xl text-lg font-semibold border-0 focus:ring-2 focus:ring-brand-500 outline-none" placeholder="Years">
                            </div>
                            <div>
                                <label class="text-sm font-medium text-gray-500 dark:text-slate-400 mb-2 block">Sex</label>
                                <div class="flex gap-3">
                                    <button class="flex-1 h-14 rounded-2xl bg-brand-50 dark:bg-brand-900/30 border-2 border-brand-500 text-brand-700 dark:text-brand-300 font-semibold">Male</button>
                                    <button class="flex-1 h-14 rounded-2xl bg-gray-50 dark:bg-slate-800 border-2 border-transparent text-gray-500 font-medium">Female</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-sm font-medium text-gray-500 dark:text-slate-400 mb-2 block">Height</label>
                                    <input type="text" value="5'11"" class="w-full h-14 px-4 bg-gray-50 dark:bg-slate-800 rounded-2xl text-lg font-semibold border-0 outline-none">

                                <span class="text-[10px] px-2 py-0.5 rounded-full bg-blue-100 dark:bg-blue-900/30 text-blue-700 font-medium">42g protein</span>
                            </div>
                        </div>

                        <button class="w-full h-14 bg-brand-500 text-white font-semibold rounded-2xl shadow-lg shadow-brand-500/25">
                            Confirm & Log Meal
                        </button>
                    </div>`;
                },

                scannedProduct() {
                    const product = app.scannedProduct || {
                        name: 'Organic Greek Yogurt',
                        brand: 'Fage',
                        score: 92,
                        calories: 130,
                        protein: 23,
                        carbs: 6,
                        fat: 0,
                        ingredients: ['Cultured Grade A Milk', 'Live Active Cultures'],
                        warnings: [],
                        processing: 'Minimally Processed',
                        origin: 'USA'
                    };

                    const scoreColor = product.score >= 90 ? 'score-excellent' : product.score >= 80 ? 'score-verygood' : product.score >= 70 ? 'score-good' : 'score-fair';
                    
                    return `
                    <div class="px-5 pt-2 pb-6">
                        <div class="flex items-center gap-3 mb-6">
                            <button onclick="app.navigate('log')" class="p-2 -ml-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
                            </button>
                            <h1 class="text-lg font-bold">Scanned Product</h1>
                        </div>

                        <div class="flex items-center gap-4 mb-6">
                            <div class="w-24 h-24 rounded-2xl bg-gradient-to-br from-blue-100 to-indigo-100 dark:from-blue-900/30 dark:to-indigo-900/30 flex items-center justify-center text-4xl">
                                🥣
                            </div>
                            <div>
                                <h2 class="text-xl font-bold">${product.name}</h2>
                                <p class="text-sm text-gray-400">${product.brand}</p>
                                <div class="flex items-center gap-2 mt-2">
                                    <span class="text-3xl font-bold ${scoreColor}">${product.score}</span>
                                    <span class="text-xs px-2 py-0.5 rounded-full bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-300 font-medium">Excellent</span>
                                </div>
                            </div>
                        </div>

                        <div class="glass-card rounded-3xl p-5 mb-5">
                            <p class="text-sm font-semibold mb-3">Quick Facts</p>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-white dark:bg-slate-800 rounded-xl p-3">
                                    <p class="text-[10px] text-gray-400 uppercase">Processing</p>
                                    <p class="text-sm font-semibold text-green-600">${product.processing}</p>
                                </div>
                                <div class="bg-white dark:bg-slate-800 rounded-xl p-3">
                                    <p class="text-[10px] text-gray-400 uppercase">Origin</p>
                                    <p class="text-sm font-semibold">${product.origin}</p>
                                </div>
                                <div class="bg-white dark:bg-slate-800 rounded-xl p-3">
                                    <p class="text-[10px] text-gray-400 uppercase">Additives</p>
                                    <p class="text-sm font-semibold text-green-600">None</p>
                                </div>
                                <div class="bg-white dark:bg-slate-800 rounded-xl p-3">
                                    <p class="text-[10px] text-gray-400 uppercase">Organic</p>
                                    <p class="text-sm font-semibold text-green-600">Yes ✓</p>
                                </div>
                            </div>
                        </div>

                        <div class="glass-card rounded-3xl p-5 mb-5">
                            <p class="text-sm font-semibold mb-3">Nutrition per Serving</p>
                            <div class="grid grid-cols-4 gap-3 text-center">
                                <div>
                                    <p class="text-lg font-bold">${product.calories}</p>
                                    <p class="text-[10px] text-gray-400">kcal</p>
                                </div>
                                <div>
                                    <p class="text-lg font-bold text-blue-500">${product.protein}g</p>
                                    <p class="text-[10px] text-gray-400">protein</p>
                                </div>
                                <div>
                                    <p class="text-lg font-bold text-amber-500">${product.carbs}g</p>
                                    <p class="text-[10px] text-gray-400">carbs</p>
                                </div>
                                <div>
                                    <p class="text-lg font-bold text-rose-400">${product.fat}g</p>
                                    <p class="text-[10px] text-gray-400">fat</p>
                                </div>
                            </div>
                        </div>

                        <div class="bg-green-50 dark:bg-green-900/20 rounded-3xl p-5 mb-6">
                            <div class="flex items-center gap-2 mb-2">
                                <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/></svg>
                                <span class="text-sm font-semibold text-green-800 dark:text-green-200">Clean Choice</span>
                            </div>
                            <p class="text-xs text-green-700 dark:text-green-300 leading-relaxed">
                                This product contains only two ingredients: cultured milk and live active cultures. No additives, no sweeteners, no preservatives. Excellent protein-to-calorie ratio.
                            </p>
                        </div>

                        <button class="w-full h-14 bg-brand-500 text-white font-semibold rounded-2xl shadow-lg shadow-brand-500/25 mb-3">
                            Add to Diary
                        </button>
                        <button class="w-full h-14 bg-gray-100 dark:bg-slate-800 font-medium rounded-2xl text-sm">
                            View Full Analysis
                        </button>
                    </div>`;
                }
            },

            // ============ ACTIONS ============
            showFoodDetail(foodName) {
                this.currentFood = {
                    name: foodName,
                    brand: 'Generic',
                    calories: 210,
                    protein: 12,
                    carbs: 24,
                    fat: 9,
                    score: 68,
                    ingredients: [
                        { name: 'Dates', score: 85, natural: true },
                        { name: 'Egg Whites', score: 92, natural: true },
                        { name: 'Almonds', score: 88, natural: true },
                        { name: 'Cashews', score: 86, natural: true },
                        { name: 'Cocoa', score: 78, natural: true },
                        { name: 'Natural Flavors', score: 45, natural: false, warn: true },
                        { name: 'Sea Salt', score: 70, natural: true }
                    ]
                };
                this.navigate('foodDetail');
            },

            showIngredientDetail(name) {
                this.ingredientDetail = {
                    name: name,
                    category: name === 'Natural Flavors' ? 'Flavoring Agent' : 'Food Ingredient',
                    score: name === 'Natural Flavors' ? 45 : 85
                };
                this.openBottomSheet('ingredientDetail');
            },

            openBottomSheet(content) {
                const sheet = document.getElementById('bottomSheet');
                const overlay = document.getElementById('overlay');
                const contentDiv = document.getElementById('bottomSheetContent');
                
                contentDiv.innerHTML = this.screens[content] ? this.screens[content]() : '';
                sheet.classList.add('open');
                overlay.classList.add('open');
            },

            closeBottomSheet() {
                document.getElementById('bottomSheet').classList.remove('open');
                document.getElementById('overlay').classList.remove('open');
            },

            startScan() {
                document.getElementById('scanOverlay').classList.remove('hidden');
                // Simulate scan completion
                setTimeout(() => {
                    this.stopScan();
                    this.scannedProduct = {
                        name: 'Organic Greek Yogurt',
                        brand: 'Fage',
                        score: 92,
                        calories: 130,
                        protein: 23,
                        carbs: 6,
                        fat: 0,
                        processing: 'Minimally Processed',
                        origin: 'USA'
                    };
                    this.navigate('scannedProduct');
                }, 2500);
            },

            stopScan() {
                document.getElementById('scanOverlay').classList.add('hidden');
            }
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
