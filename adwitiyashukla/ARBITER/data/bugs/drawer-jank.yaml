id: drawer-jank
title: "Side menu animation stutters instead of sliding"
app: drawer-jank.html
category: animation-jank
ground_truth: REPRODUCED
control: false
pattern: "Hand-rolled timer animation with coarse steps and main-thread blocking"
max_steps: 10
report: |
  **Describe the bug**
  Opening the side menu is supposed to be a smooth slide. On my machine it jumps in a
  couple of big visible steps and the page freezes for a moment while it happens.

  **To Reproduce**
  1. Click "Open menu"
  2. Watch the drawer come in from the left

  **Expected behavior**
  A smooth, continuous slide.

  **Actual behavior**
  The drawer teleports in a few chunks and the UI is unresponsive during the transition.
