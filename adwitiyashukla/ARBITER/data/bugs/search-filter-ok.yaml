id: search-filter-ok
title: "Search returns nothing when the query is typed in capitals"
app: search-filter-ok.html
category: negative-control
ground_truth: NOT_REPRODUCED
control: true
pattern: "False report. The filter is correctly case-insensitive."
max_steps: 12
report: |
  **Describe the bug**
  Searching works with lowercase but typing the name in capitals returns an empty list.

  **To Reproduce**
  1. Type "ADA" into the search box

  **Expected behavior**
  Ada Lovelace is listed.

  **Actual behavior**
  No results at all.
