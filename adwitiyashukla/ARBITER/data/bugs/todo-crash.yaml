id: todo-crash
title: "App breaks when the last task is deleted"
app: todo-crash.html
category: crash
ground_truth: REPRODUCED
control: false
pattern: "Null dereference on an empty collection after the final item is removed"
max_steps: 14
report: |
  **Describe the bug**
  If I delete tasks one by one, everything is fine until the list is empty. Removing the
  very last task kills the page: the summary line disappears and nothing responds after that.

  **To Reproduce**
  1. Start with the default task list
  2. Delete every task until only one is left
  3. Delete that last one

  **Expected behavior**
  An empty list, ideally with something like "No tasks yet".

  **Actual behavior**
  The summary line vanishes and the console shows an error.
