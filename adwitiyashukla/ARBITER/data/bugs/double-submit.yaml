id: double-submit
title: "Feedback is recorded twice on a fast double click"
app: double-submit.html
category: race-condition
ground_truth: REPRODUCED
control: false
pattern: "Missing in-flight guard on a submit handler"
max_steps: 12
report: |
  **Describe the bug**
  Impatient double clicking on Submit files the same feedback twice.

  **To Reproduce**
  1. Click Submit twice in quick succession

  **Expected behavior**
  One entry in the submitted list.

  **Actual behavior**
  Two identical entries.
