id: theme-persist-ok
title: "Dark mode switches itself off when moving between tabs"
app: theme-persist-ok.html
category: negative-control
ground_truth: NOT_REPRODUCED
control: true
pattern: "False report. Theme state survives the view change."
max_steps: 12
report: |
  **Describe the bug**
  I turn on dark mode, go to the Profile tab and come back, and the page is light again
  with the checkbox cleared.

  **To Reproduce**
  1. Tick "Dark mode"
  2. Click Profile
  3. Click Home

  **Expected behavior**
  Still dark, checkbox still ticked.

  **Actual behavior**
  Back to light mode.
