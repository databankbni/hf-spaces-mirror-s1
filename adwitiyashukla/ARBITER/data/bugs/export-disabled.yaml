id: export-disabled
title: "Export options stay greyed out after enabling advanced export"
app: export-disabled.html
category: disabled-control
ground_truth: REPRODUCED
control: false
pattern: "Element present but permanently disabled (FieldBook#137 class of bug)"
max_steps: 12
report: |
  **Describe the bug**
  Ticking "Enable advanced export" is supposed to unlock the format, date range, encoding
  and columns dropdowns. They stay greyed out and I cannot change any of them.

  **To Reproduce**
  1. Tick "Enable advanced export"
  2. Try to open any of the four dropdowns below it

  **Expected behavior**
  All four become editable.

  **Actual behavior**
  All four remain disabled.
