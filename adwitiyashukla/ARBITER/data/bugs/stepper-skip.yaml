id: stepper-skip
title: "Quantity jumps straight from 2 to 4"
app: stepper-skip.html
category: logic
ground_truth: REPRODUCED
control: false
pattern: "Off-by-one in an increment branch"
max_steps: 12
report: |
  **Describe the bug**
  I cannot order 3 of anything. The plus button skips that number.

  **To Reproduce**
  1. Press + until the quantity reads 2
  2. Press + once more

  **Expected behavior**
  The quantity reads 3.

  **Actual behavior**
  The quantity reads 4.
