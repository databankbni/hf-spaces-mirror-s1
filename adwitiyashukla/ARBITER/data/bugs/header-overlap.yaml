id: header-overlap
title: "Top bar covers the first card on a narrow window"
app: header-overlap.html
category: responsive-layout
ground_truth: REPRODUCED
control: false
pattern: "Hard-coded spacer under a fixed header that wraps at small widths"
viewport: {width: 520, height: 720}
max_steps: 10
report: |
  **Describe the bug**
  On a narrow browser window the dark bar at the top sits on top of the Revenue card and
  hides part of it.

  **Expected behavior**
  Content starts below the bar at every width.

  **Actual behavior**
  The bar overlaps the first card.
