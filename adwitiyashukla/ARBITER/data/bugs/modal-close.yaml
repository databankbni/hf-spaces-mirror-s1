id: modal-close
title: "Settings dialog cannot be dismissed with the X button"
app: modal-close.html
category: unresponsive-control
ground_truth: REPRODUCED
control: false
pattern: "Handler bound to the wrong node, control renders but does nothing"
max_steps: 12
report: |
  **Describe the bug**
  The X in the corner of the Settings dialog does nothing. I have to use Cancel to get out.

  **To Reproduce**
  1. Click "Open settings"
  2. Click the X button in the top right of the dialog

  **Expected behavior**
  The dialog closes.

  **Actual behavior**
  Nothing happens, the dialog stays on screen.
