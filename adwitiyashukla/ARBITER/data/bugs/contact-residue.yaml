id: contact-residue
title: "Typed fragment stays in the To field after picking a suggestion"
app: contact-residue.html
category: state-residue
ground_truth: REPRODUCED
control: false
pattern: "Residual input text next to a committed chip (qksms#1155 class of bug)"
max_steps: 14
report: |
  **Describe the bug**
  When I type part of a name and then click the suggested contact, I end up with both the
  contact and the letters I typed still sitting in the box.

  **To Reproduce**
  1. Type "Joh" into the To field
  2. Click the suggested contact from the dropdown

  **Expected behavior**
  Only the contact chip remains, the input is cleared.

  **Actual behavior**
  The chip is added but "Joh" is still in the input.
