name: Sync to Hugging Face Hub

on:
  push:
    branches: [master]

  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1 # Загружаем только самое последнее состояние файлов

      - name: Deploy clean backend to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Физически удаляем папки фронтенда с картинками
          rm -rf Fon Fon_2 SSO VO_11 VO_SSO pages

          # 2. Стираем локальную историю Git в контейнере сборщика
          rm -rf .git

          # 3. Инициализируем чистый Git репозиторий с нуля
          git init
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          
          # 4. Индексируем только оставшиеся файлы бэкенда Strapi
          git add .
          git commit -m "Clean deploy Strapi backend"
          
          # 5. Отправляем этот единственный чистый коммит в ветку main на Hugging Face
          git push --force https://narxselune:$HF_TOKEN@huggingface.co/spaces/narxselune/bsac-backend HEAD:main