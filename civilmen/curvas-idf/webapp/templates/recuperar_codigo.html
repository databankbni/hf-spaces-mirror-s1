<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva contraseña — HYDROFRA</title>
  <style>
    :root { --navy:#0d2a5e; --navy2:#10387f; --line:#d9dee8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:linear-gradient(135deg,#0b2450,#0f3170 45%,#071a3d); color:#eef3fb;
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { width:100%; max-width:420px; background:#fff; color:#1a2230; border-radius:18px;
      padding:34px 30px; box-shadow:0 18px 50px rgba(7,26,61,.45); }
    .logo { font-weight:800; letter-spacing:.06em; font-size:26px; color:var(--navy); text-align:center; }
    h1 { font-size:19px; margin:22px 0 4px; color:var(--navy); }
    p.lead { font-size:13.5px; color:#5a6577; margin:0 0 6px; line-height:1.5; }
    .mail { font-weight:700; color:var(--navy); }
    label { display:block; font-size:12.5px; font-weight:600; color:#3a4557; margin:14px 0 6px; }
    input { width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px; font-size:15px; outline:none; }
    input.code { font-size:22px; letter-spacing:.35em; text-align:center; font-family:'IBM Plex Mono',monospace; }
    input:focus { border-color:var(--navy2); box-shadow:0 0 0 3px rgba(16,56,127,.12); }
    button { width:100%; margin-top:20px; padding:13px; border:none; border-radius:10px;
      background:var(--navy); color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
    button:hover { background:var(--navy2); }
    .row { margin-top:16px; text-align:center; font-size:13px; }
    .row a, .row button.link { color:var(--navy2); text-decoration:none; font-weight:600; background:none; border:none; cursor:pointer; font-size:13px; padding:0; width:auto; }
    .sep { color:#b7c0d0; margin:0 8px; }
    .flash { background:#fdf2e2; color:#8a5a12; border:1px solid #f1dcae; border-radius:10px;
      padding:10px 12px; font-size:13px; margin:14px 0 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">HYDROFRA</div>
    <h1>Nueva contraseña</h1>
    <p class="lead">Enviamos un código a <span class="mail">{{ email }}</span>.
      Ingresalo y elegí tu nueva contraseña.</p>
    {% with ms = get_flashed_messages() %}{% if ms %}{% for m in ms %}
      <div class="flash">{{ m }}</div>{% endfor %}{% endif %}{% endwith %}
    <form method="POST" action="{{ url_for('recuperar_codigo') }}">
      <label for="codigo">Código de verificación</label>
      <input id="codigo" name="codigo" class="code" inputmode="numeric" maxlength="6"
             pattern="[0-9]{6}" placeholder="000000" required autofocus>
      <label for="password">Nueva contraseña</label>
      <input id="password" name="password" type="password" minlength="6" required
             placeholder="Mínimo 6 caracteres" autocomplete="new-password">
      <button type="submit">Cambiar contraseña y entrar</button>
    </form>
    <div class="row">
      <form method="POST" action="{{ url_for('recuperar_reenviar') }}" style="display:inline;">
        <button type="submit" class="link">Reenviar código</button>
      </form>
      <span class="sep">·</span>
      <a href="{{ url_for('login') }}">Volver al ingreso</a>
    </div>
  </div>
</body>
</html>
