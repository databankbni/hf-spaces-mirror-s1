name: Verify ClimaFlora production v1.7 (archived rollback check)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Archived production generation notice
        run: |
          echo 'ClimaFlora v1.7 is retained only as a rollback catalog.'
          echo 'Automatic production verification is intentionally disabled now that v1.8 is canonical.'
