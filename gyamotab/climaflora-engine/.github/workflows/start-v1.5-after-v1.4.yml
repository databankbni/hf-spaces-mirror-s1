name: Start ClimaFlora v1.5 after v1.4

on:
  workflow_run:
    workflows: ["Build ClimaFlora catalog v1.4 candidate"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-v1-5:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch v1.5 global soil build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/build-catalog-v1.5.yml/dispatches" \
            --data '{"ref":"main"}'
