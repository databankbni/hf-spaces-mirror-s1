name: Legacy Wikimedia media v1.1 (archived)

# Superseded by Media v2. ClimaFlora media development now uses only
# Pl@ntNet/GBIF and World Flora Online. This workflow is intentionally inert
# except for an explicit manual invocation kept as a historical marker.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Explain archived workflow
        run: |
          echo 'Wikimedia media v1.1 is archived.'
          echo 'Use Media v2: Pl@ntNet/GBIF + World Flora Online.'
          echo 'No media ingestion or deployment is performed by this workflow.'
