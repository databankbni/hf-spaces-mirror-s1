name: Deploy canonical ClimaFlora frontend to OVH

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-ovh-frontend-current.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-ovh-canonical-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
      OVH_SFTP_PORT: ${{ secrets.OVH_SFTP_PORT }}
      OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
      OVH_SFTP_REMOTE_DIR: ${{ secrets.OVH_SFTP_REMOTE_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate frontend and OVH secrets
        shell: bash
        run: |
          set -euo pipefail
          for file in frontend/index.html frontend/tarifs.html frontend/static/config.js frontend/static/media-v2.js frontend/static/auth.js frontend/static/billing.js frontend/static/auth.css frontend/static/billing.css frontend/static/climaflora.css; do
            test -f "$file"
          done
          node --check frontend/static/media-v2.js
          node --check frontend/static/auth.js
          node --check frontend/static/billing.js
          missing=0
          for name in OVH_SFTP_HOST OVH_SFTP_USER OVH_SFTP_PASSWORD OVH_SFTP_REMOTE_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is missing"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Install SFTP client
        run: python -m pip install --disable-pip-version-check --quiet 'paramiko>=3.5,<5'

      - name: Upload frontend without deleting remote data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, posixpath
          from pathlib import Path
          import paramiko

          host = os.environ['OVH_SFTP_HOST']
          port = int(os.environ.get('OVH_SFTP_PORT') or 22)
          user = os.environ['OVH_SFTP_USER']
          password = os.environ['OVH_SFTP_PASSWORD']
          remote_root = os.environ['OVH_SFTP_REMOTE_DIR'].rstrip('/')
          local_root = Path('frontend')

          transport = paramiko.Transport((host, port))
          transport.connect(username=user, password=password)
          sftp = paramiko.SFTPClient.from_transport(transport)

          def mkdir_p(path):
              parts = []
              cur = path
              while cur not in ('', '/'):
                  parts.append(cur)
                  cur = posixpath.dirname(cur)
              for part in reversed(parts):
                  try:
                      sftp.stat(part)
                  except FileNotFoundError:
                      sftp.mkdir(part)

          mkdir_p(remote_root)
          uploaded = []
          for local in sorted(local_root.rglob('*')):
              if not local.is_file():
                  continue
              rel = local.relative_to(local_root).as_posix()
              remote = posixpath.join(remote_root, rel)
              mkdir_p(posixpath.dirname(remote))
              print(f'upload {rel} -> {remote}')
              sftp.put(str(local), remote)
              uploaded.append(rel)

          sftp.close()
          transport.close()
          print(f'uploaded_files={len(uploaded)}')
          PY

      - name: Verify public monetization frontend byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          base = 'https://shugoan.com/climaflora/'
          targets = [
              'index.html',
              'tarifs.html',
              'static/config.js',
              'static/media-v2.js',
              'static/auth.js',
              'static/billing.js',
              'static/auth.css',
              'static/billing.css',
              'static/climaflora.css',
              'static/app.js',
          ]
          report = {}
          for attempt in range(1, 21):
              report = {}
              all_ok = True
              for rel in targets:
                  local_sha = hashlib.sha256((Path('frontend') / rel).read_bytes()).hexdigest()
                  remote_rel = '' if rel == 'index.html' else rel
                  url = base + remote_rel + '?deploy=' + str(time.time_ns())
                  try:
                      req = urllib.request.Request(url, headers={
                          'Cache-Control': 'no-cache',
                          'User-Agent': 'ClimaFlora-OVH-deploy/2.0',
                      })
                      with urllib.request.urlopen(req, timeout=25) as response:
                          body = response.read()
                          status = response.status
                      live_sha = hashlib.sha256(body).hexdigest()
                      ok = status == 200 and live_sha == local_sha
                      report[rel] = {
                          'status': status,
                          'local_sha256': local_sha,
                          'live_sha256': live_sha,
                          'match': ok,
                      }
                  except Exception as exc:
                      ok = False
                      report[rel] = {'match': False, 'error': f'{type(exc).__name__}: {exc}'}
                  all_ok = all_ok and ok

              print(json.dumps({'attempt': attempt, 'files': report}, indent=2), flush=True)
              if all_ok:
                  pricing = urllib.request.urlopen(
                      base + 'tarifs.html?verify=' + str(time.time_ns()), timeout=25
                  ).read().decode('utf-8', 'replace')
                  assert 'data-checkout-plan="PLUS"' in pricing
                  assert 'data-checkout-plan="PRO"' in pricing
                  assert 'static/auth.js' in pricing
                  assert 'static/billing.js' in pricing
                  status = {
                      'status': 'ready',
                      'verified_at': datetime.now(timezone.utc).isoformat(),
                      'commit': os.environ['GITHUB_SHA'],
                      'public_url': base,
                      'monetization_frontend': 'v1',
                      'verified_files': report,
                  }
                  Path('/tmp/ovh-frontend-status.json').write_text(
                      json.dumps(status, indent=2) + '\n', encoding='utf-8'
                  )
                  raise SystemExit(0)
              time.sleep(4)

          Path('/tmp/ovh-frontend-status.json').write_text(
              json.dumps({
                  'status': 'failed',
                  'commit': os.environ['GITHUB_SHA'],
                  'verified_files': report,
              }, indent=2) + '\n',
              encoding='utf-8',
          )
          raise SystemExit('OVH frontend verification failed')
          PY

      - name: Persist OVH deployment status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if [ -f /tmp/ovh-frontend-status.json ]; then
              cp /tmp/ovh-frontend-status.json .github/ovh-frontend-status.json
            else
              printf '{"status":"failed","commit":"%s","reason":"status file missing"}\n' "$GITHUB_SHA" > .github/ovh-frontend-status.json
            fi
            git add .github/ovh-frontend-status.json
            git diff --cached --quiet && exit 0
            git commit -m 'Record OVH monetization frontend deployment [skip ci]'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
