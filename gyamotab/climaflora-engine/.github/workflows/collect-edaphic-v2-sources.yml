name: Collect ClimaFlora edaphic v2 sources

on:
  workflow_dispatch:
  push:
    branches: [edaphic-v2.0-enrichment]
    paths:
      - '.github/workflows/collect-edaphic-v2-sources.yml'
      - '.github/tools/collect_edaphic_v2_sources.py'

permissions:
  contents: write

concurrency:
  group: collect-edaphic-v2-sources
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      V19_URL: https://shugoan.com/climaflora/data/climaflora_global_plants_v1_9.sqlite.zst
      V19_ZST_SHA: 5851572bd48dea34d3b69e16a78126d1ac149c907e5db8fa7af1bc36812779dc
      USDA_PLANT_LIST_URL: https://plants.sc.egov.usda.gov/DocumentLibrary/Txt/plantlst.txt
      BASEFLOR_URL: https://web.archive.org/web/20231002005253id_/https://philippe.julve.pagesperso-orange.fr/baseflor.xlsx
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Prepare runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          python -m pip install --quiet requests openpyxl

      - name: Download immutable catalog and source indexes
        run: |
          set -euo pipefail
          curl -fL --retry 6 --retry-all-errors "$V19_URL" -o climaflora_global_plants_v1_9.sqlite.zst
          echo "$V19_ZST_SHA  climaflora_global_plants_v1_9.sqlite.zst" | sha256sum -c -
          zstd -d -f climaflora_global_plants_v1_9.sqlite.zst -o climaflora_global_plants_v1_9.sqlite
          curl -fL --retry 6 --retry-all-errors -A 'ClimaFlora scientific edaphic enrichment/2.0' "$USDA_PLANT_LIST_URL" -o usda_plantlst.txt
          curl -fL --retry 6 --retry-all-errors -A 'Mozilla/5.0 ClimaFlora scientific edaphic enrichment/2.0' "$BASEFLOR_URL" -o baseflor_2023_10.xlsx
          sha256sum usda_plantlst.txt baseflor_2023_10.xlsx | tee edaphic_v2_source_files.sha256

      - name: Collect USDA growth requirements for exact ClimaFlora matches
        run: |
          set -euo pipefail
          python .github/tools/collect_edaphic_v2_sources.py \
            --catalog climaflora_global_plants_v1_9.sqlite \
            --plant-list usda_plantlst.txt \
            --output usda_edaphic_growth_requirements.jsonl \
            --report usda_edaphic_collection.report.json \
            --workers 20
          python - <<'PY'
          import json
          r=json.load(open('usda_edaphic_collection.report.json'))
          s=r['stats']
          assert r['status']=='ready'
          assert s['profiles_attempted'] >= 20000, s
          assert s['taxa_with_growth_requirements'] > 0, s
          assert s['taxa_with_complete_ph_range'] > 0, s
          assert s['outcomes'].get('UNHANDLED_ERROR',0) == 0, s
          unavailable=s['outcomes'].get('PROFILE_UNAVAILABLE',0)+s['outcomes'].get('CHARACTERISTICS_UNAVAILABLE',0)
          assert unavailable <= max(25, int(s['profiles_attempted']*0.005)), s
          print(json.dumps(s,indent=2))
          PY
          sha256sum usda_edaphic_growth_requirements.jsonl usda_edaphic_collection.report.json >> edaphic_v2_source_files.sha256

      - name: Upload reproducible v2 source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: climaflora-edaphic-v2-sources
          compression-level: 6
          retention-days: 30
          path: |
            usda_plantlst.txt
            usda_edaphic_growth_requirements.jsonl
            usda_edaphic_collection.report.json
            baseflor_2023_10.xlsx
            edaphic_v2_source_files.sha256

      - name: Record source collection status
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.load(open('usda_edaphic_collection.report.json'))
          out={
            'status':'ready',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'commit':os.environ['GITHUB_SHA'],
            'branch':os.environ['GITHUB_REF_NAME'],
            'catalog_version':'1.9.0',
            'usda':r,
            'source_hashes':Path('edaphic_v2_source_files.sha256').read_text().splitlines(),
            'baseflor':{
              'version':'2023.10',
              'source_url':os.environ['BASEFLOR_URL'],
              'license':'ODbL 1.0 / CC BY-SA 2.0',
            },
          }
          Path('/tmp/edaphic-v2-source-status.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY
          BRANCH="$GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH" && git reset --hard "origin/$BRANCH"
            cp /tmp/edaphic-v2-source-status.json .github/edaphic-v2-source-status.json
            git add .github/edaphic-v2-source-status.json
            git diff --cached --quiet && exit 0
            git commit -m 'Record ClimaFlora v2 edaphic source snapshot [skip ci]'
            git push origin "HEAD:$BRANCH" && exit 0
            sleep $((attempt*2))
          done
          exit 1
