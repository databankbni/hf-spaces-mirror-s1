name: Probe Baseflor for ClimaFlora v2

on:
  push:
    branches: [edaphic-v2.0-enrichment]
    paths: ['.github/workflows/probe-baseflor-v2.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Download and inspect archived Baseflor
        run: |
          python -m pip install --quiet openpyxl
          python - <<'PY'
          import json, re, urllib.request
          from pathlib import Path
          from openpyxl import load_workbook
          url='https://web.archive.org/web/20231002005253id_/https://philippe.julve.pagesperso-orange.fr/baseflor.xlsx'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 ClimaFlora scientific source audit/2.0'})
          with urllib.request.urlopen(req,timeout=120) as r:
              b=r.read()
          Path('/tmp/baseflor.xlsx').write_bytes(b)
          wb=load_workbook('/tmp/baseflor.xlsx',read_only=True,data_only=True)
          out={'url':url,'bytes':len(b),'sheets':wb.sheetnames,'sheets_detail':{}}
          for sn in wb.sheetnames:
              ws=wb[sn]
              rows=ws.iter_rows(values_only=True)
              preview=[]
              for _ in range(12):
                  try: preview.append(next(rows))
                  except StopIteration: break
              out['sheets_detail'][sn]={'max_row':ws.max_row,'max_column':ws.max_column,'preview':preview}
          Path('/tmp/baseflor-probe.json').write_text(json.dumps(out,indent=2,ensure_ascii=False,default=str)+'\n')
          PY
      - name: Record probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin edaphic-v2.0-enrichment
          git reset --hard origin/edaphic-v2.0-enrichment
          cp /tmp/baseflor-probe.json .github/baseflor-v2-probe.json
          git add .github/baseflor-v2-probe.json
          git commit -m 'Record Baseflor v2 source probe [skip ci]'
          git push origin HEAD:edaphic-v2.0-enrichment
