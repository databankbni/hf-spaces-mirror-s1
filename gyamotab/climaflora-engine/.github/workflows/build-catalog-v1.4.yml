name: Build ClimaFlora catalog v1.4 candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-catalog-v1.4.yml'
      - '.github/tools/build_eive_v1_4.py'
      - '.github/tools/normalize_eive_workbook.py'
      - '.github/tools/build_ecocrop_v1_3.py'

permissions:
  contents: write

concurrency:
  group: build-catalog-v1.4
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          echo "install_build_dependencies" > .github/v1.4-current-step.txt
          sudo apt-get update
          sudo apt-get install -y zstd
          python -m pip install --disable-pip-version-check openpyxl

      - name: Download canonical v1.2
        run: |
          echo "download_canonical_v1_2" > .github/v1.4-current-step.txt
          curl --fail --location --retry 5 --retry-all-errors \
            https://shugoan.com/climaflora/data/climaflora_global_plants_v1_2.sqlite.zst \
            -o climaflora_global_plants_v1_2.sqlite.zst
          zstd -d -f climaflora_global_plants_v1_2.sqlite.zst \
            -o climaflora_global_plants_v1_2.sqlite
          echo "478ebdb3e1868504478d6746c91ef28070c33288b035c5d9aafbcabbaaefbd86  climaflora_global_plants_v1_2.sqlite" \
            | sha256sum -c -

      - name: Download and verify ECOCROP source
        run: |
          echo "download_ecocrop" > .github/v1.4-current-step.txt
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/OpenCLIM/ecocrop/main/EcoCrop_DB.csv \
            -o EcoCrop_DB.csv
          echo "4187e8846336e185c4583165211c5981855e95adfbefd897bd2bd481de48d106  EcoCrop_DB.csv" \
            | sha256sum -c -
          sha256sum EcoCrop_DB.csv | tee ecocrop_source.sha256

      - name: Rebuild v1.3 ECOCROP layer
        run: |
          echo "rebuild_v1_3_ecocrop" > .github/v1.4-current-step.txt
          python .github/tools/build_ecocrop_v1_3.py \
            --base climaflora_global_plants_v1_2.sqlite \
            --csv EcoCrop_DB.csv \
            --output climaflora_global_plants_v1_3.sqlite \
            --report climaflora_global_plants_v1_3.report.json

      - name: Download EIVE 1.0
        run: |
          echo "download_eive_1_0" > .github/v1.4-current-step.txt
          set -euo pipefail
          if ! curl --fail --location --retry 5 --retry-all-errors \
            https://digital.csic.es/bitstream/10261/364054/2/EIVE_Paper_1.0_SM_08.xlsx \
            -o EIVE_Paper_1.0_SM_08.xlsx; then
            curl --fail --location --retry 5 --retry-all-errors \
              'https://zenodo.org/records/7534792/files/EIVE_Paper_1.0_SM_08.xlsx?download=1' \
              -o EIVE_Paper_1.0_SM_08.xlsx
          fi
          test "$(head -c 2 EIVE_Paper_1.0_SM_08.xlsx)" = "PK"
          echo "0f0ce19cd2a781eeed027d8b0acadbcb  EIVE_Paper_1.0_SM_08.xlsx" | md5sum -c -
          sha256sum EIVE_Paper_1.0_SM_08.xlsx | tee eive_source.sha256
          ls -lh EIVE_Paper_1.0_SM_08.xlsx

      - name: Normalize EIVE workbook
        run: |
          echo "normalize_eive_workbook" > .github/v1.4-current-step.txt
          python .github/tools/normalize_eive_workbook.py \
            --input EIVE_Paper_1.0_SM_08.xlsx \
            --output EIVE_normalized.xlsx
          ls -lh EIVE_normalized.xlsx

      - name: Build v1.4 EIVE candidate
        run: |
          echo "build_v1_4_eive" > .github/v1.4-current-step.txt
          EIVE_SHA="$(cut -d' ' -f1 eive_source.sha256)"
          python .github/tools/build_eive_v1_4.py \
            --base climaflora_global_plants_v1_3.sqlite \
            --eive EIVE_normalized.xlsx \
            --eive-sha256 "$EIVE_SHA" \
            --output climaflora_global_plants_v1_4.sqlite \
            --report climaflora_global_plants_v1_4.report.json

      - name: Validate v1.4 candidate
        run: |
          echo "validate_v1_4" > .github/v1.4-current-step.txt
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path

          p = Path('climaflora_global_plants_v1_4.sqlite')
          report = json.loads(Path('climaflora_global_plants_v1_4.report.json').read_text())

          with sqlite3.connect(f'file:{p.resolve()}?mode=ro', uri=True) as con:
              assert con.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
              meta = dict(con.execute('SELECT key,value FROM climaflora_catalog_metadata'))
              assert meta.get('catalog_version') == '1.4.0'
              assert meta.get('scientific_ready') == 'true'
              eive_taxa = con.execute(
                  'SELECT COUNT(DISTINCT taxon_id) FROM soil_indicator_preference'
              ).fetchone()[0]
              indicator_rows = con.execute(
                  'SELECT COUNT(*) FROM soil_indicator_preference'
              ).fetchone()[0]
              total_soil_taxa = con.execute(
                  '''
                  SELECT COUNT(DISTINCT taxon_id) FROM (
                    SELECT taxon_id FROM soil_envelope
                    UNION
                    SELECT taxon_id FROM soil_categorical_preference
                    UNION
                    SELECT taxon_id FROM soil_indicator_preference
                  )
                  '''
              ).fetchone()[0]

          assert eive_taxa >= 10000, eive_taxa
          assert indicator_rows >= 25000, indicator_rows
          assert total_soil_taxa >= 10000, total_soil_taxa
          assert report['eive_matched_unique_taxa'] >= 10000
          print(json.dumps({
              'eive_taxa': eive_taxa,
              'indicator_rows': indicator_rows,
              'soil_taxa_total': total_soil_taxa,
              'report': report,
          }, indent=2))
          PY

      - name: Compress candidate
        run: |
          echo "compress_v1_4" > .github/v1.4-current-step.txt
          zstd -T0 -19 -f climaflora_global_plants_v1_4.sqlite \
            -o climaflora_global_plants_v1_4.sqlite.zst
          sha256sum climaflora_global_plants_v1_4.sqlite \
            | tee climaflora_global_plants_v1_4.sqlite.sha256
          sha256sum climaflora_global_plants_v1_4.sqlite.zst \
            | tee climaflora_global_plants_v1_4.sqlite.zst.sha256
          ls -lh climaflora_global_plants_v1_4.sqlite*

      - name: Upload v1.4 candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: climaflora-global-plants-v1.4-candidate
          compression-level: 0
          retention-days: 14
          path: |
            climaflora_global_plants_v1_4.sqlite.zst
            climaflora_global_plants_v1_4.report.json
            climaflora_global_plants_v1_4.sqlite.sha256
            climaflora_global_plants_v1_4.sqlite.zst.sha256
            eive_source.sha256
            ecocrop_source.sha256

      - name: Persist compact build status
        id: persist_success
        if: success()
        run: |
          echo "persist_success_status" > .github/v1.4-current-step.txt
          python - <<'PY'
          import json, os
          from pathlib import Path

          r = json.loads(Path('climaflora_global_plants_v1_4.report.json').read_text())
          status = {
              'status': 'ready',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'commit': os.environ.get('GITHUB_SHA'),
              'catalog_version': r['catalog_version'],
              'eive_matched_unique_taxa': r['eive_matched_unique_taxa'],
              'eive_indicator_counts': r['eive_indicator_counts'],
              'eive_unmatched_rows': r['stats']['unmatched_rows'],
              'eive_match_strategies': r['stats']['match_strategies'],
              'soil_taxa_total': r['soil_taxa_total'],
              'soil_taxa_coverage': r['soil_taxa_coverage'],
              'soil_envelope_rows': r['soil_envelope_rows'],
              'soil_categorical_rows': r['soil_categorical_rows'],
              'soil_indicator_rows': r['soil_indicator_rows'],
              'sqlite_bytes': r['sqlite_bytes'],
              'sqlite_sha256': r['sqlite_sha256'],
              'zst_sha256': Path('climaflora_global_plants_v1_4.sqlite.zst.sha256').read_text().split()[0],
              'eive_source_sha256': Path('eive_source.sha256').read_text().split()[0],
              'ecocrop_source_sha256': Path('ecocrop_source.sha256').read_text().split()[0],
          }
          Path('/tmp/catalog-v1.4-status.json').write_text(json.dumps(status, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/catalog-v1.4-status.json .github/catalog-v1.4-status.json
            git add .github/catalog-v1.4-status.json
            if git diff --cached --quiet; then
              echo "v1.4 status already current"
              exit 0
            fi
            git commit -m "Record ClimaFlora v1.4 candidate build"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Status push raced with another main update; retrying ($attempt/5)."
            sleep $((attempt * 2))
          done
          echo "Unable to persist successful v1.4 status after retries."
          exit 1

      - name: Persist failed build status
        if: failure() && steps.persist_success.conclusion != 'failure'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          marker = Path('.github/v1.4-current-step.txt')
          status = {
              'status': 'failed',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'commit': os.environ.get('GITHUB_SHA'),
              'failed_step': marker.read_text().strip() if marker.exists() else 'unknown',
          }
          Path('/tmp/catalog-v1.4-status.json').write_text(json.dumps(status, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/catalog-v1.4-status.json .github/catalog-v1.4-status.json
            git add .github/catalog-v1.4-status.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Record failed ClimaFlora v1.4 candidate build"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Failure-status push raced with another main update; retrying ($attempt/5)."
            sleep $((attempt * 2))
          done
          echo "Unable to persist failed v1.4 status after retries."
          exit 1
