# CLIMAFLORA_MEDIA_DB or delete newer Space data during a full repository sync.
# Runtime releases use deploy-hf-runtime-fast.yml.
# Media releases use deploy-media-v2-huggingface.yml.
on:
  workflow_dispatch:

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain replacement workflows
        run: |
          echo 'This legacy Media v1 deployment is retired.'
          echo 'Use Deploy HF runtime (fast) for runtime code.'
          echo 'Use Deploy Media v2 to Hugging Face for the audited media sidecar.'
