name: Dispatch ClimaFlora v2 promotion

on:
  push:
    branches: [edaphic-v2.0-enrichment]
    paths:
      - '.github/workflows/dispatch-promote-v2.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch verified promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run promote-catalog-v2.0.yml --ref edaphic-v2.0-enrichment
