name: Dispatch v1.7 after language-sort fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-v1.7-after-language-fix.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected v1.7 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/build-catalog-v1.7.yml/dispatches \
            -f ref=main \
            -f 'inputs[thumbnail_limit]=5000'
