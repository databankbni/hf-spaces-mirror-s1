name: Build ClimaFlora catalog v1.5 global-soil candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-catalog-v1.5.yml'
      - '.github/tools/build_splot_soil_v1_5.py'

permissions:
  contents: write

concurrency:
  group: build-catalog-v1.5
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          echo "install_build_dependencies" > .github/v1.5-current-step.txt
          sudo apt-get update
          sudo apt-get install -y zstd unzip
          python -m pip install --disable-pip-version-check openpyxl pandas rasterio numpy

      - name: Download canonical v1.2
        run: |
          echo "download_canonical_v1_2" > .github/v1.5-current-step.txt
          curl --fail --location --retry 5 --retry-all-errors \
            https://shugoan.com/climaflora/data/climaflora_global_plants_v1_2.sqlite.zst \
            -o climaflora_global_plants_v1_2.sqlite.zst
          zstd -d -f climaflora_global_plants_v1_2.sqlite.zst \
            -o climaflora_global_plants_v1_2.sqlite
          echo "478ebdb3e1868504478d6746c91ef28070c33288b035c5d9aafbcabbaaefbd86  climaflora_global_plants_v1_2.sqlite" | sha256sum -c -
          rm climaflora_global_plants_v1_2.sqlite.zst

      - name: Rebuild pinned ECOCROP layer
        run: |
          echo "rebuild_ecocrop" > .github/v1.5-current-step.txt
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/OpenCLIM/ecocrop/main/EcoCrop_DB.csv \
            -o EcoCrop_DB.csv
          echo "4187e8846336e185c4583165211c5981855e95adfbefd897bd2bd481de48d106  EcoCrop_DB.csv" | sha256sum -c -
          python .github/tools/build_ecocrop_v1_3.py \
            --base climaflora_global_plants_v1_2.sqlite \
            --csv EcoCrop_DB.csv \
            --output climaflora_global_plants_v1_3.sqlite \
            --report climaflora_global_plants_v1_3.report.json
          rm climaflora_global_plants_v1_2.sqlite EcoCrop_DB.csv

      - name: Download EIVE 1.0
        run: |
          echo "download_eive" > .github/v1.5-current-step.txt
          set -euo pipefail
          if ! curl --fail --location --retry 5 --retry-all-errors \
            https://digital.csic.es/bitstream/10261/364054/2/EIVE_Paper_1.0_SM_08.xlsx \
            -o EIVE_Paper_1.0_SM_08.xlsx; then
            curl --fail --location --retry 5 --retry-all-errors \
              'https://zenodo.org/records/7534792/files/EIVE_Paper_1.0_SM_08.xlsx?download=1' \
              -o EIVE_Paper_1.0_SM_08.xlsx
          fi
          test "$(head -c 2 EIVE_Paper_1.0_SM_08.xlsx)" = "PK"
          echo "0f0ce19cd2a781eeed027d8b0acadbcb  EIVE_Paper_1.0_SM_08.xlsx" | md5sum -c -
          sha256sum EIVE_Paper_1.0_SM_08.xlsx | tee eive_source.sha256

      - name: Normalize EIVE workbook
        run: |
          echo "normalize_eive" > .github/v1.5-current-step.txt
          python .github/tools/normalize_eive_workbook.py \
            --input EIVE_Paper_1.0_SM_08.xlsx \
            --output EIVE_normalized.xlsx

      - name: Rebuild EIVE v1.4 layer
        run: |
          echo "rebuild_eive_v1_4" > .github/v1.5-current-step.txt
          EIVE_SHA="$(cut -d' ' -f1 eive_source.sha256)"
          python .github/tools/build_eive_v1_4.py \
            --base climaflora_global_plants_v1_3.sqlite \
            --eive EIVE_normalized.xlsx \
            --eive-sha256 "$EIVE_SHA" \
            --output climaflora_global_plants_v1_4.sqlite \
            --report climaflora_global_plants_v1_4.report.json
          rm climaflora_global_plants_v1_3.sqlite EIVE_Paper_1.0_SM_08.xlsx EIVE_normalized.xlsx

      - name: Download version-pinned sPlotOpen release
        run: |
          echo "download_splotopen" > .github/v1.5-current-step.txt
          set -euo pipefail
          SPLOT_URL='https://idata.idiv.de/ddm/Data/DownloadZip/3474?version=5779'
          curl --fail --location --retry 8 --retry-all-errors \
            --connect-timeout 60 --max-time 2400 \
            "$SPLOT_URL" -o sPlotOpen.zip
          # iDiv regenerates the ZIP container, so byte-level SHA may vary while
          # the pinned dataset version is unchanged. Preserve the observed SHA
          # as provenance and validate the ZIP and extracted scientific payload.
          sha256sum sPlotOpen.zip | tee splot_source.sha256
          unzip -tq sPlotOpen.zip
          mkdir -p splotopen
          # Info-ZIP returns code 1 for the archive's Windows backslash-path warning,
          # even when extraction succeeds. Accept warning code 1 only; subsequent
          # payload checks verify that the scientific tables were actually extracted.
          set +e
          unzip -oq sPlotOpen.zip -d splotopen
          unzip_rc=$?
          set -e
          if [ "$unzip_rc" -gt 1 ]; then
            echo "sPlotOpen extraction failed with unzip code $unzip_rc" >&2
            exit "$unzip_rc"
          fi
          echo "sPlotOpen unzip return code: $unzip_rc (0=clean, 1=warning accepted)"
          test "$(find splotopen -type f | wc -l)" -gt 5
          python - <<'PY'
          from pathlib import Path
          import csv, re
          root = Path('splotopen')
          def norm(x): return re.sub(r'[^a-z0-9]+', '', str(x).lower())
          found_header = found_dt = False
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.csv', '.txt'}:
                  continue
              try:
                  sample = p.read_text(encoding='utf-8-sig', errors='replace')[:65536]
                  dialect = csv.Sniffer().sniff(sample, delimiters=',;\t|')
                  headers = next(csv.reader(sample.splitlines(), delimiter=dialect.delimiter), [])
              except Exception:
                  continue
              hs = {norm(h) for h in headers}
              found_header |= {'plotobservationid','latitude','longitude'} <= hs
              found_dt |= {'plotobservationid','species'} <= hs
          if not (found_header and found_dt):
              raise SystemExit('sPlotOpen archive lacks expected header and species-plot tables')
          print({'splot_header_table': found_header, 'splot_species_table': found_dt})
          PY
          find splotopen -maxdepth 3 -type f -printf '%p %s bytes\n' | head -50

      - name: Download SoilGrids 1 km topsoil rasters
        run: |
          echo "download_soilgrids" > .github/v1.5-current-step.txt
          set -euo pipefail
          mkdir -p soilgrids
          for var in phh2o cec clay sand cfvo soc nitrogen; do
            file="${var}_5-15cm_mean_1000.tif"
            base="https://files.isric.org/soilgrids/latest/data_aggregated/1000m/${var}"
            curl --fail --location --retry 5 --retry-all-errors "${base}/${file}" -o "soilgrids/${file}"
            expected="$(curl --fail --location --retry 5 "${base}/checksum.sha256.txt" | awk -v f="$file" '$2==f || $2=="*"f {print $1; exit}')"
            test -n "$expected"
            echo "${expected}  soilgrids/${file}" | sha256sum -c -
          done
          sha256sum soilgrids/*.tif | tee soilgrids_sources.sha256
          du -sh soilgrids

      - name: Build v1.5 global realized soil niches
        run: |
          echo "build_v1_5_splot_soilgrids" > .github/v1.5-current-step.txt
          SPLOT_SHA="$(cut -d' ' -f1 splot_source.sha256)"
          python .github/tools/build_splot_soil_v1_5.py \
            --base climaflora_global_plants_v1_4.sqlite \
            --splot-dir splotopen \
            --soil-dir soilgrids \
            --splot-sha256 "$SPLOT_SHA" \
            --output climaflora_global_plants_v1_5.sqlite \
            --report climaflora_global_plants_v1_5.report.json

      - name: Validate v1.5 candidate
        run: |
          echo "validate_v1_5" > .github/v1.5-current-step.txt
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          p = Path('climaflora_global_plants_v1_5.sqlite')
          report = json.loads(Path('climaflora_global_plants_v1_5.report.json').read_text())
          with sqlite3.connect(f'file:{p.resolve()}?mode=ro', uri=True) as con:
              assert con.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
              meta = dict(con.execute('SELECT key,value FROM climaflora_catalog_metadata'))
              assert meta.get('catalog_version') == '1.5.0'
              assert meta.get('scientific_ready') == 'true'
              inferred = con.execute("SELECT COUNT(DISTINCT taxon_id) FROM soil_envelope WHERE method='SPLOTOPEN_SOILGRIDS_REALIZED_NICHE'").fetchone()[0]
              total_soil = con.execute('''SELECT COUNT(DISTINCT taxon_id) FROM (
                SELECT taxon_id FROM soil_envelope
                UNION SELECT taxon_id FROM soil_categorical_preference
                UNION SELECT taxon_id FROM soil_indicator_preference
              )''').fetchone()[0]
          assert report['stats']['consensus_plots'] >= 40000
          assert report['stats']['matched_unique_taxa'] >= 20000
          assert inferred >= 8000, inferred
          assert total_soil >= 15000, total_soil
          print(json.dumps({'inferred_taxa': inferred, 'soil_taxa_total': total_soil, 'stats': report['stats']}, indent=2))
          PY

      - name: Compress candidate
        run: |
          echo "compress_v1_5" > .github/v1.5-current-step.txt
          rm -rf splotopen soilgrids climaflora_global_plants_v1_4.sqlite
          zstd -T0 -19 -f climaflora_global_plants_v1_5.sqlite -o climaflora_global_plants_v1_5.sqlite.zst
          sha256sum climaflora_global_plants_v1_5.sqlite | tee climaflora_global_plants_v1_5.sqlite.sha256
          sha256sum climaflora_global_plants_v1_5.sqlite.zst | tee climaflora_global_plants_v1_5.sqlite.zst.sha256

      - name: Upload v1.5 candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: climaflora-global-plants-v1.5-candidate
          compression-level: 0
          retention-days: 14
          path: |
            climaflora_global_plants_v1_5.sqlite.zst
            climaflora_global_plants_v1_5.report.json
            climaflora_global_plants_v1_5.sqlite.sha256
            climaflora_global_plants_v1_5.sqlite.zst.sha256
            splot_source.sha256
            soilgrids_sources.sha256
            eive_source.sha256

      - name: Persist compact build status
        id: persist_success
        if: success()
        run: |
          echo "persist_success_status" > .github/v1.5-current-step.txt
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path('climaflora_global_plants_v1_5.report.json').read_text())
          status = {
            'status': 'ready', 'run_id': os.environ.get('GITHUB_RUN_ID'), 'commit': os.environ.get('GITHUB_SHA'),
            'catalog_version': r['catalog_version'], 'splot_consensus_plots': r['stats']['consensus_plots'],
            'splot_species_plot_records': r['stats']['species_plot_records'], 'splot_source_unique_names': r['stats']['source_unique_names'],
            'splot_matched_unique_taxa': r['stats']['matched_unique_taxa'], 'splot_eligible_taxa': r['stats']['eligible_taxa'],
            'splot_variable_taxa': r['stats']['variable_taxa'], 'splot_confidence': r['stats']['confidence'],
            'splot_unmatched_species_names': r['stats']['unmatched_species_names'], 'soil_taxa_total': r['soil_taxa_total'],
            'soil_taxa_coverage': r['soil_taxa_coverage'], 'soil_envelope_rows': r['soil_envelope_rows'],
            'soil_categorical_rows': r['soil_categorical_rows'], 'soil_indicator_rows': r['soil_indicator_rows'],
            'sqlite_bytes': r['sqlite_bytes'], 'sqlite_sha256': r['sqlite_sha256'],
            'zst_sha256': Path('climaflora_global_plants_v1_5.sqlite.zst.sha256').read_text().split()[0],
            'splot_source_sha256': Path('splot_source.sha256').read_text().split()[0]
          }
          Path('/tmp/catalog-v1.5-status.json').write_text(json.dumps(status, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            cp /tmp/catalog-v1.5-status.json .github/catalog-v1.5-status.json
            git add .github/catalog-v1.5-status.json
            git diff --cached --quiet && exit 0
            git commit -m "Record ClimaFlora v1.5 global-soil candidate build"
            git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1

      - name: Persist failed build status
        if: failure() && steps.persist_success.conclusion != 'failure'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          marker = Path('.github/v1.5-current-step.txt')
          Path('/tmp/catalog-v1.5-status.json').write_text(json.dumps({
            'status':'failed', 'run_id':os.environ.get('GITHUB_RUN_ID'), 'commit':os.environ.get('GITHUB_SHA'),
            'failed_step': marker.read_text().strip() if marker.exists() else 'unknown'
          }, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            cp /tmp/catalog-v1.5-status.json .github/catalog-v1.5-status.json
            git add .github/catalog-v1.5-status.json
            git diff --cached --quiet && exit 0
            git commit -m "Record failed ClimaFlora v1.5 candidate build"
            git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
