name: Probe BIEN 4.2 for ClimaFlora edaphic enrichment

on:
  push:
    branches: [edaphic-v2.0-enrichment]
    paths: ['.github/workflows/probe-bien-v2.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Query public BIEN database
        run: |
          python -m pip install --quiet psycopg2-binary
          python - <<'PY'
          import json, time
          from pathlib import Path
          import psycopg2
          con=psycopg2.connect(host='vegbiendev.nceas.ucsb.edu',dbname='public_vegbien',user='public_bien',password='bien_public',connect_timeout=30)
          con.autocommit=True
          cur=con.cursor()
          cur.execute("SET statement_timeout='20min'")
          cur.execute("SELECT column_name,data_type FROM information_schema.columns WHERE table_name='view_full_occurrence_individual' ORDER BY ordinal_position")
          columns=cur.fetchall(); names={x[0] for x in columns}
          interesting=[x for x in columns if any(k in x[0].lower() for k in ('lat','long','geo','cultiv','native','introduc','species','observation','centroid','country','datasource'))]
          conditions=["scrubbed_species_binomial IS NOT NULL","latitude IS NOT NULL","longitude IS NOT NULL"]
          if 'is_geovalid' in names: conditions.append('is_geovalid = 1')
          if 'is_centroid' in names: conditions.append('(is_centroid IS NULL OR is_centroid=0)')
          if 'georef_protocol' in names: conditions.append("(georef_protocol IS NULL OR georef_protocol<>'county centroid')")
          if 'higher_plant_group' in names: conditions.append("higher_plant_group NOT IN ('Algae','Bacteria','Fungi')")
          # Cultivation/native filters are audited first; do not guess a column name.
          where=' AND '.join(conditions)
          t=time.monotonic()
          cur.execute(f'''SELECT scrubbed_species_binomial, COUNT(*)::bigint AS n
                          FROM view_full_occurrence_individual
                          WHERE {where}
                          GROUP BY scrubbed_species_binomial
                          HAVING COUNT(*) >= 10
                          ORDER BY scrubbed_species_binomial''')
          counts=cur.fetchall(); elapsed=time.monotonic()-t
          out={
            'bien_version_context':'4.2 current public database endpoint used by RBIEN',
            'public_db_host':'vegbiendev.nceas.ucsb.edu','table':'view_full_occurrence_individual',
            'interesting_columns':interesting,
            'base_filters':conditions,
            'species_with_at_least_10_geovalid_records':len(counts),
            'record_count_quantiles':{},'sample':counts[:30],
            'query_elapsed_seconds':round(elapsed,2),
          }
          ns=sorted(int(x[1]) for x in counts)
          if ns:
            for q in (0,0.25,0.5,0.75,0.9,0.99,1): out['record_count_quantiles'][str(q)]=ns[min(len(ns)-1,int(q*(len(ns)-1)))]
          cur.close(); con.close()
          Path('/tmp/bien-v2-probe.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
      - name: Record probe
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin edaphic-v2.0-enrichment && git reset --hard origin/edaphic-v2.0-enrichment
          cp /tmp/bien-v2-probe.json .github/bien-v2-probe.json
          git add .github/bien-v2-probe.json
          git commit -m 'Record BIEN v2 source probe [skip ci]'
          git push origin HEAD:edaphic-v2.0-enrichment
