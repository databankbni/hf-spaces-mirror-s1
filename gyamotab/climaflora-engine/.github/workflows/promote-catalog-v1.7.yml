name: Promote ClimaFlora catalog v1.7 to OVH staging-production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-catalog-v1.7.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: promote-catalog-v1.7
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
      OVH_SFTP_PORT: ${{ secrets.OVH_SFTP_PORT }}
      OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
      OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
      OVH_SFTP_REMOTE_DIR: ${{ secrets.OVH_SFTP_REMOTE_DIR }}
      V17_RUN_ID: '32281989340'
      V17_SQLITE_SHA256: 'be5554f8d095427e63583f1bbc72927a7f681480bb45d0329c17946f4f9ea27e'
      V17_ZST_SHA256: 'df88b1dc8ef2e5eda2b6ced135319eb720944ee43ef984835ceba99c325e05ed'
      V17_MEDIA_SHA256: '36a36cd828880a17ee8ebb3389a4ccaec7c003fe44e295c184ef7f4d94d81270'
      V17_REMOTE_PATH: 'data/climaflora_global_plants_v1_7.sqlite.zst'
      V17_PUBLIC_URL: 'https://shugoan.com/climaflora/data/climaflora_global_plants_v1_7.sqlite.zst'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate promotion prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('.github/catalog-v1.7-status.json').read_text())
          assert s['status']=='ready'
          assert s['run_id']=='32281989340'
          assert s['catalog_version']=='1.7.0'
          assert s['sqlite_sha256']=='be5554f8d095427e63583f1bbc72927a7f681480bb45d0329c17946f4f9ea27e'
          assert s['zst_sha256']=='df88b1dc8ef2e5eda2b6ced135319eb720944ee43ef984835ceba99c325e05ed'
          assert s['media_tar_zst_sha256']=='36a36cd828880a17ee8ebb3389a4ccaec7c003fe44e295c184ef7f4d94d81270'
          assert s['exact_matched_taxa'] >= 250000
          assert s['vernacular_taxa'] >= 10000
          assert s['eligible_media_taxa'] >= 400
          assert s['materialized_successes'] / (s['materialized_successes'] + s['materialized_failures']) >= 0.95
          assert s['images_identification_evidence'] is False
          assert s['geographic_priors_scoring_enabled'] is False
          PY

      - name: Download validated v1.7 artifact
        uses: actions/download-artifact@v4
        with:
          name: climaflora-global-plants-v1.7-candidate
          path: candidate
          run-id: 32281989340
          github-token: ${{ github.token }}

      - name: Ensure audit and SFTP utilities
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd
          command -v sqlite3
          python -m pip install --disable-pip-version-check 'paramiko>=3.5,<5'

      - name: Independently revalidate artifact
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          echo "$V17_ZST_SHA256  climaflora_global_plants_v1_7.sqlite.zst" | sha256sum -c -
          echo "$V17_MEDIA_SHA256  climaflora_v1_7_media.tar.zst" | sha256sum -c -
          zstd -t climaflora_global_plants_v1_7.sqlite.zst
          zstd -t climaflora_v1_7_media.tar.zst
          zstd -d -f climaflora_global_plants_v1_7.sqlite.zst -o audit.sqlite
          echo "$V17_SQLITE_SHA256  audit.sqlite" | sha256sum -c -
          test "$(sqlite3 audit.sqlite 'PRAGMA integrity_check;')" = "ok"
          test "$(sqlite3 audit.sqlite "SELECT value FROM climaflora_catalog_metadata WHERE key='catalog_version';")" = "1.7.0"
          test "$(sqlite3 audit.sqlite "SELECT value FROM climaflora_catalog_metadata WHERE key='scientific_ready';")" = "true"
          test "$(sqlite3 audit.sqlite "SELECT value FROM climaflora_catalog_metadata WHERE key='image_identification_evidence';")" = "false"
          test "$(sqlite3 audit.sqlite 'SELECT COUNT(*) FROM soil_geographic_prior WHERE scoring_enabled != 0;')" = "0"
          test "$(sqlite3 audit.sqlite "SELECT COUNT(*) FROM plant_image_asset WHERE license LIKE '%NC%' OR license LIKE '%ND%';")" = "0"
          test "$(sqlite3 audit.sqlite 'SELECT COUNT(*) FROM plant_image_asset WHERE materialized=1 AND thumbnail_url IS NULL;')" = "0"
          test "$(sqlite3 audit.sqlite 'SELECT COUNT(*) FROM plant_index;')" = "420532"
          test "$(sqlite3 audit.sqlite 'SELECT COUNT(*) FROM climate_envelope;')" = "2009625"
          test "$(sqlite3 audit.sqlite 'SELECT COUNT(*) FROM soil_envelope;')" = "144787"
          test "$(sqlite3 audit.sqlite 'SELECT COUNT(*) FROM soil_categorical_preference;')" = "9379"
          test "$(sqlite3 audit.sqlite 'SELECT COUNT(*) FROM soil_indicator_preference;')" = "37050"
          test "$(sqlite3 audit.sqlite 'SELECT COUNT(*) FROM soil_geographic_prior;')" = "401523"
          rm audit.sqlite
          mkdir -p unpacked-media
          zstd -d -c climaflora_v1_7_media.tar.zst | tar -xf - -C unpacked-media
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('climaflora_v1_7_media_manifest.json').read_text())
          files=[p for p in Path('unpacked-media/media/plants').rglob('*') if p.is_file()]
          assert manifest['requested']==483
          assert manifest['successful_this_run']==478
          assert manifest['failed_this_run']==5
          assert manifest['materialized_taxa']==478
          assert len(manifest['successes'])==478
          assert len(manifest['failures'])==5
          assert len(files)==478, len(files)
          PY

      - name: Upload v1.7 alongside retained v1.6 and v1.2
        shell: bash
        run: |
          set -euo pipefail
          for name in OVH_SFTP_HOST OVH_SFTP_USER OVH_SFTP_PASSWORD OVH_SFTP_REMOTE_DIR; do test -n "${!name}"; done
          python - <<'PY'
          import os, posixpath
          from pathlib import Path
          import paramiko
          host=os.environ['OVH_SFTP_HOST']; port=int(os.environ.get('OVH_SFTP_PORT') or '22')
          user=os.environ['OVH_SFTP_USER']; password=os.environ['OVH_SFTP_PASSWORD']; base=os.environ['OVH_SFTP_REMOTE_DIR'].rstrip('/')
          transport=paramiko.Transport((host,port)); transport.connect(username=user,password=password)
          sftp=paramiko.SFTPClient.from_transport(transport)
          def mkdir_p(path):
              cur=''
              for part in path.strip('/').split('/'):
                  cur += '/' + part
                  try: sftp.stat(cur)
                  except FileNotFoundError: sftp.mkdir(cur)
          data_dir=posixpath.join(base,'data'); media_dir=posixpath.join(base,'media','plants')
          mkdir_p(data_dir); mkdir_p(media_dir)
          sftp.put('candidate/climaflora_global_plants_v1_7.sqlite.zst',posixpath.join(base,os.environ['V17_REMOTE_PATH']))
          root=Path('candidate/unpacked-media/media/plants')
          uploaded=0
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              rel=p.relative_to(root).as_posix()
              remote=posixpath.join(media_dir,rel)
              mkdir_p(posixpath.dirname(remote))
              sftp.put(str(p),remote)
              uploaded += 1
          assert uploaded==478, uploaded
          sftp.close(); transport.close()
          PY

      - name: Verify public promoted objects
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors "$V17_PUBLIC_URL" -o public-v1.7.zst
          test "$(sha256sum public-v1.7.zst | awk '{print $1}')" = "$V17_ZST_SHA256"
          mapfile -t relpaths < <(find candidate/unpacked-media/media/plants -type f -printf '%P\n' | sort | head -n 5)
          test "${#relpaths[@]}" -eq 5
          for rel in "${relpaths[@]}"; do
            curl --fail --location --retry 3 --retry-all-errors "https://shugoan.com/climaflora/media/plants/$rel" -o "/tmp/verified-thumb.webp"
            test -s "/tmp/verified-thumb.webp"
          done

      - name: Record reversible promotion status
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/catalog-v1.7-promotion.json <<EOF
          {
            "status": "uploaded_verified",
            "catalog_version": "1.7.0",
            "source_run_id": "$V17_RUN_ID",
            "sqlite_sha256": "$V17_SQLITE_SHA256",
            "zst_sha256": "$V17_ZST_SHA256",
            "media_tar_zst_sha256": "$V17_MEDIA_SHA256",
            "public_url": "$V17_PUBLIC_URL",
            "previous_catalogs_retained": ["climaflora_global_plants_v1_6.sqlite.zst", "climaflora_global_plants_v1_2.sqlite.zst"],
            "promoted_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            cp /tmp/catalog-v1.7-promotion.json .github/catalog-v1.7-promotion.json
            git add .github/catalog-v1.7-promotion.json
            git diff --cached --quiet && exit 0
            git commit -m 'Record verified ClimaFlora v1.7 OVH promotion [skip ci]'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
