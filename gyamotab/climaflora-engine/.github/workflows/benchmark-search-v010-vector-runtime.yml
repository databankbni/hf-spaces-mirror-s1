name: Benchmark Search v0.10 vector runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/services/search_vector_cache.py'
      - 'app/services/search_vector_runtime.py'
      - 'app/services/search_vector_navigation.py'
      - 'app/services/search_soil_vector.py'
      - 'app/services/search_vector.py'
      - 'app/services/search_runtime_sidecar.py'
      - 'app/routers/search.py'
      - 'app/main.py'
      - 'scripts/benchmark_search_v010_vector_runtime.py'
      - '.github/workflows/benchmark-search-v010-vector-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLIMAFLORA_SEARCH_VECTOR_CACHE_MB: '192'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package and zstd
        run: |
          python -m pip install --disable-pip-version-check -e .
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd

      - name: Download verified production catalog
        shell: bash
        run: |
          set -euo pipefail
          curl --http1.1 -fL --retry 6 --retry-all-errors --retry-delay 3 \
            -o /tmp/climaflora_global_plants_v2_0.sqlite.zst \
            https://shugoan.com/climaflora/data/climaflora_global_plants_v2_0.sqlite.zst
          echo '1683c43c6fb1e68f9b6c6c4cd7f291642feba6c37a3691c3452b319856335c32  /tmp/climaflora_global_plants_v2_0.sqlite.zst' | sha256sum -c -
          zstd -d -f /tmp/climaflora_global_plants_v2_0.sqlite.zst -o /tmp/climaflora_global_plants_v2_0.sqlite

      - name: Benchmark prewarmed scientific cache and navigation
        shell: bash
        run: |
          export CLIMAFLORA_FUNNEL_CACHE_DIR=/tmp/climaflora-funnel-vector-runtime
          export CLIMAFLORA_SEARCH_RUNTIME_CACHE_DIR=/tmp/climaflora-runtime-vector-runtime
          rm -rf "$CLIMAFLORA_FUNNEL_CACHE_DIR" "$CLIMAFLORA_SEARCH_RUNTIME_CACHE_DIR"
          python scripts/benchmark_search_v010_vector_runtime.py \
            --db /tmp/climaflora_global_plants_v2_0.sqlite \
            --output /tmp/search-v010-vector-runtime.json

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: search-v010-vector-runtime-benchmark
          path: /tmp/search-v010-vector-runtime.json
          if-no-files-found: warn
          retention-days: 30
