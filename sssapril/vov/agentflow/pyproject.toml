[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow"
version = "0.3.0"
description = "Agent pipeline framework with processor-based architecture"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
transformers = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
packages = ["agentflow", "agentflow.llm", "agentflow.plugins"]
package-dir = {"agentflow" = ".", "agentflow.llm" = "llm", "agentflow.plugins" = "plugins"}
