name: HD Tetris Space Keep-Alive

# Free Hugging Face Spaces sleep after ~48h without traffic. This scheduled
# job pings the Space every 5 minutes so the DQN keeps training 24/7.
# (GitHub Actions scheduled runs may be delayed a few minutes; that's fine.)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Hugging Face Space
        run: |
          URL="https://hyperhrishihd-hdtetrisai.hf.space/"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "ping $i -> HTTP $code"
            sleep 5
          done
