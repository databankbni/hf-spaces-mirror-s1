<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #11141d; }
    .brain { fill: url(#shell); }
    .glow { fill: url(#glow); animation: pulse 2.7s ease-in-out infinite; }
    .wire {
      fill: none;
      stroke: #f6fbff;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-dasharray: 24;
      animation: spark 1.6s ease-in-out infinite;
    }
    .wire:nth-of-type(2) { animation-delay: .22s; }
    .wire:nth-of-type(3) { animation-delay: .44s; }
    .dot {
      fill: #f8fdff;
      animation: pop 1.6s ease-in-out infinite;
      transform-origin: center;
    }
    .dot:nth-of-type(2) { animation-delay: .16s; }
    .dot:nth-of-type(3) { animation-delay: .32s; }
    .dot:nth-of-type(4) { animation-delay: .48s; }
    @keyframes spark {
      0% { stroke-dashoffset: 24; opacity: .2; }
      45% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -24; opacity: .28; }
    }
    @keyframes pop {
      0%, 100% { opacity: .62; transform: scale(.82); }
      44% { opacity: 1; transform: scale(1.16); }
    }
    @keyframes pulse {
      0%, 100% { opacity: .38; }
      50% { opacity: .92; }
    }
  </style>
  <defs>
    <linearGradient id="shell" x1="10" y1="8" x2="54" y2="56">
      <stop offset="0" stop-color="#8ea0ff"/>
      <stop offset=".52" stop-color="#5c6ef7"/>
      <stop offset="1" stop-color="#43c78a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="62%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect class="bg" width="64" height="64" rx="16"/>
  <path class="brain" d="M25.8 14.2C19 11.5 11.6 16.5 11.6 24c0 1.1.2 2.1.5 3.1A10.5 10.5 0 0 0 8 35.8c0 5.6 4.1 10.1 9.5 10.7 1.5 4.4 5.7 7.3 10.3 7.3 2.5 0 4.7-.8 6.5-2.1 1.8 1.3 4 2.1 6.5 2.1 4.6 0 8.8-3 10.3-7.3 5.4-.6 9.5-5.2 9.5-10.7 0-3.5-1.8-6.6-4.5-8.7.3-1 .5-2 .5-3.1 0-7.5-7.5-12.5-14.2-9.8A10.8 10.8 0 0 0 34.3 9a10.8 10.8 0 0 0-8.5 5.2Z"/>
  <path class="glow" d="M25.8 14.2C19 11.5 11.6 16.5 11.6 24c0 1.1.2 2.1.5 3.1A10.5 10.5 0 0 0 8 35.8c0 5.6 4.1 10.1 9.5 10.7 1.5 4.4 5.7 7.3 10.3 7.3 2.5 0 4.7-.8 6.5-2.1 1.8 1.3 4 2.1 6.5 2.1 4.6 0 8.8-3 10.3-7.3 5.4-.6 9.5-5.2 9.5-10.7 0-3.5-1.8-6.6-4.5-8.7.3-1 .5-2 .5-3.1 0-7.5-7.5-12.5-14.2-9.8A10.8 10.8 0 0 0 34.3 9a10.8 10.8 0 0 0-8.5 5.2Z"/>
  <g>
    <path class="wire" d="M22 28h10l7-7"/>
    <path class="wire" d="M24 39h11l7 5"/>
    <path class="wire" d="M34 33h11"/>
    <circle class="dot" cx="22" cy="28" r="3"/>
    <circle class="dot" cx="39" cy="21" r="2.8"/>
    <circle class="dot" cx="45" cy="33" r="3"/>
    <circle class="dot" cx="42" cy="44" r="2.8"/>
  </g>
</svg>
