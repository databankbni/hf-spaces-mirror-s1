<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Broker | TransEast Freight Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>tailwind.config = {theme: {extend: {colors: {primary: '#5E35B1'}}}}</script>
</head>
<body class="bg-gray-50">
    <custom-navbar></custom-navbar>
    <section class="min-h-screen flex items-center justify-center py-20 mt-16">
        <div class="max-w-lg w-full bg-white rounded-xl shadow-lg p-8">
            <h1 class="text-3xl font-bold text-center mb-2">Register as Broker</h1>
            <p class="text-center text-gray-600 mb-8">Connect with carriers and manage your shipments</p>
            <form class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium mb-1">First Name</label><input type="text" class="w-full px-4 py-2 border rounded-lg"></div>
                    <div><label class="block text-sm font-medium mb-1">Last Name</label><input type="text" class="w-full px-4 py-2 border rounded-lg"></div>
                </div>
                <div><label class="block text-sm font-medium mb-1">Company Name</label><input type="text" class="w-full px-4 py-2 border rounded-lg"></div>
                <div><label class="block text-sm font-medium mb-1">MC Number</label><input type="text" class="w-full px-4 py-2 border rounded-lg"></div>
                <div><label class="block text-sm font-medium mb-1">DOT Number</label><input type="text" class="w-full px-4 py-2 border rounded-lg"></div>
                <div><label class="block text-sm font-medium mb-1">Email</label><input type="email" class="w-full px-4 py-2 border rounded-lg"></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium mb-1">Password</label><input type="password" class="w-full px-4 py-2 border rounded-lg"></div>
                    <div><label class="block text-sm font-medium mb-1">Confirm Password</label><input type="password" class="w-full px-4 py-2 border rounded-lg"></div>
                </div>
                <button type="button" class="w-full bg-primary text-white py-3 rounded-lg font-bold" onclick="registerBroker()">Create Broker Account</button>
            </form>
            <script>
                function registerBroker() {
                    localStorage.setItem('authToken', 'broker-token-' + Date.now());
                    localStorage.setItem('userRole', 'broker');
                    localStorage.setItem('userType', 'broker');
                    window.location.href = '/dashboard-broker.html';
                }
            </script>
        </div>
    </section>
    <custom-footer></custom-footer>
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
