<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Calculator | TransEast Freight Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>tailwind.config = {theme: {extend: {colors: {primary: '#5E35B1', secondary: '#3949AB'}}}}</script>
</head>
<body class="bg-gray-50">
    <custom-navbar></custom-navbar>
    
    <section class="py-20 mt-16">
        <div class="container mx-auto px-6 max-w-2xl">
            <div class="bg-white rounded-xl shadow-lg p-8">
                <h1 class="text-3xl font-bold text-center mb-8">Rate Calculator</h1>
                <form class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium mb-1">Origin City</label><input type="text" class="w-full px-4 py-2 border rounded-lg" placeholder="e.g., Lagos"></div>
                        <div><label class="block text-sm font-medium mb-1">Destination City</label><input type="text" class="w-full px-4 py-2 border rounded-lg" placeholder="e.g., Accra"></div>
                    </div>
                    <div><label class="block text-sm font-medium mb-1">Equipment Type</label><select class="w-full px-4 py-2 border rounded-lg"><option>Dry Van</option><option>Reefer</option><option>Flatbed</option><option>Tanker</option></select></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium mb-1">Weight (lbs)</label><input type="number" class="w-full px-4 py-2 border rounded-lg" placeholder="20000"></div>
                        <div><label class="block text-sm font-medium mb-1">Distance (miles)</label><input type="number" class="w-full px-4 py-2 border rounded-lg" placeholder="500"></div>
                    </div>
                    <div class="bg-purple-50 p-4 rounded-lg">
                        <p class="text-lg font-semibold text-primary">Estimated Rate: <span class="text-2xl" id="estimatedRate">$1,850</span></p>
                    </div>
                    <button type="button" class="w-full bg-primary text-white py-3 rounded-lg font-bold" onclick="calculateRate()">Calculate Rate</button>
                </form>
            </div>
        </div>
    </section>
    
    <custom-footer></custom-footer>
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
        function calculateRate() {
            const rate = Math.floor(Math.random() * 3000) + 800;
            document.getElementById('estimatedRate').textContent = '$' + rate.toLocaleString();
        }
    </script>
</body>
</html>
