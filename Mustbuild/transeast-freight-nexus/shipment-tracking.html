<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Shipment | TransEast Freight Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>tailwind.config = {theme: {extend: {colors: {primary: '#5E35B1', secondary: '#3949AB'}}}}</script>
</head>
<body class="bg-gray-50">
    <custom-navbar></custom-navbar>
    
    <section class="py-20 mt-16">
        <div class="container mx-auto px-6 max-w-2xl">
            <div class="bg-white rounded-xl shadow-lg p-8">
                <h1 class="text-3xl font-bold text-center mb-8">Track Your Shipment</h1>
                <div class="flex gap-4 mb-8">
                    <input type="text" placeholder="Enter tracking number (e.g., TE-4829)" class="flex-1 px-4 py-3 border rounded-lg">
                    <button class="bg-primary text-white px-6 py-3 rounded-lg font-bold">Track</button>
                </div>
                <div class="border rounded-lg p-6">
                    <h3 class="font-bold mb-4">Example Tracking Details</h3>
                    <div class="space-y-3">
                        <div class="flex justify-between"><span class="text-gray-600">Tracking #:</span><span class="font-bold">TE-4829</span></div>
                        <div class="flex justify-between"><span class="text-gray-600">Status:</span><span class="text-green-600 font-semibold">In Transit</span></div>
                        <div class="flex justify-between"><span class="text-gray-600">Origin:</span><span>Lagos, Nigeria</span></div>
                        <div class="flex justify-between"><span class="text-gray-600">Destination:</span><span>Accra, Ghana</span></div>
                        <div class="flex justify-between"><span class="text-gray-600">ETA:</span><span>May 25, 2023</span></div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <custom-footer></custom-footer>
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
