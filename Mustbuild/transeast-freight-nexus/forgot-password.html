<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | TransEast Freight Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50">
    <custom-navbar></custom-navbar>
    <section class="min-h-screen flex items-center justify-center">
        <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
            <h1 class="text-3xl font-bold text-center mb-8">Reset Password</h1>
            <p class="text-gray-600 text-center mb-6">Enter your email and we'll send you a reset link</p>
            <form class="space-y-4">
                <div><label class="block text-sm font-medium mb-1">Email</label><input type="email" class="w-full px-4 py-3 border rounded-lg"></div>
                <button class="w-full bg-primary text-white py-3 rounded-lg font-bold">Send Reset Link</button>
            </form>
            <p class="text-center mt-4"><a href="/login.html" class="text-primary hover:underline">Back to Login</a></p>
        </div>
    </section>
    <custom-footer></custom-footer>
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
