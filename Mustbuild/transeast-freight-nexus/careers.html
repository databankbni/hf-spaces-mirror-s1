<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers | TransEast Freight Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>tailwind.config = {theme: {extend: {colors: {primary: '#5E35B1', secondary: '#3949AB'}}}}</script>
</head>
<body class="bg-gray-50">
    <custom-navbar></custom-navbar>
    
    <section class="relative bg-gradient-to-r from-primary to-secondary text-white py-20 mt-16">
        <div class="container mx-auto px-6 text-center">
            <h1 class="text-4xl md:text-6xl font-bold mb-6">Join Our Team</h1>
            <p class="text-xl mb-8">Help us transform African logistics</p>
        </div>
    </section>
    
    <section class="py-20">
        <div class="container mx-auto px-6 max-w-4xl">
            <h2 class="text-3xl font-bold mb-8 text-center">Open Positions</h2>
            <div class="space-y-4">
                <div class="bg-white p-6 rounded-xl shadow-md flex justify-between items-center">
                    <div><h3 class="font-bold text-lg">Senior Logistics Coordinator</h3><p class="text-gray-600">Lagos, Nigeria · Full-time</p></div>
                    <button class="bg-primary text-white px-6 py-2 rounded-lg">Apply</button>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-md flex justify-between items-center">
                    <div><h3 class="font-bold text-lg">Software Engineer</h3><p class="text-gray-600">Nairobi, Kenya · Full-time</p></div>
                    <button class="bg-primary text-white px-6 py-2 rounded-lg">Apply</button>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-md flex justify-between items-center">
                    <div><h3 class="font-bold text-lg">Fleet Manager</h3><p class="text-gray-600">Accra, Ghana · Full-time</p></div>
                    <button class="bg-primary text-white px-6 py-2 rounded-lg">Apply</button>
                </div>
            </div>
        </div>
    </section>
    
    <custom-footer></custom-footer>
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
