<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Management | TransEast Freight Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>tailwind.config = {theme: {extend: {colors: {primary: '#5E35B1', secondary: '#3949AB'}}}}</script>
</head>
<body class="bg-gray-100">
    <custom-dashboard-navbar></custom-dashboard-navbar>
    
    <div class="flex pt-16">
        <custom-dashboard-sidebar></custom-dashboard-sidebar>
        
        <main class="flex-1 ml-64 p-8">
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Fuel Management</h1>
                <p class="text-gray-600">Monitor fuel consumption and costs across your fleet</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6"><p class="text-gray-500 text-sm">Total Fuel Cost (MTD)</p><h3 class="text-3xl font-bold">$8,450</h3></div>
                <div class="bg-white rounded-lg shadow p-6"><p class="text-gray-500 text-sm">Avg MPG</p><h3 class="text-3xl font-bold">6.8</h3></div>
                <div class="bg-white rounded-lg shadow p-6"><p class="text-gray-500 text-sm">Fuel Efficiency</p><h3 class="text-3xl font-bold text-green-600">92%</h3></div>
                <div class="bg-white rounded-lg shadow p-6"><p class="text-gray-500 text-sm">Refueling Events</p><h3 class="text-3xl font-bold">156</h3></div>
            </div>
            
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Vehicle</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Gallons</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Cost</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">MPG</th></tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr><td class="px-6 py-4 text-sm">V-001 - Mercedes Actros</td><td class="px-6 py-4 text-sm">Jun 12, 2023</td><td class="px-6 py-4 text-sm">120</td><td class="px-6 py-4 text-sm">$540</td><td class="px-6 py-4 text-sm">7.1</td></tr>
                        <tr><td class="px-6 py-4 text-sm">V-002 - Volvo FH16</td><td class="px-6 py-4 text-sm">Jun 12, 2023</td><td class="px-6 py-4 text-sm">95</td><td class="px-6 py-4 text-sm">$428</td><td class="px-6 py-4 text-sm">6.5</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="components/dashboard-navbar.js"></script>
    <script src="components/dashboard-sidebar.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
