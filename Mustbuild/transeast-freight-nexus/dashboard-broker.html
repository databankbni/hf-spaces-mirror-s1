<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broker Dashboard | TransEast Freight Nexus</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
    <custom-dashboard-navbar></custom-dashboard-navbar>
    
    <div class="flex">
        <custom-dashboard-sidebar></custom-dashboard-sidebar>
        
        <main class="flex-1 p-8 ml-64 mt-16">
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-gray-800">Broker Dashboard</h1>
                <p class="text-gray-600">Welcome back, Broker</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div><p class="text-gray-500 text-sm">Posted Loads</p><h3 class="text-2xl font-bold mt-1">34</h3></div>
                        <div class="bg-purple-100 p-3 rounded-full"><i data-feather="package" class="text-purple-500"></i></div>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div><p class="text-gray-500 text-sm">Active Shipments</p><h3 class="text-2xl font-bold mt-1">18</h3></div>
                        <div class="bg-blue-100 p-3 rounded-full"><i data-feather="truck" class="text-blue-500"></i></div>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div><p class="text-gray-500 text-sm">Quotes Received</p><h3 class="text-2xl font-bold mt-1">12</h3></div>
                        <div class="bg-green-100 p-3 rounded-full"><i data-feather="file-text" class="text-green-500"></i></div>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div><p class="text-gray-500 text-sm">Revenue This Month</p><h3 class="text-2xl font-bold mt-1">$45,200</h3></div>
                        <div class="bg-yellow-100 p-3 rounded-full"><i data-feather="dollar-sign" class="text-yellow-500"></i></div>
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-4">Load Posting Activity</h2>
                    <canvas id="brokerChart" height="250"></canvas>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-4">Recent Quotes</h2>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center p-3 bg-gray-50 rounded"><div><p class="font-medium">Load #LB-4829</p><p class="text-sm text-gray-500">Lagos → Accra</p></div><span class="text-green-600 font-semibold">$1,500</span></div>
                        <div class="flex justify-between items-center p-3 bg-gray-50 rounded"><div><p class="font-medium">Load #LB-4830</p><p class="text-sm text-gray-500">Nairobi → Dar es Salaam</p></div><span class="text-green-600 font-semibold">$2,200</span></div>
                    </div>
                </div>
            </div>
            
            <div class="flex gap-4">
                <a href="/post-load.html" class="bg-primary text-white px-6 py-3 rounded-lg hover:bg-opacity-90 font-bold">
                    <i data-feather="plus" class="inline w-4 h-4"></i> Post New Load
                </a>
                <a href="/load-board.html" class="border border-primary text-primary px-6 py-3 rounded-lg hover:bg-purple-50 font-bold">
                    View Load Board
                </a>
            </div>
        </main>
    </div>

    <script src="components/dashboard-navbar.js"></script>
    <script src="components/dashboard-sidebar.js"></script>
    <script src="script.js"></script>
    <script>
        feather.replace();
        document.addEventListener('DOMContentLoaded', function() {
            if (!requireAuth()) return;
            
            const ctx = document.getElementById('brokerChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    datasets: [{
                        label: 'Loads Posted',
                        data: [5, 8, 6, 9, 7, 4, 3],
                        backgroundColor: 'rgba(94, 53, 177, 0.7)',
                        borderColor: 'rgba(94, 53, 177, 1)',
                        borderWidth: 1
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
        });
    </script>
</body>
</html>
