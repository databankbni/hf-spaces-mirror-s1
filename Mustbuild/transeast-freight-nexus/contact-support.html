<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support | TransEast Freight Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>tailwind.config = {theme: {extend: {colors: {primary: '#5E35B1', secondary: '#3949AB'}}}}</script>
</head>
<body class="bg-gray-50">
    <custom-navbar></custom-navbar>
    
    <section class="py-20 mt-16">
        <div class="container mx-auto px-6 max-w-2xl">
            <div class="bg-white rounded-xl shadow-lg p-8">
                <h1 class="text-3xl font-bold text-center mb-8">Contact Support</h1>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 text-center">
                    <div class="p-4"><i data-lucide="phone" class="w-8 h-8 text-primary mx-auto mb-2"></i><h3 class="font-bold">Phone</h3><p class="text-gray-600">+1 (800) 555-0199</p></div>
                    <div class="p-4"><i data-lucide="mail" class="w-8 h-8 text-primary mx-auto mb-2"></i><h3 class="font-bold">Email</h3><p class="text-gray-600">support@transeast.com</p></div>
                    <div class="p-4"><i data-lucide="message-circle" class="w-8 h-8 text-primary mx-auto mb-2"></i><h3 class="font-bold">Live Chat</h3><p class="text-gray-600">Available 24/7</p></div>
                </div>
                <form class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium mb-1">Name</label><input type="text" class="w-full px-4 py-2 border rounded-lg"></div>
                        <div><label class="block text-sm font-medium mb-1">Email</label><input type="email" class="w-full px-4 py-2 border rounded-lg"></div>
                    </div>
                    <div><label class="block text-sm font-medium mb-1">Subject</label><input type="text" class="w-full px-4 py-2 border rounded-lg"></div>
                    <div><label class="block text-sm font-medium mb-1">Message</label><textarea rows="4" class="w-full px-4 py-2 border rounded-lg"></textarea></div>
                    <button class="w-full bg-primary text-white py-3 rounded-lg font-bold">Send Message</button>
                </form>
            </div>
        </div>
    </section>
    
    <custom-footer></custom-footer>
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
