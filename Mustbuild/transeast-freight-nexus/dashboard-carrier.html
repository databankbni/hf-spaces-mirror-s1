<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrier Dashboard | TransEast Freight Nexus</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
    <custom-dashboard-navbar></custom-dashboard-navbar>
    
    <div class="flex">
        <custom-dashboard-sidebar></custom-dashboard-sidebar>
        
        <main class="flex-1 p-8 ml-64 mt-16">
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-gray-800">Carrier Dashboard</h1>
                <p class="text-gray-600">Welcome back, Carrier</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div><p class="text-gray-500 text-sm">Available Loads</p><h3 class="text-2xl font-bold mt-1">156</h3></div>
                        <div class="bg-blue-100 p-3 rounded-full"><i data-feather="package" class="text-blue-500"></i></div>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div><p class="text-gray-500 text-sm">Active Shipments</p><h3 class="text-2xl font-bold mt-1">24</h3></div>
                        <div class="bg-green-100 p-3 rounded-full"><i data-feather="truck" class="text-green-500"></i></div>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div><p class="text-gray-500 text-sm">Fleet Utilization</p><h3 class="text-2xl font-bold mt-1">87%</h3></div>
                        <div class="bg-yellow-100 p-3 rounded-full"><i data-feather="bar-chart-2" class="text-yellow-500"></i></div>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div><p class="text-gray-500 text-sm">Earnings This Month</p><h3 class="text-2xl font-bold mt-1">$32,800</h3></div>
                        <div class="bg-purple-100 p-3 rounded-full"><i data-feather="dollar-sign" class="text-purple-500"></i></div>
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-4">Revenue Overview</h2>
                    <canvas id="carrierRevChart" height="250"></canvas>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-4">Active Routes</h2>
                    <div class="space-y-3">
                        <div class="p-3 bg-blue-50 rounded"><p class="font-medium">Lagos → Accra</p><p class="text-sm text-gray-500">Vehicle V-001 | ETA: May 25</p></div>
                        <div class="p-3 bg-blue-50 rounded"><p class="font-medium">Nairobi → Dar es Salaam</p><p class="text-sm text-gray-500">Vehicle V-002 | ETA: May 28</p></div>
                    </div>
                </div>
            </div>
            
            <div class="flex gap-4">
                <a href="/fleet-management.html" class="bg-primary text-white px-6 py-3 rounded-lg hover:bg-opacity-90 font-bold">
                    <i data-feather="truck" class="inline w-4 h-4"></i> Manage Fleet
                </a>
                <a href="/load-board.html" class="border border-primary text-primary px-6 py-3 rounded-lg hover:bg-purple-50 font-bold">
                    Find Loads
                </a>
            </div>
        </main>
    </div>

    <script src="components/dashboard-navbar.js"></script>
    <script src="components/dashboard-sidebar.js"></script>
    <script src="script.js"></script>
    <script>
        feather.replace();
        document.addEventListener('DOMContentLoaded', function() {
            if (!requireAuth()) return;
            
            const ctx = document.getElementById('carrierRevChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May'],
                    datasets: [{
                        label: 'Revenue',
                        data: [22000, 25000, 28000, 30000, 32800],
                        borderColor: 'rgba(57, 73, 171, 1)',
                        backgroundColor: 'rgba(57, 73, 171, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
        });
    </script>
</body>
</html>
