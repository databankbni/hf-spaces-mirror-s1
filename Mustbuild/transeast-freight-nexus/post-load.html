<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Load | TransEast Freight Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>tailwind.config = {theme: {extend: {colors: {primary: '#5E35B1'}}}}</script>
</head>
<body class="bg-gray-100">
    <custom-dashboard-navbar></custom-dashboard-navbar>
    <div class="flex pt-16"><custom-dashboard-sidebar></custom-dashboard-sidebar>
    <main class="flex-1 ml-64 p-8">
        <div class="bg-white rounded-lg shadow p-8 max-w-2xl mx-auto">
            <h2 class="text-2xl font-bold mb-6">Post New Load</h2>
            <form class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium mb-1">Origin City</label><input type="text" class="w-full px-4 py-2 border rounded-lg"></div>
                    <div><label class="block text-sm font-medium mb-1">Origin Country</label><input type="text" class="w-full px-4 py-2 border rounded-lg"></div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium mb-1">Destination City</label><input type="text" class="w-full px-4 py-2 border rounded-lg"></div>
                    <div><label class="block text-sm font-medium mb-1">Destination Country</label><input type="text" class="w-full px-4 py-2 border rounded-lg"></div>
                </div>
                <div><label class="block text-sm font-medium mb-1">Equipment Type</label><select class="w-full px-4 py-2 border rounded-lg"><option>Dry Van</option><option>Reefer</option><option>Flatbed</option></select></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm font-medium mb-1">Weight (lbs)</label><input type="number" class="w-full px-4 py-2 border rounded-lg"></div>
                    <div><label class="block text-sm font-medium mb-1">Rate ($)</label><input type="number" class="w-full px-4 py-2 border rounded-lg"></div>
                </div>
                <button class="w-full bg-primary text-white py-3 rounded-lg font-bold">Post Load</button>
            </form>
        </div>
    </main></div>
    <script src="components/dashboard-navbar.js"></script>
    <script src="components/dashboard-sidebar.js"></script>
    <script src="script.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
        document.addEventListener('DOMContentLoaded', function() {
            requireAuth();
        });
    </script>
</body>
</html>
