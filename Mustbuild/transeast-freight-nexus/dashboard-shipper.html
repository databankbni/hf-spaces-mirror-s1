<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipper Dashboard | TransEast Freight Nexus</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
    <custom-dashboard-navbar></custom-dashboard-navbar>
    
    <div class="flex">
        <custom-dashboard-sidebar></custom-dashboard-sidebar>
        
        <main class="flex-1 p-8 ml-64 mt-16">
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-gray-800">Shipper Dashboard</h1>
                <p class="text-gray-600">Welcome back, Shipper</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div><p class="text-gray-500 text-sm">Total Shipments</p><h3 class="text-2xl font-bold mt-1">89</h3></div>
                        <div class="bg-indigo-100 p-3 rounded-full"><i data-feather="package" class="text-indigo-500"></i></div>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div><p class="text-gray-500 text-sm">In Transit</p><h3 class="text-2xl font-bold mt-1">12</h3></div>
                        <div class="bg-blue-100 p-3 rounded-full"><i data-feather="truck" class="text-blue-500"></i></div>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div><p class="text-gray-500 text-sm">Delivered</p><h3 class="text-2xl font-bold mt-1">74</h3></div>
                        <div class="bg-green-100 p-3 rounded-full"><i data-feather="check-circle" class="text-green-500"></i></div>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between">
                        <div><p class="text-gray-500 text-sm">Spent This Month</p><h3 class="text-2xl font-bold mt-1">$18,500</h3></div>
                        <div class="bg-orange-100 p-3 rounded-full"><i data-feather="dollar-sign" class="text-orange-500"></i></div>
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-4">Shipping Volume</h2>
                    <canvas id="shipperChart" height="250"></canvas>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-lg font-semibold mb-4">Recent Shipments</h2>
                    <div class="space-y-2">
                        <div class="p-3 bg-gray-50 rounded flex justify-between"><span>Lagos → Accra</span><span class="text-green-600">Delivered</span></div>
                        <div class="p-3 bg-gray-50 rounded flex justify-between"><span>Nairobi → Kampala</span><span class="text-blue-600">In Transit</span></div>
                        <div class="p-3 bg-gray-50 rounded flex justify-between"><span>Cairo → Tunis</span><span class="text-yellow-600">Processing</span></div>
                    </div>
                </div>
            </div>
            
            <div class="flex gap-4">
                <a href="/load-board.html" class="bg-primary text-white px-6 py-3 rounded-lg hover:bg-opacity-90 font-bold">
                    <i data-feather="search" class="inline w-4 h-4"></i> Find Carriers
                </a>
                <a href="/shipment-tracking.html" class="border border-primary text-primary px-6 py-3 rounded-lg hover:bg-purple-50 font-bold">
                    Track Shipment
                </a>
            </div>
        </main>
    </div>

    <script src="components/dashboard-navbar.js"></script>
    <script src="components/dashboard-sidebar.js"></script>
    <script src="script.js"></script>
    <script>
        feather.replace();
        document.addEventListener('DOMContentLoaded', function() {
            if (!requireAuth()) return;
            
            const ctx = document.getElementById('shipperChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May'],
                    datasets: [{
                        label: 'Shipments',
                        data: [15, 18, 22, 20, 24],
                        backgroundColor: 'rgba(79, 70, 229, 0.7)',
                        borderColor: 'rgba(79, 70, 229, 1)',
                        borderWidth: 1
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
        });
    </script>
</body>
</html>
