<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Demo | TransEast Freight Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>tailwind.config = {theme: {extend: {colors: {primary: '#5E35B1', secondary: '#3949AB', accent: '#7C4DFF'}}}}</script>
</head>
<body class="bg-gray-50">
    <custom-navbar></custom-navbar>
    <section class="min-h-screen flex items-center justify-center py-20 mt-16">
        <div class="max-w-lg w-full bg-white rounded-xl shadow-lg p-8">
            <h1 class="text-3xl font-bold text-center mb-8">Request a Demo</h1>
            <form class="space-y-4">
                <div><label class="block text-sm font-medium mb-1">Full Name</label><input type="text" class="w-full px-4 py-3 border rounded-lg"></div>
                <div><label class="block text-sm font-medium mb-1">Company</label><input type="text" class="w-full px-4 py-3 border rounded-lg"></div>
                <div><label class="block text-sm font-medium mb-1">Email</label><input type="email" class="w-full px-4 py-3 border rounded-lg"></div>
                <div><label class="block text-sm font-medium mb-1">Phone</label><input type="tel" class="w-full px-4 py-3 border rounded-lg"></div>
                <button class="w-full bg-primary text-white py-3 rounded-lg font-bold hover:bg-opacity-90">Submit Request</button>
            </form>
        </div>
    </section>
    <custom-footer></custom-footer>
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
