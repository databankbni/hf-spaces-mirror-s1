<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliance Report | TransEast Freight Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>tailwind.config = {theme: {extend: {colors: {primary: '#5E35B1', secondary: '#3949AB'}}}}</script>
</head>
<body class="bg-gray-100">
    <custom-dashboard-navbar></custom-dashboard-navbar>
    
    <div class="flex pt-16">
        <custom-dashboard-sidebar></custom-dashboard-sidebar>
        
        <main class="flex-1 ml-64 p-8">
            <h1 class="text-3xl font-bold mb-6">Compliance Report</h1>
            
            <div class="bg-white rounded-lg shadow p-6 mb-6">
                <h2 class="text-xl font-bold mb-4">Generate Report</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div><label class="block text-sm font-medium mb-1">Report Type</label><select class="w-full px-4 py-2 border rounded-lg"><option>Trade Compliance</option><option>Customs Revenue</option><option>Border Activity</option></select></div>
                    <div><label class="block text-sm font-medium mb-1">Date From</label><input type="date" class="w-full px-4 py-2 border rounded-lg"></div>
                    <div><label class="block text-sm font-medium mb-1">Date To</label><input type="date" class="w-full px-4 py-2 border rounded-lg"></div>
                </div>
                <button class="bg-primary text-white px-6 py-2 rounded-lg font-bold">Generate Report</button>
            </div>
            
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Report ID</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Type</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Generated</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Download</th></tr></thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr><td class="px-6 py-4">RPT-001</td><td class="px-6 py-4">Trade Compliance</td><td class="px-6 py-4">June 12, 2023</td><td class="px-6 py-4"><span class="text-green-600">Complete</span></td><td class="px-6 py-4"><button class="text-primary hover:underline">Download</button></td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="components/dashboard-navbar.js"></script>
    <script src="components/dashboard-sidebar.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
