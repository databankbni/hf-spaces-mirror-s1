<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>r300 shader-db history</title>
  <link rel="stylesheet" href="/styles.css?v=axis-label">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>r300 shader-db history</h1>
      <p id="statusLine">Loading database...</p>
    </div>
    <div class="top-actions">
      <button id="reloadBtn" type="button">Refresh</button>
      <button id="resetBtn" type="button">Reset view</button>
    </div>
  </header>

  <main class="layout">
    <aside class="controls">
      <section>
        <h2>Target</h2>
        <div id="targetControls" class="check-grid"></div>
      </section>

      <section>
        <h2>Metrics</h2>
        <div id="statControls" class="check-grid metrics"></div>
      </section>

      <section>
        <h2>Stage</h2>
        <div id="stageControls" class="check-grid stage-grid"></div>
      </section>

      <section>
        <h2>Range</h2>
        <div class="segmented" id="granularityControl">
          <button type="button" data-value="month">Month</button>
          <button type="button" data-value="commit" class="active">Commit</button>
        </div>
        <div class="range-actions">
          <button id="fullRangeBtn" type="button">Full range</button>
        </div>
        <label>
          From
          <input id="fromInput" type="date">
        </label>
        <label>
          To
          <input id="toInput" type="date">
        </label>
      </section>

      <section>
        <h2>Shader Set</h2>
        <label>
          Filter
          <input id="shaderFilterInput" placeholder="path substring">
        </label>
        <div id="shaderSelectionStatus" class="shader-selection-status">Loading shaders...</div>
        <div id="shaderTree" class="shader-tree"></div>
      </section>
    </aside>

    <section class="main-panel">
      <div class="chart-wrap">
        <canvas id="chart" width="1200" height="620"></canvas>
        <div id="tooltip" class="tooltip hidden"></div>
        <div id="loadingOverlay" class="loading-overlay hidden">
          <div class="spinner"></div>
        </div>
      </div>
      <div id="rangeWarning" class="range-warning hidden"></div>
      <div id="legend" class="legend"></div>
      <section class="changes">
        <div class="changes-head">
          <h2>Change Commits</h2>
          <span id="changeCount"></span>
        </div>
        <div id="changeList" class="change-list"></div>
      </section>
    </section>
  </main>

  <script src="/app.js?v=axis-label"></script>
</body>
</html>
