<style>
    .table-container { overflow-x: auto; max-height: 600px; overflow-y: auto; border: 1px solid #cbd5e1; border-radius: 4px; background-color: #ffffff; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; color: #334155; }
    .data-table th, .data-table td { border-bottom: 1px solid #e2e8f0; padding: 10px 14px; text-align: left; white-space: nowrap; }
    .data-table th { background-color: #f8fafc; font-weight: 600; text-transform: uppercase; position: sticky; top: 0; z-index: 10; box-shadow: 0 1px 0 #cbd5e1; }
    .data-table tr:nth-child(even) { background-color: #f1f5f9; }
    .data-table tr:hover { background-color: #e2e8f0; }
</style>

<div class="table-container">
    {% if output_data and output_data|length > 0 %}
        <table class="data-table">
            <thead>
                <tr>
                    <!-- Dynamically generate headers from the first record's keys -->
                    {% for key in output_data.0.keys %}
                        <th>{{ key }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                <!-- Iterate through the dataset matrix to construct rows -->
                {% for row in output_data %}
                    <tr>
                        {% for value in row.values %}
                            <td>{{ value }}</td>
                        {% endfor %}
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p style="padding: 20px; color: #64748b;">No data retrieved for the specified parameters.</p>
    {% endif %}
</div>
