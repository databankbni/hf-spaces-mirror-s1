<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate Data Platform</title>

    <!-- Leaflet Global Dependencies for Earth Engine Raster Rendering -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { min-height: 100vh; display: flex; margin: 0; background-color: #f8fafc; overflow-x: hidden; }
        .app-container { display: flex; width: 100vw; min-height: 100vh; position: relative; }

        /* Universal Foldable Gemini-style Sidebar */
        .sidebar { width: 260px; background-color: #1e293b; color: #fff; display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.3s ease; position: relative; z-index: 100; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
        .sidebar.collapsed { width: 72px; }
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 20px; border-bottom: 1px solid #334155; }
        .sidebar h2 { font-size: 1.1rem; color: #94a3b8; white-space: nowrap; overflow: hidden; transition: opacity 0.2s; }
        .sidebar.collapsed h2 { opacity: 0; pointer-events: none; }
        .toggle-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1.2rem; padding: 4px; border-radius: 4px; }
        .toggle-btn:hover { background-color: #334155; color: #fff; }
        .sidebar ul { list-style: none; margin-top: 10px; flex: 1; overflow-y: auto; }
        .sidebar li a { display: flex; align-items: center; gap: 12px; padding: 14px 20px; color: #cbd5e1; text-decoration: none; font-size: 0.95rem; white-space: nowrap; overflow: hidden; }
        .sidebar li a:hover, .sidebar li.active a { background-color: #334155; color: #fff; border-left: 4px solid #38bdf8; }
        .sidebar li a span.icon { font-size: 1.2rem; min-width: 24px; text-align: center; }
        .sidebar.collapsed li a span.text { display: none; }

        /* Main Workspace Container */
        .provider-workspace { flex: 1; background-color: #f8fafc; overflow-y: auto; display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- The universal sidebar is injected once globally -->
        {% include 'hf_space/layout/sidebar.html' %}

        <!-- Dynamic Workspace Content is swapped asynchronously here -->
        {% block content %}{% endblock %}
    </div>

    <!-- UI Interceptor & Sidebar Controller -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Sidebar Fold/Unfold Logic
            const sidebar = document.getElementById('app-sidebar');
            const toggleBtn = document.getElementById('sidebar-toggle');
            if (toggleBtn && sidebar) {
                toggleBtn.addEventListener('click', () => { sidebar.classList.toggle('collapsed'); });
            }

            // 2. Reusable DOM Updater for Asynchronous Actions
            const updateWorkspace = (html) => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const newWorkspace = doc.querySelector('.provider-workspace');
                const currentWorkspace = document.querySelector('.provider-workspace');

                if (newWorkspace && currentWorkspace) {
                    currentWorkspace.outerHTML = newWorkspace.outerHTML; // Swap just the workspace, keeping sidebar intact

                    // Force browser evaluation of newly injected <script> nodes (e.g. Leaflet)
                    const updatedWorkspace = document.querySelector('.provider-workspace');
                    const scripts = updatedWorkspace.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                }
            };

            // 3. Intercept Dataset Changes (No-reload)
            document.body.addEventListener('change', async (event) => {
                if (event.target.id === 'dataset-select') {
                    const datasetId = event.target.value;
                    const url = new URL(window.location.href);
                    url.searchParams.set('dataset', datasetId);
                    window.history.pushState({}, '', url);
                    event.target.disabled = true;

                    try {
                        const response = await fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
                        const html = await response.text();
                        updateWorkspace(html);
                    } catch (error) {
                        console.error('Failed to load dataset form:', error);
                        event.target.disabled = false;
                    }
                }
            });

            // 4. Intercept Form Submissions (No-reload)
            document.body.addEventListener('submit', async (event) => {
                const form = event.target.closest('form');
                if (!form) return;

                event.preventDefault();
                const submitBtn = form.querySelector('button[type="submit"]');
                let originalText = "Execute Request";

                if (submitBtn) {
                    originalText = submitBtn.innerHTML;
                    submitBtn.innerHTML = '⏳ Processing... Please wait.';
                    submitBtn.disabled = true;
                    submitBtn.style.opacity = '0.7';
                }

                try {
                    const formData = new FormData(form);
                    const targetUrl = form.action || window.location.href;

                    const response = await fetch(targetUrl, {
                        method: form.method || 'POST',
                        body: formData,
                        headers: { 'X-Requested-With': 'XMLHttpRequest' }
                    });

                    const html = await response.text();
                    updateWorkspace(html);
                } catch (error) {
                    console.error('Asynchronous query failed:', error);
                    alert("A network anomaly occurred.");
                    if (submitBtn) {
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                        submitBtn.style.opacity = '1';
                    }
                }
            });
        });
    </script>
</body>
</html>
