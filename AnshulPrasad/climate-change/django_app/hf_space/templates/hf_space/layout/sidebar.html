<aside class="sidebar" id="app-sidebar">
    <div class="sidebar-header">
        <h2>Data Sources</h2>
        <button class="toggle-btn" id="sidebar-toggle" title="Toggle Sidebar">☰</button>
    </div>
    <ul>
        <li class="{% if not active_provider %}active{% endif %}">
            <a href="{% url 'home' %}">
                <span class="icon">🏠</span>
                <span class="text">Home</span>
            </a>
        </li>

        <hr style="border: 0; border-top: 1px solid #334155; margin: 10px 0;">

        {% for provider_key, provider_info in all_providers.items %}
            <li class="{% if active_provider == provider_key %}active{% endif %}">
                <a href="{% url 'dashboard' provider_id=provider_key %}">
                    <span class="icon">
                        {% if provider_key == 'copernicus' %}🌍{% elif provider_key == 'earth_engine' %}🛰️{% else %}📊{% endif %}
                    </span>
                    <span class="text">{{ provider_info.name }}</span>
                </a>
            </li>
        {% endfor %}
    </ul>
</aside>
