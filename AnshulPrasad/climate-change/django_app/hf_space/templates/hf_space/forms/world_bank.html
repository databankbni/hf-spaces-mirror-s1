<style>
    .wb-standard-input input, .wb-standard-input select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.9rem; background-color: #fff; box-sizing: border-box; }
    .form-group { display: flex; flex-direction: column; gap: 6px; position: relative; }
</style>

{% for field in form %}
    <div class="form-group">
        <label style="font-weight: 600; font-size: 0.9rem; color: #1e293b;">{{ field.label }}</label>
        <div class="wb-standard-input">
            {{ field }}
        </div>
        {% if field.help_text %}<span style="font-size: 0.75rem; color: #64748b; margin-top: 4px;">{{ field.help_text }}</span>{% endif %}
        {% for error in field.errors %}<span style="color: #ef4444; font-size: 0.8rem; margin-top: 4px;">{{ error }}</span>{% endfor %}
    </div>
{% endfor %}
