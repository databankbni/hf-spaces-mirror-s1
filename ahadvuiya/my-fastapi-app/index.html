<!DOCTYPE html>
<html lang="en">
<head>

    <title>ZentraX AI Pro - Autonomous Network</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- সেন্ট্রাল মনিটর প্যানেল -->

        <div class="terminal-header">
            <h1 class="brand-title">ZENTRAX AI PRO</h1>
            <div class="system-badge">AUTONOMOUS SYSTEM V1.0</div>

    <!-- ৩টি কলামের লাক্সারি গ্রিড - যেখানে কার্ডগুলো রেন্ডার হবে -->
    <div id="main-services-grid" class="services-grid"></div>

    <!-- মেইন অর্কেস্ট্রেটর স্ক্রিপ্ট -->
    <script type="module" src="app.js"></script>
