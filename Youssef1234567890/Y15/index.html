<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>لعبة رعب</title>
    <style>
        body { background-color: black; color: red; text-align: center; font-family: 'Courier New', Courier, monospace; }
        #start-btn { padding: 10px 20px; background-color: darkred; color: white; border: none; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>مرحبًا بك في عالم الرعب</h1>
    <p>هل تجرؤ على الدخول؟</p>
    <button id="start-btn" onclick="startGame()">ابدأ اللعبة</button>
    <div id="game-area"></div>
    <script>
        function startGame() {
            document.body.style.backgroundColor = '#111';
            document.getElementById('game-area').innerHTML = '<h2>لقد بدأت الكابوس... ابحث عن المخرج!</h2>';
        }
    </script>
</body>
</html>
