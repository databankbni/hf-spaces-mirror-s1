[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-personalassistantbench-env"
version = "0.1.0"
description = "PersonalAssistantBench RL environment for OpenEnv — an iOS-assistant agent over a simulated iPhone, with the benchmark's original programmatic rubrics"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
include-package-data = true
packages = ["personalassistantbench_env", "server"]
