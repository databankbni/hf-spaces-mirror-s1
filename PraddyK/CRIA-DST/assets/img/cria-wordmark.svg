<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 -14 231 104" width="200" height="90" role="img" aria-label="CRIA — Colorado River Integrated Assessment">
<defs>
<style>
@keyframes criaLvl{0%,100%{transform:translateY(3px)}50%{transform:translateY(17px)}}
@keyframes criaBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.crWater{animation:criaLvl 5s ease-in-out infinite}
.crWater.b{animation-duration:6.2s;animation-delay:-1.6s}
.crWater.c{animation-duration:4.6s;animation-delay:-2.8s}
.crWater.d{animation-duration:5.6s;animation-delay:-0.8s}
.crDrop{animation:criaBob 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.crWater,.crDrop{animation:none}}
</style>
<linearGradient id="cFace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B23A59"/><stop offset="1" stop-color="#7A1636"/></linearGradient>
<linearGradient id="cWat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE38A"/><stop offset=".5" stop-color="#FFC627"/><stop offset="1" stop-color="#E3A62E"/></linearGradient>
<linearGradient id="cGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cClip"><text x="12" y="84" font-family="Segoe UI,Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="22">CRIA</text></clipPath>
</defs>
<g font-family="Segoe UI,Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="22">
  <g fill="#5E0F28"><text x="13.6" y="85.6">CRIA</text><text x="12.9" y="84.9">CRIA</text></g>
  <text x="12" y="84" fill="url(#cFace)">CRIA</text>
  <g clip-path="url(#cClip)">
    <g class="crWater"><path fill="url(#cWat)" d="M2 52 q16 -6 32 0 t32 0 V96 H2 Z"/></g>
    <g class="crWater b"><path fill="url(#cWat)" d="M72 46 q15 -6 31 0 t31 0 V96 H72 Z"/></g>
    <g class="crWater c"><path fill="url(#cWat)" d="M144 58 q9 -5 18 0 t18 0 V96 H144 Z"/></g>
    <g class="crWater d"><path fill="url(#cWat)" d="M182 50 q15 -6 31 0 t31 0 V96 H182 Z"/></g>
  </g>
  <g clip-path="url(#cClip)"><rect x="0" y="30" width="250" height="26" fill="url(#cGloss)"/></g>
  <text x="12" y="84" fill="none" stroke="#5E0F28" stroke-width="1.5">CRIA</text>
</g>
<g fill="#D9971E"><rect x="66.6" y="70" width="8" height="8" rx="1.5"/><rect x="136.3" y="70" width="8" height="8" rx="1.5"/><rect x="176.6" y="70" width="8" height="8" rx="1.5"/></g>
<g transform="translate(160.5 -3)"><g class="crDrop"><path d="M0 0 c5 7 9 11 9 17 a9 9 0 0 1 -18 0 c0 -6 4 -10 9 -17 Z" fill="url(#cWat)" stroke="#5E0F28" stroke-width="1.2"/><circle cx="-3" cy="16" r="2.2" fill="#fff" opacity=".7"/></g></g>
</svg>
