<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Animated illustration of the developer">
<title>Developer</title>
<style>
  .blink{animation:blink 4.2s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  .pony{transform-origin:44px 26px;animation:sway 3.4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(7deg)}}
  .float{transform-origin:32px 40px;animation:float 3.8s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}}
  .spark{animation:spark 2.6s ease-in-out infinite}
  @keyframes spark{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
</style>
<circle cx="32" cy="32" r="31" fill="#FBEEF2"/>
<g class="float">
  <path class="pony" d="M43 22 q9 6 7 15 q-1 6 -5 8 q3 -8 1 -14 q-1 -5 -3 -9z" fill="#4A2C1A"/>
  <path d="M32 46 q-13 0 -16 11 a31 31 0 0 0 32 0 q-3 -11 -16 -11z" fill="#8C1D40"/>
  <path d="M24 44 q8 5 16 0 l0 -5 q-8 4 -16 0z" fill="#F0C9A8"/>
  <circle cx="32" cy="31" r="12" fill="#F7D9B8"/>
  <path d="M20 30 q0 -13 12 -13 q12 0 12 13 q0 -7 -12 -8 q-9 -1 -12 8z" fill="#4A2C1A"/>
  <g class="blink" style="transform-origin:27px 31px">
    <circle cx="27" cy="31" r="1.7" fill="#3A2418"/>
  </g>
  <g class="blink" style="transform-origin:37px 31px;animation-delay:.06s">
    <circle cx="37" cy="31" r="1.7" fill="#3A2418"/>
  </g>
  <path d="M29 37 q3 2.4 6 0" stroke="#C4756B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</g>
<circle class="spark" cx="52" cy="16" r="2.4" fill="#FFC627"/>
<circle class="spark" cx="12" cy="21" r="1.7" fill="#FFC627" style="animation-delay:1.1s"/>
<circle class="spark" cx="56" cy="40" r="1.5" fill="#FFC627" style="animation-delay:1.9s"/>
</svg>
