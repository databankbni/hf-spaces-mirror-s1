<svg viewBox="0 0 1112 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .hdr{font-size:11px;font-weight:700;fill:#fff}
      .ttl{font-size:10.5px;font-weight:700;fill:#0d2137}
      .sub{font-size:8.8px;fill:#64748b}
      .cap{font-size:9px;fill:#64748b}
      .lbl{font-size:8.5px;fill:#475569;font-style:italic}
      .panel{fill:#fff;stroke:#d7dee7;stroke-width:1.2}
      .item{fill:#f8fafc;stroke:#e6ebf1;stroke-width:1}
      .flow{stroke:#94a3b8;stroke-width:1.6;fill:none}
    </style>
  </defs>

  <rect x="0" y="0" width="1112" height="500" fill="#ffffff"/>

  <text x="40" y="30" font-size="17" font-weight="700" fill="#111">CRIA — How the tool is built (data-to-decision workflow)</text>
  <text x="40" y="49" font-size="11" fill="#64748b">Colorado River Infrastructure Asset · Arizona State University / NASA Applied Sciences (Award 80NSSC22K0925, PI E. R. Vivoni)</text>

  <rect class="panel" x="40" y="72" width="210" height="300" rx="6"/>
  <rect x="40" y="72" width="210" height="26" rx="6" fill="#0d2137"/>
  <text x="145" y="89" text-anchor="middle" class="hdr">DATA SOURCES</text>
  <rect class="item" x="52" y="108" width="186" height="44" rx="4"/>
  <text x="60" y="126" class="ttl">VIC 5.0 reanalysis</text>
  <text x="60" y="140" class="sub">PRISM-calibrated · NSE 0.96 · WY1984–2024</text>
  <rect class="item" x="52" y="158" width="186" height="40" rx="4"/>
  <text x="60" y="176" class="ttl">GRACE / GRACE-FO</text>
  <text x="60" y="190" class="sub">terrestrial water storage</text>
  <rect class="item" x="52" y="204" width="186" height="40" rx="4"/>
  <text x="60" y="222" class="ttl">SMAP L4</text>
  <text x="60" y="236" class="sub">soil moisture (9 km)</text>
  <rect class="item" x="52" y="250" width="186" height="40" rx="4"/>
  <text x="60" y="268" class="ttl">SNOTEL network</text>
  <text x="60" y="282" class="sub">103 snow stations</text>
  <rect class="item" x="52" y="296" width="186" height="42" rx="4"/>
  <text x="60" y="314" class="ttl">USBR policy</text>
  <text x="60" y="328" class="sub">shortage tiers · capacities</text>

  <rect class="panel" x="284" y="72" width="210" height="300" rx="6"/>
  <rect x="284" y="72" width="210" height="26" rx="6" fill="#0d2137"/>
  <text x="389" y="89" text-anchor="middle" class="hdr">DATA PIPELINE</text>
  <rect class="item" x="296" y="110" width="186" height="52" rx="4"/>
  <text x="304" y="128" class="ttl">preprocessing/ scripts</text>
  <text x="304" y="142" class="sub">aggregate · QC · basin-average ·</text>
  <text x="304" y="154" class="sub">grid-extract</text>
  <path class="flow" d="M389,162 L389,178" marker-end="url(#ar)"/>
  <rect class="item" x="296" y="182" width="186" height="66" rx="4"/>
  <text x="304" y="200" class="ttl">Parquet cache — data/cache/</text>
  <text x="304" y="215" class="sub">11 basin + 19 spatial-grid tables</text>
  <text x="304" y="230" class="sub">~58 GB NetCDF → ~300 MB</text>
  <path class="flow" d="M389,248 L389,264" marker-end="url(#ar)"/>
  <rect class="item" x="296" y="268" width="186" height="50" rx="4"/>
  <text x="304" y="286" class="ttl">utils/data_loader.py</text>
  <text x="304" y="300" class="sub">reads cache once · in-memory</text>

  <rect x="528" y="72" width="300" height="300" rx="6" fill="#fff" stroke="#8c1d40" stroke-width="2"/>
  <rect x="528" y="72" width="300" height="26" rx="6" fill="#8c1d40"/>
  <text x="678" y="89" text-anchor="middle" class="hdr">CRIA DECISION-SUPPORT TOOL</text>
  <rect x="540" y="106" width="276" height="76" rx="4" fill="#fbeef2" stroke="#f0d4dd" stroke-width="1"/>
  <text x="548" y="124" class="ttl">Analytics engine (utils/)</text>
  <text x="548" y="139" class="sub">Mann–Kendall trends · hydrologic elasticity (OLS)</text>
  <text x="548" y="153" class="sub">Budyko · drought &amp; aridity indices</text>
  <text x="548" y="167" class="sub">multivariate confounder control · bootstrap CI</text>
  <rect x="540" y="190" width="276" height="44" rx="4" fill="#fbeef2" stroke="#f0d4dd" stroke-width="1"/>
  <text x="548" y="208" class="ttl">Rendering</text>
  <text x="548" y="222" class="sub">matplotlib server maps &amp; animations · Plotly charts</text>
  <rect x="540" y="242" width="276" height="86" rx="4" fill="#fbeef2" stroke="#f0d4dd" stroke-width="1"/>
  <text x="548" y="260" class="ttl">Dash app (app.py)</text>
  <text x="548" y="275" class="sub">dcc.Location routing · sidebar navigation</text>
  <text x="548" y="289" class="sub">6 decision-framed sections · 29 analysis views</text>
  <text x="548" y="303" class="sub">ΔT / ΔP scenario engine</text>
  <text x="548" y="320" class="sub" font-style="italic">states "no data available" where evidence is missing</text>

  <rect class="panel" x="862" y="72" width="210" height="300" rx="6"/>
  <rect x="862" y="72" width="210" height="26" rx="6" fill="#0d2137"/>
  <text x="967" y="89" text-anchor="middle" class="hdr">OUTPUTS</text>
  <rect class="item" x="874" y="110" width="186" height="52" rx="12"/>
  <text x="882" y="130" class="ttl">Interactive maps &amp; charts</text>
  <text x="882" y="144" class="sub">legend · compass · lat–long</text>
  <rect class="item" x="874" y="172" width="186" height="42" rx="12"/>
  <text x="882" y="197" class="ttl">Animations (GIF)</text>
  <rect class="item" x="874" y="224" width="186" height="52" rx="12"/>
  <text x="882" y="244" class="ttl">Scenario projections</text>
  <text x="882" y="258" class="sub">→ Lake Mead tiers (acre-ft, 95% CI)</text>
  <rect class="item" x="874" y="286" width="186" height="42" rx="12"/>
  <text x="882" y="311" class="ttl">CSV data downloads</text>

  <path class="flow" d="M250,210 L282,210" marker-end="url(#ar)"/>
  <text x="266" y="203" text-anchor="middle" class="lbl">raw</text>
  <path class="flow" d="M494,210 L526,210" marker-end="url(#ar)"/>
  <text x="510" y="203" text-anchor="middle" class="lbl">cached</text>
  <path class="flow" d="M828,210 L860,210" marker-end="url(#ar)"/>
  <text x="844" y="203" text-anchor="middle" class="lbl">render</text>

  <rect class="panel" x="40" y="392" width="454" height="58" rx="6"/>
  <text x="52" y="414" class="ttl">DEPLOYMENT</text>
  <text x="52" y="432" class="sub" font-size="9.5">Docker → gunicorn (2 workers · :7860) → Hugging Face Spaces</text>

  <rect x="528" y="392" width="300" height="58" rx="6" fill="#fbeef2" stroke="#e7b8c6" stroke-width="1.2"/>
  <text x="540" y="414" class="ttl" fill="#8c1d40">VALIDATION &amp; QA</text>
  <text x="540" y="430" class="sub" font-size="9">12+ peer-reviewed studies · SMAP &amp; GRACE</text>
  <text x="540" y="442" class="sub" font-size="9">cross-check · pytest suite (19 tests)</text>
  <path class="flow" d="M678,392 L678,374" marker-end="url(#ar)"/>
  <text x="686" y="386" class="lbl">validates</text>

  <rect class="panel" x="862" y="392" width="210" height="58" rx="6"/>
  <text x="874" y="414" class="ttl">USERS</text>
  <text x="874" y="429" class="sub" font-size="8.6">Reclamation · CAP · Basin States ·</text>
  <text x="874" y="441" class="sub" font-size="8.6">Tribes · researchers · outreach</text>
  <path class="flow" d="M967,372 L967,390" marker-end="url(#ar)"/>

  <text x="40" y="476" class="cap">Rectangles = data &amp; processing stages · maroon = the CRIA app · rounded = outputs and users. All values are real — observed or VIC-modelled — nothing synthetic.</text>
</svg>
