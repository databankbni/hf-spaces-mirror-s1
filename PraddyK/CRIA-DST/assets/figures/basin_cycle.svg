<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="Animated Colorado River Basin cross-section showing precipitation, snowpack, evapotranspiration, soil moisture, runoff, baseflow, groundwater decline and reservoir drawdown, each labelled with its measured change">
<title>The Colorado, in motion — one rainfall followed all the way to the reservoir</title>
<desc>Basin-wide averages from the PRISM-calibrated VIC reanalysis (WY1984-2024) and NASA GRACE. Recent years (WY2015 onward) compared with the WY1983-2010 baseline.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#CFE4F7"/><stop offset="62%" stop-color="#E6F1FA"/>
    <stop offset="100%" stop-color="#F3F8FC"/>
  </linearGradient>
  <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#D2AC84"/><stop offset="100%" stop-color="#C0996E"/>
  </linearGradient>
  <linearGradient id="sub" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#A07C55"/><stop offset="100%" stop-color="#8E6C48"/>
  </linearGradient>
  <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6E563E"/><stop offset="100%" stop-color="#5A4531"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#4C97D4"/><stop offset="100%" stop-color="#1F6BAA"/>
  </linearGradient>
  <clipPath id="mtn">
    <path d="M8 222 L58 158 L88 184 L132 70 L168 122 L198 94 L232 168 L266 138 L296 222 Z"/>
  </clipPath>
  <clipPath id="rivclip"><rect x="242" y="206" width="376" height="40"/></clipPath>
  <clipPath id="resclip"><rect x="626" y="222" width="248" height="138"/></clipPath>
</defs>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .ttl{font-weight:700}
  .drop{animation:fall 2.4s linear infinite}
  @keyframes fall{0%{transform:translateY(0);opacity:0}10%{opacity:.95}85%{opacity:.95}100%{transform:translateY(122px);opacity:0}}
  .wave1{animation:waveX 3.4s linear infinite}
  .wave2{animation:waveX 5.0s linear infinite}
  @keyframes waveX{to{transform:translateX(80px)}}
  .melt{stroke-dasharray:10 8;animation:melt 1.6s linear infinite}
  @keyframes melt{to{stroke-dashoffset:-36}}
  .vap{animation:rise 3.6s ease-in-out infinite}
  @keyframes rise{0%{transform:translateY(0);opacity:0}25%{opacity:.7}100%{transform:translateY(-50px);opacity:0}}
  .ray{animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.95}}
  .seep{animation:seep 3.2s ease-in-out infinite}
  @keyframes seep{0%{transform:translateY(0);opacity:.18}45%{opacity:.9}100%{transform:translateY(-18px);opacity:.18}}
  .cloud{animation:drift 22s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
</style>

<rect x="0" y="0" width="900" height="222" fill="url(#sky)"/>

<circle cx="808" cy="54" r="22" fill="#FFC627"/>
<g class="ray" stroke="#E9A319" stroke-width="3" stroke-linecap="round">
  <line x1="808" y1="16" x2="808" y2="25"/><line x1="808" y1="83" x2="808" y2="92"/>
  <line x1="770" y1="54" x2="779" y2="54"/><line x1="837" y1="54" x2="846" y2="54"/>
  <line x1="781" y1="27" x2="788" y2="34"/><line x1="828" y1="74" x2="835" y2="81"/>
  <line x1="835" y1="27" x2="828" y2="34"/><line x1="788" y1="74" x2="781" y2="81"/>
</g>
<text x="726" y="112" class="ttl" font-size="13.5" fill="#A64B12">Warming +0.28 °C</text>
<text x="726" y="128" font-size="11" fill="#7b8a99">per decade · air temperature</text>

<g class="cloud">
  <g fill="#FFFFFF">
    <circle cx="330" cy="52" r="21"/><circle cx="356" cy="44" r="26"/><circle cx="386" cy="52" r="19"/>
    <circle cx="408" cy="58" r="15"/><rect x="308" y="56" width="116" height="16" rx="8"/>
  </g>
  <g fill="#DDE6EF">
    <rect x="308" y="64" width="116" height="8" rx="4"/>
  </g>
</g>
<g stroke="#4A90C8" stroke-width="3.2" stroke-linecap="round">
  <line class="drop" x1="322" y1="74" x2="322" y2="85" style="animation-delay:0s"/>
  <line class="drop" x1="350" y1="74" x2="350" y2="85" style="animation-delay:.48s"/>
  <line class="drop" x1="378" y1="74" x2="378" y2="85" style="animation-delay:.96s"/>
  <line class="drop" x1="406" y1="74" x2="406" y2="85" style="animation-delay:1.44s"/>
  <line class="drop" x1="364" y1="74" x2="364" y2="85" style="animation-delay:1.92s"/>
</g>
<text x="286" y="26" class="ttl" font-size="14" fill="#2C7CBF">Precipitation −8%</text>
<text x="286" y="42" font-size="11" fill="#7b8a99">where the shortfall begins</text>

<path d="M0 222 L48 176 L96 200 L150 132 L196 178 L244 152 L300 222 Z" fill="#C3CDD8"/>
<path d="M8 222 L58 158 L88 184 L132 70 L168 122 L198 94 L232 168 L266 138 L296 222 Z" fill="#9EACBB"/>
<g clip-path="url(#mtn)">
  <path d="M0 0 H300 V118 q-12 10 -24 2 q-14 -8 -26 6 q-13 12 -28 0 q-14 -11 -27 8 q-15 14 -30 -2
           q-14 -14 -29 6 q-13 16 -28 2 q-14 -12 -28 6 q-14 16 -28 0 q-14 -14 -28 4 Z" fill="#FBFDFF"/>
</g>
<path class="melt" d="M140 148 q12 36 -4 56 q-12 16 6 18" fill="none" stroke="#6FB6E8" stroke-width="3.4" stroke-linecap="round"/>
<text x="14" y="82" class="ttl" font-size="13" fill="#4a5866">Snowpack −4%</text>
<text x="14" y="98" font-size="10.8" fill="#7b8a99">basin-mean: not significant</text>
<text x="14" y="112" font-size="10.8" fill="#7b8a99">but 67 of 103 stations declining</text>

<g class="vap" stroke="#A64B12" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".6">
  <path d="M498 214 q7 -13 0 -26" style="animation-delay:0s"/>
  <path d="M548 214 q-7 -13 0 -26" style="animation-delay:1.2s"/>
  <path d="M598 214 q7 -13 0 -26" style="animation-delay:2.4s"/>
</g>
<text x="470" y="150" class="ttl" font-size="13.5" fill="#A64B12">Evapotranspiration −5%</text>
<text x="470" y="166" font-size="11" fill="#7b8a99">heat raises the demand — but there is</text>
<text x="470" y="180" font-size="11" fill="#7b8a99">less water left to evaporate</text>

<rect x="0" y="222" width="900" height="56" fill="url(#soil)"/>
<rect x="0" y="278" width="900" height="82" fill="url(#sub)"/>
<rect x="0" y="360" width="900" height="140" fill="url(#rock)"/>
<line x1="0" y1="222" x2="900" y2="222" stroke="#A98663" stroke-width="1.5"/>

<rect x="242" y="216" width="376" height="28" fill="url(#water)"/>
<g clip-path="url(#rivclip)">
  <path class="wave1" d="M160,220 q20,-7 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0" fill="none" stroke="#A6D5F7" stroke-width="3.4" stroke-linecap="round"/>
  <path class="wave2" d="M160,231 q20,6 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0" fill="none" stroke="#79BCEE" stroke-width="2.6" stroke-linecap="round" opacity=".85"/>
</g>

<g class="seep" stroke="#8C1D40" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".8">
  <g style="animation-delay:0s"><line x1="300" y1="288" x2="300" y2="262"/><path d="M295 268 L300 261 L305 268"/></g>
  <g style="animation-delay:.85s"><line x1="360" y1="288" x2="360" y2="262"/><path d="M355 268 L360 261 L365 268"/></g>
  <g style="animation-delay:1.7s"><line x1="420" y1="288" x2="420" y2="262"/><path d="M415 268 L420 261 L425 268"/></g>
</g>
<text x="300" y="255" font-size="10" fill="#8C1D40" text-anchor="middle">groundwater feeding the river</text>

<line x1="150" y1="300" x2="600" y2="300" stroke="#C6DEEE" stroke-width="1.6" stroke-dasharray="7 7" opacity=".6"/>
<line x1="150" y1="332" x2="600" y2="332" stroke="#6FB6E8" stroke-width="2.6"/>

<path d="M626 222 L648 360 L852 360 L874 222 Z" fill="#7E6046"/>
<g clip-path="url(#resclip)">
  <rect x="626" y="286" width="248" height="80" fill="url(#water)"/>
  <path class="wave1" d="M560,288 q20,-6 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0" fill="none" stroke="#A6D5F7" stroke-width="3" stroke-linecap="round"/>
</g>
<line x1="638" y1="240" x2="868" y2="240" stroke="#F0E2D0" stroke-width="2.4" opacity=".95"/>
<text x="648" y="235" font-size="10.5" fill="#F5EAD9">full-pool shoreline</text>
<line x1="642" y1="262" x2="866" y2="262" stroke="#F0E2D0" stroke-width="1.8" opacity=".6"/>
<rect x="874" y="222" width="16" height="138" fill="#77828C"/>
<text x="640" y="200" class="ttl" font-size="13.5" fill="#0D2137">Lake Mead</text>
<text x="640" y="185" font-size="11" fill="#5d6b79">first-ever shortage — declared Aug 2021, in effect 2022</text>

<text x="16" y="252" class="ttl" font-size="14" fill="#0B4A7A">Soil moisture −12%</text>
<text x="16" y="268" font-size="10.8" fill="#5E4A33">the sponge is drying — the strongest signal in the record</text>
<text x="470" y="252" class="ttl" font-size="14" fill="#7A340F">Runoff −26%</text>
<text x="470" y="268" font-size="10.8" fill="#5E4A33">what actually reaches the channel</text>

<text x="16" y="348" class="ttl" font-size="14" fill="#FFD4E1">Baseflow −28%</text>
<text x="150" y="348" font-size="10.8" fill="#E8DACA">the reserve that keeps the river alive between storms</text>

<text x="16" y="392" class="ttl" font-size="13" fill="#F3E6D6">Total basin water storage −45 MAF since 2002</text>
<text x="16" y="408" font-size="10.8" fill="#C9B9A6">NASA GRACE — snow, soil, groundwater and surface water combined, expressed as an equivalent</text>
<text x="16" y="420" font-size="10.8" fill="#C9B9A6">depth of water spread over the whole basin. This is not a water-table depth.</text>

<rect x="0" y="424" width="900" height="76" fill="#4E3B29"/>
<text x="16" y="454" class="ttl" font-size="16.5" fill="#FFC627">8% less rain becomes 28% less river — a 3.5× amplification.</text>
<text x="16" y="475" font-size="12.5" fill="#F0E2D2">The decline is driven from below: soil moisture and baseflow carry the strongest signals in four decades, far stronger than rainfall itself.</text>
<text x="16" y="492" font-size="10.3" fill="#C0AF9C">Basin-wide averages · PRISM-calibrated VIC reanalysis WY1984–2024 and NASA GRACE · recent years vs the 1983–2010 baseline · nothing synthetic</text>
</svg>
