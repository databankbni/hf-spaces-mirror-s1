name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch LFS data
        run: git lfs pull || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify data cache is real (not LFS pointers)
        run: |
          python - <<'PY'
          import pandas as pd, glob
          df = pd.read_parquet("data/cache/vic_annual_basin.parquet")
          print("vic_annual_basin shape:", df.shape)
          print("spatial tables:", len(glob.glob("data/cache/spatial/*.parquet")))
          assert not df.empty, "cache parquet is empty — LFS data did not materialize"
          PY

      - name: Run test suite
        run: |
          set +e
          python -m pytest -rA -o console_output_style=classic > pytest_output.txt 2>&1
          code=$?
          echo "----------------- pytest output -----------------"
          cat pytest_output.txt
          echo "-------------------------------------------------"
          grep -E "^(FAILED|ERROR)" pytest_output.txt | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit $code
