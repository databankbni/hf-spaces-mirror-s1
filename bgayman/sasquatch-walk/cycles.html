<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sasquatch cycles</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #1c1c20; color: #d8d4c8; font: 16px/1.4 system-ui, sans-serif; }
    header { padding: 1.2rem 1.4rem 0; }
    header a { color: #e8d5a3; text-decoration: none; border-bottom: 1px solid rgba(232,213,163,0.35); font-size: 0.9rem; }
    main { min-height: calc(100vh - 3rem); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2.5rem; padding: 2rem; }
    figure { margin: 0; text-align: center; }
    img { image-rendering: auto; background: #1c1c20; max-width: 90vw; height: auto; }
    figcaption { margin-top: 0.6rem; opacity: 0.7; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header><a href="index.html">← Great Basin walk</a></header>
  <main>
    <figure>
      <img src="walk.gif" alt="WPA sasquatch walk cycle" width="189" height="256">
      <figcaption>Walk</figcaption>
    </figure>
    <figure>
      <img src="run.gif?v=loop3" alt="WPA sasquatch run cycle" width="189" height="256">
      <figcaption>Run (contact loop)</figcaption>
    </figure>
    <figure>
      <img src="jump.gif" alt="WPA sasquatch jump" width="189" height="256">
      <figcaption>Jump</figcaption>
    </figure>
    <figure>
      <img src="slide.gif" alt="WPA sasquatch slide" width="189" height="256">
      <figcaption>Slide (tumble more than slip)</figcaption>
