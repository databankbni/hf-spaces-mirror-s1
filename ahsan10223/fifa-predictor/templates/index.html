<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA World Cup Predictor Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #04080f;
            --card-bg: rgba(10, 16, 30, 0.85);
            --card-border: rgba(255, 255, 255, 0.07);
            --text-primary: #f0f2f5;
            --text-secondary: #8a95a8;
            --accent-green: #10b981;
            --accent-yellow: #e8c84a;
            --accent-blue: #1a56db;
            --accent-purple: #c0392b;
            --gradient-accent: linear-gradient(135deg, #c0392b 0%, #e74c3c 50%, #e8c84a 100%);
            --font-display: 'Outfit', sans-serif;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            background-image: url('/image.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            padding-bottom: 4rem;
            box-shadow: rgba(0, 0, 0, 0.5);
        }

        header {
            text-align: center;
            padding: 3rem 1.5rem 1.5rem 1.5rem;
            position: relative;
        }

        .header-logo {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 2.2rem;
            letter-spacing: -0.05em;
            color: #ffffff;
        }

        .header-logo .logo-wc {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-logo .logo-gold {
            color: #e8c84a;
            -webkit-text-fill-color: #e8c84a;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 400;
            max-width: 600px;
            margin: 0.5rem auto 0 auto;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Tabs Navigation */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            padding: 0.35rem;
            border-radius: 9999px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 600;
            padding: 0.6rem 1.8rem;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: var(--gradient-accent);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        /* Tab Content */
        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Card Layout */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-top: 2px solid rgba(192, 57, 43, 0.5);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .grid-2col {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Forms Elements */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        select {
            width: 100%;
            padding: 0.85rem 1.2rem;
            background: rgba(4, 8, 15, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:focus {
            border-color: #c0392b;
            box-shadow: 0 0 0 2px rgba(192, 57, 43, 0.25);
        }

        .predict-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #c0392b 0%, #e74c3c 60%, #e8c84a 100%);
            border: none;
            color: white;
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(192, 57, 43, 0.35);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .predict-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(192, 57, 43, 0.55);
        }

        .predict-btn:active {
            transform: translateY(0);
        }

        .predict-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Prediction Result display */
        .results-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            min-height: 250px;
            text-align: center;
            border: 2px dashed rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 2rem;
        }

        .results-active {
            display: block;
            border: none;
            text-align: left;
            padding: 0;
        }

        .placeholder-icon {
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.15);
            margin-bottom: 1rem;
        }

        .placeholder-text {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Results Visualization */
        .winner-card {
            background: linear-gradient(135deg, rgba(192, 57, 43, 0.15) 0%, rgba(232, 200, 74, 0.08) 100%);
            border: 1px solid rgba(192, 57, 43, 0.35);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .winner-star {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: var(--accent-yellow);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
        }

        .winner-info h3 {
            font-family: var(--font-display);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .winner-info p {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .prob-item {
            margin-bottom: 1.2rem;
        }

        .prob-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
        }

        .prob-name {
            color: var(--text-primary);
        }

        .prob-val {
            font-family: var(--font-display);
            font-weight: 700;
        }

        .progress-bar-bg {
            height: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 9999px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0;
            border-radius: 9999px;
            transition: width 1s cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        .bar-green {
            background: linear-gradient(90deg, #c0392b, #e74c3c);
            box-shadow: 0 0 10px rgba(192, 57, 43, 0.5);
        }

        .bar-yellow {
            background: linear-gradient(90deg, #b8860b, #e8c84a);
            box-shadow: 0 0 10px rgba(232, 200, 74, 0.4);
        }

        .bar-blue {
            background: linear-gradient(90deg, #1a56db, #3b82f6);
            box-shadow: 0 0 10px rgba(26, 86, 219, 0.4);
        }

        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-logo">
            <span>⚽</span> <span class="logo-wc">WorldCup</span>&nbsp;<span class="logo-gold">2026</span>&nbsp;Predictor
        </div>
        <p>AI-powered FIFA match predictor with intelligent outcome forecasting.</p>
    </header>

    <div class="container">


        <!-- Predictor Tab -->
        <div id="predict-tab" class="tab-content active" style="display: block;">
            <div class="glass-card">
                <div class="grid-2col">
                    <!-- Prediction Form -->
                    <div>
                        <div>
                            <h2 style="font-family: var(--font-display); margin-bottom: 1.5rem; font-size: 1.6rem;">Fixture Details</h2>
                            
                            <div class="form-group">
                                <label for="home-team">Home Team</label>
                                <select id="home-team" onchange="updateTeamsDropdown()">
                                    <option value="" disabled selected>Select Home Team</option>
                                    {% for team in teams %}
                                        <option value="{{ team }}">{{ team }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="away-team">Away Team</label>
                                <select id="away-team" onchange="updateTeamsDropdown()">
                                    <option value="" disabled selected>Select Away Team</option>
                                    {% for team in teams %}
                                        <option value="{{ team }}">{{ team }}</option>
                                    {% endfor %}
                                </select>
                            </div>


                        </div>

                        <button id="predict-submit-btn" class="predict-btn" onclick="runSinglePrediction()" style="margin-top: 1.5rem;">
                            Generate Prediction
                        </button>
                    </div>

                    <!-- Prediction Results View -->
                    <div>
                        <h2 style="font-family: var(--font-display); margin-bottom: 1.5rem; font-size: 1.6rem;">Prediction</h2>
                        <div id="predict-results-panel" class="results-container">
                            <div class="placeholder-icon">🤖</div>
                            <div class="placeholder-text">Configure fixture details on the left and click predict to run the AI engine.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript logic -->
    <script>
        // Dropdown options syncing
        function updateTeamsDropdown() {
            const homeSelect = document.getElementById('home-team');
            const awaySelect = document.getElementById('away-team');
            const homeVal = homeSelect.value;
            const awayVal = awaySelect.value;

            // Reset disables
            Array.from(homeSelect.options).forEach(opt => opt.disabled = false);
            Array.from(awaySelect.options).forEach(opt => opt.disabled = false);
            
            // Re-disable selected values in opposite selects
            if (homeVal) {
                const opt = Array.from(awaySelect.options).find(o => o.value === homeVal);
                if (opt) opt.disabled = true;
            }
            if (awayVal) {
                const opt = Array.from(homeSelect.options).find(o => o.value === awayVal);
                if (opt) opt.disabled = true;
            }
        }

        // Run match prediction
        async function runSinglePrediction() {
            const homeTeam = document.getElementById('home-team').value;
            const awayTeam = document.getElementById('away-team').value;
            const tournament = 'FIFA World Cup';
            const venue = 'Neutral';
            const btn = document.getElementById('predict-submit-btn');

            if (!homeTeam || !awayTeam) {
                alert('Please select both Home and Away teams.');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Calculating Probabilities...';

            const resultsPanel = document.getElementById('predict-results-panel');
            resultsPanel.className = 'results-container'; // clear results class
            resultsPanel.innerHTML = '<div class="loader" style="display:block; margin: 0 auto 1rem auto; width: 35px; height: 35px;"></div><div class="placeholder-text">Running XGBoost Inference Pipeline...</div>';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ home_team: homeTeam, away_team: awayTeam, tournament: tournament, venue: venue })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }

                // Render result view
                resultsPanel.className = 'results-container results-active';
                
                let winnerText = '';
                let starIcon = '⭐';
                if (data.predicted_outcome === 'Draw') {
                    winnerText = 'Likely Outcome: Draw';
                    starIcon = '🤝';
                } else {
                    winnerText = `Predicted Winner: ${data.predicted_winner}`;
                }

                resultsPanel.innerHTML = `
                    <div class="winner-card">
                        <div class="winner-star">${starIcon}</div>
                        <div class="winner-info">
                            <p>${winnerText}</p>
                        </div>
                    </div>
                    
                    <div class="prob-item">
                        <div class="prob-header">
                            <span class="prob-name">${data.home_team} Win</span>
                            <span class="prob-val">${data.probabilities.home_win}%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div id="bar-home" class="progress-bar-fill bar-green" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="prob-item">
                        <div class="prob-header">
                            <span class="prob-name">Draw Outcome</span>
                            <span class="prob-val">${data.probabilities.draw}%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div id="bar-draw" class="progress-bar-fill bar-yellow" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="prob-item">
                        <div class="prob-header">
                            <span class="prob-name">${data.away_team} Win</span>
                            <span class="prob-val">${data.probabilities.away_win}%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div id="bar-away" class="progress-bar-fill bar-blue" style="width: 0%"></div>
                        </div>
                    </div>
                `;

                // Smoothly trigger bar growth
                setTimeout(() => {
                    document.getElementById('bar-home').style.width = `${data.probabilities.home_win}%`;
                    document.getElementById('bar-draw').style.width = `${data.probabilities.draw}%`;
                    document.getElementById('bar-away').style.width = `${data.probabilities.away_win}%`;
                }, 100);

            } catch (err) {
                alert(`Error generating prediction: ${err.message}`);
                resultsPanel.className = 'results-container';
                resultsPanel.innerHTML = '<div class="placeholder-icon">❌</div><div class="placeholder-text">Failed to calculate prediction. Verify network connection.</div>';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Generate Prediction';
            }
        }

    </script>
</body>
</html>
