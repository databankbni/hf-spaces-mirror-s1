<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contrastive SDF response review</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">GPT-OSS-120B · CONTRASTIVE SDF</p>
      <h1>Response review</h1>
      <p class="subtitle">Base, Model A, and Model B on aligned prompts. Saved experimental responses; no live inference.</p>
    </div>
    <div id="coverage" class="coverage"></div>
  </header>

  <main>
    <section class="controls" aria-label="Filters">
      <label>Prompt type<select id="group"><option value="">All prompt types</option></select></label>
      <label>Context<select id="context"><option value="">All contexts</option></select></label>
      <label>Judge finding<select id="judge"><option value="">All judge findings</option><option value="Judged">Has judge scores</option><option value="Not judged">Not judged</option></select></label>
      <label class="search">Search<input id="search" type="search" placeholder="Prompt, response, reasoning…"></label>
      <button id="reset" class="quiet">Reset</button>
    </section>

    <section class="navigator">
      <button id="previous" aria-label="Previous prompt">← Previous</button>
      <div class="position"><strong id="position">—</strong><span id="matchCount"></span></div>
      <button id="next" aria-label="Next prompt">Next →</button>
    </section>

    <section id="empty" class="empty" hidden>No prompts match these filters.</section>
    <section id="review" hidden>
      <article class="prompt-card">
        <div class="prompt-head">
          <div><span id="groupBadge" class="badge"></span><span id="contextBadge" class="badge secondary"></span></div>
          <div id="sampleControls" class="sample-controls"></div>
        </div>
        <h2 id="taskTitle"></h2>
        <div id="promptMessages" class="messages"></div>
      </article>

      <section id="modelGrid" class="model-grid"></section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
