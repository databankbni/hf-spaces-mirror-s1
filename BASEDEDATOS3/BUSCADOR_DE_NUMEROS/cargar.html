<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargar DATA MASTER - Sistema de Gestión</title>

  <!-- Bootstrap 5 CSS e Iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <style>
    :root {
      --primary-accent: #0284c7;
      --primary-accent-hover: #0369a1;
      --success-accent: #16a34a;
      --success-accent-hover: #15803d;
      --table-header-bg: #1e293b;
      --muted-text: #64748b;
    }

    /* Estilos Generales y Navbar */
    body {
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .navbar {
      background-color: var(--table-header-bg) !important;
    }

    /* Tarjetas */
    .card {
      border-radius: 8px;
    }

    .card-header {
      background-color: var(--table-header-bg) !important;
      border-bottom: none;
    }

    /* Botones Mejorados */
    .btn-success {
      background-color: var(--success-accent);
      border-color: var(--success-accent);
      box-shadow: 0 2px 4px rgba(22, 163, 74, 0.2);
      transition: all 0.2s ease-in-out;
    }

    .btn-success:hover:not(:disabled) {
      background-color: var(--success-accent-hover);
      border-color: var(--success-accent-hover);
      box-shadow: 0 4px 6px rgba(22, 163, 74, 0.3);
    }

    /* Personalización del Input File */
    .form-control:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 0.25rem rgba(2, 132, 199, 0.15);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">📌 Dashboard Números</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html"><i class="bi bi-search me-1"></i> Búsqueda Individual</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="busqueda_masiva.html"><i class="bi bi-list-check me-1"></i> Búsqueda Masiva</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="base_datos.html"><i class="bi bi-table me-1"></i> Base de Datos</a>
          </li>
          <!-- NUEVA OPCIÓN: BUSCADOR CRUZADO -->
          <li class="nav-item">
            <a class="nav-link text-warning fw-bold" href="buscador_cruzado.html"><i class="bi bi-intersect me-1"></i> Buscador Cruzado</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="cargar.html"><i class="bi bi-cloud-upload me-1"></i> Cargar DATA MASTER</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="archivos.html"><i class="bi bi-folder2-open me-1"></i> Gestión Archivos</a>
          </li>
          
          <!-- ENLACE AL BUSCADOR LIBROS DE NEGOCIOS -->
          <li class="nav-item">
            <a class="nav-link text-info fw-bold" href="https://basededatos3-buscador-libros-de-negocios.static.hf.space/index.html" target="_blank" rel="noopener noreferrer">
              <i class="bi bi-box-arrow-up-right me-1"></i> Buscador Libros de Negocios
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <div class="container mt-4" style="max-width: 900px;">
    <div class="card shadow-sm border-0 mb-4 overflow-hidden">
      <div class="card-header text-white py-3 px-4">
        <h6 class="mb-0 fw-bold"><i class="bi bi-file-earmark-excel me-2 text-info"></i> Subir DATA MASTER (Excel / CSV)</h6>
      </div>
      <div class="card-body p-4">
        
        <div class="mb-3">
          <label for="excelFile" class="form-label fw-semibold text-dark">Selecciona el archivo DATA MASTER (.xlsx, .xls o .csv):</label>
          <input class="form-control form-control-sm border-secondary-subtle" type="file" id="excelFile" accept=".xlsx, .xls, .csv">
        </div>

        <!-- Spinner / Mensaje al Seleccionar/Analizar Archivo -->
        <div id="estadoLectura" class="alert alert-info py-2 px-3 border-0 shadow-sm" style="display: none;">
          <div class="d-flex align-items-center">
            <div class="spinner-border spinner-border-sm me-2 text-info" role="status"></div>
            <span id="lblLectura" class="small fw-semibold">Leyendo y analizando archivo en el navegador... Por favor espera.</span>
          </div>
        </div>

        <button id="btnProcesar" class="btn btn-success btn-sm px-4 py-2 fw-bold mt-2" disabled>
          <i class="bi bi-upload me-1"></i> Guardar DATA MASTER en Supabase
        </button>

        <!-- Barra de Progreso al Subir a Supabase -->
        <div class="mt-4" id="estadoCarga" style="display: none;">
          <label id="lblProgreso" class="form-label fw-bold small text-secondary">Subiendo registros a Supabase...</label>
          <div class="progress shadow-sm" style="height: 20px;">
            <div id="barraProgreso" class="progress-bar progress-bar-striped progress-bar-animated bg-success fw-bold small" style="width: 0%">0%</div>
          </div>
        </div>

        <div id="alertResultado" class="alert mt-3 small shadow-sm border-0" style="display: none;"></div>

      </div>
    </div>
  </div>

  <!-- Librerías JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase_client.js"></script>
  <script src="js/upload_tab.js"></script>
</body>
</html>
