<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شاف دار</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="anime_chef.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:#000;color:#fff;padding-bottom:80px}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px;background:#111}
#logo{width:45px;border-radius:50%}
.search-box{padding:20px;text-align:center}
.search{width:90%;padding:12px;border-radius:25px;border:none;background:#222;color:#fff;font-size:16px}
.main{padding:20px;text-align:center}
.ai-btn{background:linear-gradient(90deg,#ff6b00,#ff9500);color:#fff;border:none;padding:15px 30px;border-radius:15px;margin:10px;font-size:16px;width:90%;cursor:pointer}
.bottom-nav{display:flex;justify-content:space-around;position:fixed;bottom:0;width:100%;background:#111;padding:12px;border-top:1px solid #333}
.nav-btn{background:none;border:none;color:#aaa;font-size:12px;cursor:pointer}
.nav-btn.active{color:#ff6b00}
#result{margin-top:20px;padding:15px;background:#1a1a1a;border-radius:10px;display:none}
</style>
</head>
<body>

<div class="header">
<img id="logo" src="anime_chef.png">
<span onclick="alert('الاعدادات: تغيير اللغة واللون قريبا')">⚙️</span>
</div>

<div class="search-box">
<input class="search" id="searchInput" placeholder="ابحث عن وصفة او اكتب المكونات...">
</div>

<div class="main">
<h2>مرحبا في شاف دار 👨‍🍳</h2>
<button class="ai-btn" onclick="takePhoto()">📷 التقط صورة للثلاجة</button>
<button class="ai-btn" onclick="speak()">🔊 اسمع نصيحة من الشاف</button>
<div id="result"></div>
</div>

<div class="bottom-nav">
<button class="nav-btn" onclick="showTab('vip')">👑<br>VIP</button>
<button class="nav-btn" onclick="showTab('account')">👤<br>حسابي</button>
<button class="nav-btn active" onclick="showTab('recipes')">📖<br>وصفات</button>
</div>

<script>
function takePhoto(){
  document.getElementById('result').style.display='block';
  document.getElementById('result').innerHTML='📸 صور ثلاجتك! الذكاء الاصطناعي يقترح: مقارون بالطماطم + شكشوكة 🍝';
}
function speak(){
  let msg = new SpeechSynthesisUtterance("مرحبا بيكم في شاف دار! نصيحة اليوم: دير شوية كمون في القهوة تولي بنينة. ونكتة: علاه الخبزة راحت للطبيب؟ خاطر كانت معجنة!");
  msg.lang='ar-DZ';
  speechSynthesis.speak(msg);
}
function showTab(tab){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  let text = tab=='vip' ? '👑 صفحة VIP: وصفات حصرية قريبا' : tab=='account' ? '👤 حسابي: سجل الوصفات تاعك' : '📖 صفحة الوصفات';
  document.getElementById('result').style.display='block';
  document.getElementById('result').innerHTML=text;
}
</script>
</body>
</html>
