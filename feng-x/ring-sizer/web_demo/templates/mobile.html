<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f1e7" />
  <title>Femometer Smart Ring Sizer</title>
  <meta name="description" content="Upload a photo to quickly measure ring size, using a standard credit card as scale reference." />
  <meta property="og:title" content="Femometer Smart Ring Sizer" />
  <meta property="og:description" content="Upload a photo to quickly measure ring size, using a standard credit card as scale reference." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Femometer Smart Ring Sizer" />
  <meta name="twitter:description" content="Upload a photo to quickly measure ring size, using a standard credit card as scale reference." />
  <link rel="stylesheet" href="/static/mobile/mobile.css" />
</head>
<body>
  <!--
    Step controller paints into this single root container — each step
    fully owns the visible viewport, no nested scrolling. The six steps
    (intro / form / guide / capture / confirm / result) live under
    static/mobile/steps/ and are wired up in mobile.js.
  -->
  <main id="mobileRoot"></main>

  <!-- Capture-coach modules. Loaded up front so they're ready by the
       time the user reaches the capture step (step 4). They register
       on window.* so the mobile capture step can reach them via
       window.HandsDetector / CapturePreview / OrientationDetector. -->
  <script src="/static/preview/thresholds.js"></script>
  <script src="/static/preview/preview.js"></script>
  <script src="/static/preview/orientation.js"></script>
  <script src="/static/shared/measurement-session.js"></script>
  <script src="/static/shared/session-evidence.js"></script>
  <script type="module" src="/static/preview/hands.js"></script>

  <script type="module" src="/static/mobile/mobile.js"></script>
</body>
</html>
