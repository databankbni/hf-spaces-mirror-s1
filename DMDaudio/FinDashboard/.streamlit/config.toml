# Streamlit configuration — Georgian Financials Dashboard.
# - "viewer" toolbar mode hides the top-right hamburger menu (Clear Cache, Deploy,
#   Settings) and the bare-key shortcuts tied to it (e.g. 'C' = Clear Cache, which
#   was eating browser-native Ctrl+C copy).
[client]
toolbarMode = "viewer"

# --- "Terminal" theme — charcoal command bar + gold accent over a clean
# cool-white body. Streamlit's static config defines ONE theme; the dark command
# bar is styled at runtime in lib/ui.render_top_bar. Fonts (Inter / Archivo /
# IBM Plex Mono) are loaded + applied via CSS @import in inject_brand_css —
# `font` stays a generic keyword so the build can't fail on a missing family.
[theme]
base = "light"
primaryColor = "#222B36"              # graphite — primary / structure
backgroundColor = "#DDE2E9"           # graphite-grey content canvas
secondaryBackgroundColor = "#FFFFFF"  # cards / metrics / sidebar (float on the grey)
textColor = "#16181D"                 # ink
linkColor = "#2F6FB0"                 # steel — distinguishable links
borderColor = "#C9D1DB"               # hairline that reads on the grey canvas
showWidgetBorder = true
baseRadius = "0.4rem"
baseFontSize = 14
font = "sans serif"
# Brand categorical palette for built-in charts (Plotly charts are themed
# separately via lib/theme.chart_theme).
chartCategoricalColors = ["#222B36", "#C8922E", "#3E6B8C", "#1E7D5A", "#A6533F", "#6B4E7A"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
borderColor = "#C9D1DB"
