<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="SOLRICKS AD STORYBOARD — turn an ad brief into a structured AI-video shot list." />
  <title>AD-STORYBOARD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <h1>AD-STORYBOARD</h1>
      <p>From brief to shot list.</p>
    </header>

    <section class="panel brief-panel">
      <div class="panel-head">
        <div>
          <span class="eyebrow">CAMPAIGN BRIEF</span>
          <h2>Build your ad</h2>
        </div>
        <button id="sampleBtn" class="ghost">Load Sample</button>
      </div>

      <div class="grid two">
        <label>
          <span>Product / Brand</span>
          <input id="product" placeholder="e.g. ELARVÉ Jeans" />
        </label>
        <label>
          <span>Campaign Objective</span>
          <select id="objective">
            <option>Product launch</option>
            <option>Brand awareness</option>
            <option>Conversion / sales</option>
            <option>UGC social ad</option>
            <option>Luxury brand film</option>
          </select>
        </label>
      </div>

      <div class="grid four">
        <label>
          <span>Duration</span>
          <select id="duration">
            <option value="6">6 sec</option>
            <option value="10">10 sec</option>
            <option value="15" selected>15 sec</option>
            <option value="20">20 sec</option>
            <option value="30">30 sec</option>
          </select>
        </label>
        <label>
          <span>Format</span>
          <select id="format">
            <option value="9:16">9:16 Vertical</option>
            <option value="16:9">16:9 Landscape</option>
            <option value="1:1">1:1 Square</option>
          </select>
        </label>
        <label>
          <span>Platform</span>
          <select id="platform">
            <option>TikTok / Reels</option>
            <option>Instagram Feed</option>
            <option>YouTube</option>
            <option>Website Hero</option>
            <option>Paid Social</option>
          </select>
        </label>
        <label>
          <span>Tone</span>
          <select id="tone">
            <option>Cinematic premium</option>
            <option>UGC natural</option>
            <option>Luxury minimal</option>
            <option>Energetic commercial</option>
            <option>Editorial fashion</option>
          </select>
        </label>
      </div>

      <div class="grid two">
        <label>
          <span>Target Audience</span>
          <input id="audience" placeholder="e.g. Gen Z women, 18–30" />
        </label>
        <label>
          <span>Key Message</span>
          <input id="message" placeholder="e.g. Perfect fit. Every move." />
        </label>
      </div>

      <label>
        <span>Creative Direction</span>
        <textarea id="direction" rows="4" placeholder="Describe the setting, talent, product behavior, visual mood, must-have actions, restrictions..."></textarea>
      </label>

      <div class="grid two">
        <label>
          <span>Call to Action</span>
          <input id="cta" placeholder="e.g. Discover the collection" />
        </label>
        <label>
          <span>Music / Audio Direction</span>
          <input id="audio" placeholder="e.g. modern electronic beat, no vocals" />
        </label>
      </div>

      <div class="actions">
        <button id="generateBtn" class="primary">Generate Storyboard</button>
        <button id="clearBtn" class="ghost">Clear</button>
      </div>
    </section>

    <section id="result" hidden>
      <div class="result-head">
        <div>
          <span class="eyebrow">STORYBOARD</span>
          <h2 id="resultTitle">Untitled campaign</h2>
          <p id="resultMeta"></p>
        </div>
        <div class="actions compact">
          <button id="copyBtn" class="ghost">Copy Shot List</button>
          <button id="pdfBtn" class="ghost">Export Storyboard PDF</button>
          <button id="mdBtn" class="ghost">Export Markdown</button>
          <button id="jsonBtn" class="ghost">Export JSON</button>
        </div>
      </div>

      <section class="summary-strip">
        <div><span>SHOTS</span><strong id="shotCount">0</strong></div>
        <div><span>DURATION</span><strong id="durationOut">0s</strong></div>
        <div><span>FORMAT</span><strong id="formatOut">9:16</strong></div>
        <div><span>PACING</span><strong id="pacingOut">Balanced</strong></div>
      </section>

      <div id="shots" class="shots"></div>

      <section class="panel notes">
        <span class="eyebrow">PRODUCTION NOTES</span>
        <div id="productionNotes"></div>
      </section>
    </section>

    <footer>
      <span></span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
