<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ستاره‌ی پرنده ⭐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            max-width: 100vw;
            max-height: 100vh;
        }
        
        canvas {
            display: block;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.7);
            pointer-events: auto;
            border-radius: 12px;
        }
        
        #gameOverScreen {
            display: none;
        }
        
        h1 {
            color: #ffd700;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #aaa;
            font-size: 1.1em;
            margin-bottom: 30px;
        }
        
        .btn {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            border: none;
            padding: 15px 50px;
            font-size: 1.3em;
            color: #1a1a2e;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 20px rgba(255,215,0,0.3);
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255,215,0,0.5);
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        #scoreDisplay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 3em;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        
        #finalScore {
            color: #ffd700;
            font-size: 2em;
            margin: 10px 0;
        }
        
        #bestScore {
            color: #aaa;
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        
        .instructions {
            color: #888;
            font-size: 0.9em;
            margin-top: 20px;
        }
        
        .star-emoji {
            font-size: 4em;
            margin-bottom: 10px;
            animation: float 2s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div id="scoreDisplay" class="hidden">0</div>
        
        <div id="startScreen">
            <div class="star-emoji">⭐</div>
            <h1>ستاره‌ی پرنده</h1>
            <p class="subtitle">با کلیک یا لمس، ستاره رو بالا ببر!</p>
            <button class="btn" onclick="startGame()">شروع بازی</button>
            <p class="instructions">🖱️ کلیک یا Space = پرش<br>📱 لمس صفحه = پرش</p>
        </div>
        
        <div id="gameOverScreen">
            <div class="star-emoji">💥</div>
            <h1 style="font-size: 2em;">باختی!</h1>
            <div id="finalScore">0</div>
            <div id="bestScore">بهترین: 0</div>
            <button class="btn" onclick="restartGame()">دوباره بازی کن</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const finalScoreEl = document.getElementById('finalScore');
        const bestScoreEl = document.getElementById('bestScore');
        
        // Game state
        let gameRunning = false;
        let score = 0;
        let bestScore = 0;
        let frames = 0;
        
        // Star (player)
        const star = {
            x: 100,
            y: 250,
            velocity: 0,
            gravity: 0.5,
            jumpStrength: -8,
            size: 20,
            rotation: 0
        };
        
        // Pipes
        let pipes = [];
        const pipeWidth = 60;
        const pipeGap = 160;
        const pipeSpeed = 3;
        
        // Background stars
        const bgStars = [];
        for (let i = 0; i < 50; i++) {
            bgStars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                twinkle: Math.random() * Math.PI * 2
            });
        }
        
        // Particles
        let particles = [];
        
        function createParticle(x, y, color) {
            return {
                x, y,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                life: 1,
                color
            };
        }
        
        function drawBackground() {
            // Gradient sky
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(0.5, '#16213e');
            gradient.addColorStop(1, '#0f3460');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Twinkling stars
            bgStars.forEach(s => {
                s.twinkle += 0.02;
                const alpha = 0.3 + Math.sin(s.twinkle) * 0.7;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        function drawStar(x, y, size, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            
            // Glow
            const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 2);
            glow.addColorStop(0, 'rgba(255, 215, 0, 0.8)');
            glow.addColorStop(0.5, 'rgba(255, 215, 0, 0.2)');
            glow.addColorStop(1, 'rgba(255, 215, 0, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, 0, size * 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Star shape
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
                const px = Math.cos(angle) * size;
                const py = Math.sin(angle) * size;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            
            // Inner bright part
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
        
        function drawPipe(pipe) {
            const gradient = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipeWidth, 0);
            gradient.addColorStop(0, '#2d8a3e');
            gradient.addColorStop(0.5, '#4ade80');
            gradient.addColorStop(1, '#2d8a3e');
            
            // Top pipe
            ctx.fillStyle = gradient;
            ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
            
            // Top pipe cap
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(pipe.x - 5, pipe.topHeight - 30, pipeWidth + 10, 30);
            
            // Bottom pipe
            ctx.fillStyle = gradient;
            ctx.fillRect(pipe.x, pipe.topHeight + pipeGap, pipeWidth, canvas.height - pipe.topHeight - pipeGap);
            
            // Bottom pipe cap
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(pipe.x - 5, pipe.topHeight + pipeGap, pipeWidth + 10, 30);
            
            // Highlight
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fillRect(pipe.x + 10, 0, 8, pipe.topHeight);
            ctx.fillRect(pipe.x + 10, pipe.topHeight + pipeGap, 8, canvas.height - pipe.topHeight - pipeGap);
        }
        
        function update() {
            if (!gameRunning) return;
            
            frames++;
            
            // Update star
            star.velocity += star.gravity;
            star.y += star.velocity;
            star.rotation += 0.05;
            
            // Trail particles
            if (frames % 3 === 0) {
                particles.push(createParticle(star.x, star.y, '#ffd700'));
            }
            
            // Update particles
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                return p.life > 0;
            });
            
            // Generate pipes
            if (frames % 100 === 0) {
                const minHeight = 50;
                const maxHeight = canvas.height - pipeGap - minHeight;
                const topHeight = Math.random() * (maxHeight - minHeight) + minHeight;
                pipes.push({
                    x: canvas.width,
                    topHeight,
                    passed: false
                });
            }
            
            // Update pipes
            pipes = pipes.filter(pipe => {
                pipe.x -= pipeSpeed;
                
                // Score
                if (!pipe.passed && pipe.x + pipeWidth < star.x) {
                    pipe.passed = true;
                    score++;
                    scoreDisplay.textContent = score;
                    
                    // Score particles
                    for (let i = 0; i < 10; i++) {
                        particles.push(createParticle(star.x, star.y, '#4ade80'));
                    }
                }
                
                return pipe.x + pipeWidth > 0;
            });
            
            // Collision
            if (star.y < 0 || star.y > canvas.height) {
                gameOver();
                return;
            }
            
            for (const pipe of pipes) {
                if (star.x + star.size > pipe.x && 
                    star.x - star.size < pipe.x + pipeWidth) {
                    if (star.y - star.size < pipe.topHeight || 
                        star.y + star.size > pipe.topHeight + pipeGap) {
                        gameOver();
                        return;
                    }
                }
            }
        }
        
        function draw() {
            drawBackground();
            
            // Draw pipes
            pipes.forEach(drawPipe);
            
            // Draw particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            
            // Draw star
            if (gameRunning || !gameOverScreen.style.display.includes('flex')) {
                drawStar(star.x, star.y, star.size, star.rotation);
            }
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function jump() {
            if (!gameRunning) return;
            star.velocity = star.jumpStrength;
            
            // Jump particles
            for (let i = 0; i < 5; i++) {
                particles.push(createParticle(star.x, star.y + star.size, '#ffd700'));
            }
        }
        
        function startGame() {
            gameRunning = true;
            score = 0;
            frames = 0;
            star.y = 250;
            star.velocity = 0;
            pipes = [];
            particles = [];
            
            scoreDisplay.textContent = '0';
            scoreDisplay.classList.remove('hidden');
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
        }
        
        function gameOver() {
            gameRunning = false;
            
            if (score > bestScore) {
                bestScore = score;
            }
            
            finalScoreEl.textContent = `امتیاز: ${score}`;
            bestScoreEl.textContent = `بهترین: ${bestScore}`;
            
            scoreDisplay.classList.add('hidden');
            gameOverScreen.style.display = 'flex';
        }
        
        function restartGame() {
            startGame();
        }
        
        // Controls
        canvas.addEventListener('mousedown', jump);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!gameRunning && startScreen.style.display !== 'none') {
                    startGame();
                } else if (!gameRunning && gameOverScreen.style.display === 'flex') {
                    restartGame();
                } else {
                    jump();
                }
            }
        });
        
        // Start loop
        gameLoop();
    </script>
</body>
</html>
