name: Sync to Hugging Face Space

# Mỗi khi push lên nhánh main của GitHub, tự động đẩy code sang HF Space để deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:   # cho phép chạy tay từ tab Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force \
            "https://learntoleap:${HF_TOKEN}@huggingface.co/spaces/learntoleap/translateltl" \
            HEAD:main
