<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HermesFace Agent Demo</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 700px; background: #1e293b; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        h1 { margin-top: 0; color: #38bdf8; display: flex; align-items: center; gap: 0.5rem; }
        .chat-box { height: 400px; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 1rem; overflow-y: auto; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
        .message { padding: 0.75rem 1rem; border-radius: 0.5rem; max-width: 80%; line-height: 1.5; }
        .user { background: #0284c7; align-self: flex-end; color: white; }
        .assistant { background: #334155; align-self: flex-start; color: #f1f5f9; }
        .input-row { display: flex; gap: 0.5rem; }
        input { flex: 1; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; }
        input:focus { outline: none; border-color: #38bdf8; }
        button { padding: 0.75rem 1.5rem; background: #0284c7; color: white; border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0284e3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 HermesFace Agent Demo</h1>
        <p style="color: #94a3b8; margin-bottom: 1.5rem;">Interactive static demo showcasing Hermes Agent capabilities.</p>
        
        <div id="chat" class="chat-box">
            <div class="message assistant">Hello! I am Hermes Agent. How can I help you today?</div>
        </div>
        
        <div class="input-row">
            <input type="text" id="userInput" placeholder="Type your message here..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const text = input.value.trim();
            if (!text) return;

            // Add user message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chat.appendChild(userMsg);
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            // Simulate assistant response
            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message assistant';
                aiMsg.textContent = `🤖 Hermes Agent: I received your prompt "${text}". Everything is running smoothly in this static Space!`;
                chat.appendChild(aiMsg);
                chat.scrollTop = chat.scrollHeight;
            }, 500);
        }
    </script>
</body>
</html>
