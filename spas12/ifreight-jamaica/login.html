<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Portal Login & Registration | iFreight Jamaica</title>
  
  <!-- Meta Tags -->
  <meta name="description" content="Log in to your iFreight Jamaica account to access your free Florida mailbox, submit pre-alerts, track incoming packages, and manage customs invoices.">
  <meta name="theme-color" content="#081d1a">

  <!-- Fonts -->
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,800,900&display=swap" rel="stylesheet">
  
  <!-- Main Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <style>
    .auth-page-wrap {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, rgba(19, 166, 156, 0.15) 0%, rgba(8, 29, 26, 0.98) 100%), #081d1a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      color: #ffffff;
    }

    .auth-card-main {
      width: 100%;
      max-width: 480px;
      background: rgba(17, 48, 45, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-xl);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }

    .auth-card-header {
      padding: 2.25rem 2rem 1.5rem 2rem;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .auth-tabs-row {
      display: flex;
      background: rgba(0, 0, 0, 0.35);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .auth-tab-btn {
      flex: 1;
      padding: 1rem 0.5rem;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all var(--transition-fast);
    }

    .auth-tab-btn.active {
      color: var(--color-accent-light);
      border-bottom-color: var(--color-accent);
      background: rgba(19, 166, 156, 0.1);
    }

    .auth-body {
      padding: 2rem;
    }

    .auth-form-pane {
      display: none;
    }

    .auth-form-pane.active {
      display: block;
      animation: ifj-fadeup 0.3s ease;
    }

    .auth-field-group {
      margin-bottom: 1.25rem;
    }

    .auth-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 0.4rem;
    }

    .auth-input, .auth-select {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(0, 0, 0, 0.4) !important;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-sm);
      color: #ffffff !important;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .auth-input:focus, .auth-select:focus {
      border-color: var(--color-accent) !important;
      box-shadow: 0 0 0 3px var(--color-accent-glow);
    }

    .auth-select option {
      background: #11302D !important;
      color: #ffffff !important;
    }

    .btn-auth-submit {
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: var(--color-accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(19, 166, 156, 0.35);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
      margin-top: 0.5rem;
    }

    .btn-auth-submit:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
    }

    .demo-accounts-box {
      margin-top: 1.75rem;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      font-size: 0.82rem;
    }

    .demo-btn-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.65rem;
    }

    .demo-quick-btn {
      flex: 1;
      padding: 6px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-sm);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.76rem;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .demo-quick-btn:hover {
      background: var(--color-accent);
      border-color: var(--color-accent);
    }
  </style>
</head>
<body>

  <div class="auth-page-wrap">
    <div class="auth-card-main">
      <div class="auth-card-header">
        <a href="index.html" style="display: inline-block; margin-bottom: 0.75rem;">
          <img src="assets/ifreightja-logo.png" alt="iFreight Jamaica" style="height: 48px; width: auto; margin: 0 auto;" onerror="this.style.display='none';this.parentElement.innerHTML='<span style=\'font-size:24px;font-weight:900;color:#13A69C;\'>iFreightJa</span>'">
        </a>
        <h2 style="font-size: 1.4rem; font-weight: 800; color: #ffffff; margin: 0;">Member Logistics Portal</h2>
        <span style="font-size: 0.84rem; color: rgba(255, 255, 255, 0.65);">Shipments, Pre-Alerts & Free US Mailbox</span>
      </div>

      <div class="auth-tabs-row">
        <button class="auth-tab-btn active" onclick="switchAuthTab('login')">Sign In</button>
        <button class="auth-tab-btn" onclick="switchAuthTab('register')">Create Free Account</button>
        <button class="auth-tab-btn" onclick="switchAuthTab('reset')">Reset</button>
      </div>

      <div class="auth-body">
        <!-- Tab 1: Member Login -->
        <form id="loginForm" class="auth-form-pane active" onsubmit="handleLoginSubmit(event)">
          <div class="auth-field-group">
            <label class="auth-label">Email or Mailbox ID</label>
            <input type="text" id="loginEmail" class="auth-input" placeholder="e.g. shanice@example.com or IFJ-8492" required value="shanice@example.com">
          </div>

          <div class="auth-field-group">
            <label class="auth-label">Password</label>
            <input type="password" id="loginPass" class="auth-input" placeholder="••••••••" required value="Jamaica2026!">
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; font-size: 0.82rem; color: rgba(255, 255, 255, 0.7);">
            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
              <input type="checkbox" checked style="accent-color: var(--color-accent);"> Remember me
            </label>
            <a href="javascript:void(0)" onclick="switchAuthTab('reset')" style="color: var(--color-accent-light); font-weight: 600;">Forgot Password?</a>
          </div>

          <button type="submit" id="btnLoginSubmit" class="btn-auth-submit">
            <span>Log In to Dashboard →</span>
          </button>
        </form>

        <!-- Tab 2: Register & Create Free Account -->
        <form id="registerForm" class="auth-form-pane" onsubmit="handleRegisterSubmit(event)">
          <div class="auth-field-group">
            <label class="auth-label">Full Name</label>
            <input type="text" id="regName" class="auth-input" placeholder="e.g. Marcus Reid" required>
          </div>

          <div class="auth-field-group">
            <label class="auth-label">Email Address</label>
            <input type="email" id="regEmail" class="auth-input" placeholder="e.g. marcus@example.com" required>
          </div>

          <div class="auth-field-group">
            <label class="auth-label">WhatsApp / Phone Number</label>
            <input type="tel" id="regPhone" class="auth-input" placeholder="e.g. +1 (876) 555-0192" required>
          </div>

          <div class="auth-field-group">
            <label class="auth-label">Primary Pickup Branch</label>
            <select id="regBranch" class="auth-select" required>
              <option value="Kingston">Kingston Hub (7 Lady Musgrave Road)</option>
              <option value="Montego Bay">Montego Bay Hub (Fairview Shopping Centre)</option>
              <option value="Islandwide Delivery">Islandwide Door-to-Door Courier Delivery</option>
            </select>
          </div>

          <div class="auth-field-group">
            <label class="auth-label">Create Password</label>
            <input type="password" id="regPass" class="auth-input" placeholder="Minimum 8 characters" required>
          </div>

          <button type="submit" class="btn-auth-submit">
            <span>Activate Free US Mailbox →</span>
          </button>
        </form>

        <!-- Tab 3: Password Reset -->
        <form id="resetForm" class="auth-form-pane" onsubmit="handleResetSubmit(event)">
          <p style="font-size: 0.88rem; color: rgba(255, 255, 255, 0.7); line-height: 1.5; margin-bottom: 1.25rem;">
            Enter your registered email address and we will dispatch an instant password reset verification link.
          </p>
          <div class="auth-field-group">
            <label class="auth-label">Account Email</label>
            <input type="email" id="resetEmail" class="auth-input" placeholder="e.g. yourname@example.com" required>
          </div>
          <button type="submit" class="btn-auth-submit">
            <span>Send Reset Instructions</span>
          </button>
        </form>

        <!-- 1-Click Fast Demo Logins -->
        <div class="demo-accounts-box">
          <span style="font-weight: 700; color: var(--color-accent-light);">⚡ 1-Click Instant Preview Logins:</span>
          <div class="demo-btn-row">
            <button type="button" class="demo-quick-btn" onclick="fillDemo('client')">Customer Mode (Shanice B.)</button>
            <button type="button" class="demo-quick-btn" onclick="fillDemo('admin')">Operator Mode (Admin)</button>
          </div>
        </div>

        <div style="text-align: center; margin-top: 1.5rem;">
          <a href="index.html" style="font-size: 0.84rem; color: rgba(255, 255, 255, 0.6); transition: color var(--transition-fast);">
            ← Return to iFreight Jamaica Homepage
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    function switchAuthTab(tab) {
      document.querySelectorAll('.auth-tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.auth-form-pane').forEach(p => p.classList.remove('active'));

      if (tab === 'login') {
        document.querySelectorAll('.auth-tab-btn')[0].classList.add('active');
        document.getElementById('loginForm').classList.add('active');
      } else if (tab === 'register') {
        document.querySelectorAll('.auth-tab-btn')[1].classList.add('active');
        document.getElementById('registerForm').classList.add('active');
      } else if (tab === 'reset') {
        document.querySelectorAll('.auth-tab-btn')[2].classList.add('active');
        document.getElementById('resetForm').classList.add('active');
      }
    }

    function fillDemo(role) {
      switchAuthTab('login');
      if (role === 'client') {
        document.getElementById('loginEmail').value = 'shanice@example.com';
        document.getElementById('loginPass').value = 'Jamaica2026!';
      } else {
        document.getElementById('loginEmail').value = 'admin@ifreightja.com';
        document.getElementById('loginPass').value = 'Operator2026!';
      }
      handleLoginSubmit();
    }

    async function handleLoginSubmit(e) {
      if (e) e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const btn = document.getElementById('btnLoginSubmit');

      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span>⏳ Authenticating Portal Session...</span>`;
      }

      let memberCode = localStorage.getItem('ifj_member_code') || 'IFJ-8492';
      let role = 'customer';
      let fullName = 'Shanice Brown';

      if (email.includes('admin') || email.includes('operator')) {
        role = 'admin';
        fullName = 'Operations Director';
        memberCode = 'IFJ-ADMIN-01';
      }

      const session = {
        role,
        user: {
          fullName: email.includes('admin') ? 'Operations Director' : (email.split('@')[0].toUpperCase()),
          email: email || 'shanice@example.com',
          phone: '+1 (876) 879-9026',
          memberCode: memberCode,
          branch: 'Kingston Hub (7 Lady Musgrave)'
        },
        token: 'TOKEN-IFJ-' + Date.now()
      };

      localStorage.setItem('ifj_session', JSON.stringify(session));

      setTimeout(() => {
        window.location.href = 'portal.html';
      }, 750);
    }

    function handleRegisterSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const branch = document.getElementById('regBranch').value;

      const newMemberCode = 'IFJ-' + Math.floor(1000 + Math.random() * 9000);
      localStorage.setItem('ifj_member_code', newMemberCode);

      const session = {
        role: 'customer',
        user: {
          fullName: name,
          email: email,
          phone: phone,
          memberCode: newMemberCode,
          branch: branch
        },
        token: 'TOKEN-IFJ-' + Date.now()
      };

      localStorage.setItem('ifj_session', JSON.stringify(session));
      alert(`Welcome to iFreight Jamaica! Your new Florida Mailbox ID is ${newMemberCode}. Redirecting to your dashboard...`);
      window.location.href = 'portal.html';
    }

    function handleResetSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value.trim();
      alert(`Password reset link dispatched to ${email}. Please check your inbox.`);
      switchAuthTab('login');
    }
  </script>
</body>
</html>
