.yi .item-label{color:var(--green)}
.ji .item-label{color:var(--red)}
.note{margin-top:12px;padding:14px 16px;background:rgba(107,26,43,0.04);border-left:3px solid var(--gold);font-size:14px;line-height:1.8;color:var(--ink-light)}

.footer .brand{font-family:Georgia,'Times New Roman',serif;font-size:14px;font-style:italic;color:var(--gold-dark);letter-spacing:2px;margin-bottom:4px}
.footer .sub{font-size:11px;color:var(--ink-light);opacity:0.5;letter-spacing:1px}
.container{animation:fadeInUp 0.6s ease-out}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.error-box{text-align:center;padding:40px 20px;color:var(--ink-light)}
.error-box .icon{font-size:32px;margin-bottom:12px;opacity:0.5}
@media(max-width:380px){.container{padding:24px 18px}.header .ganzhi{font-size:36px}}
</style>
</head>

function genFortune(person,dStem,dBranch,date){
  var si=shishenIndex(person.dayMaster,dStem);
  var seed=date.getFullYear()*10000+(date.getMonth()+1)*100+date.getDate()+si;
  var rnd=function(n){var x=Math.sin(seed*(n+1)*12.9898+person.dayMaster*78.233)*43758.5453;return x-Math.floor(x)};
  var yi=YI_LIB[si][Math.floor(rnd(1)*5)];
  var ji=JI_LIB[si][Math.floor(rnd(2)*5)];
  var fuyin=person.branches.indexOf(dBranch)!==-1;
  var chongPairs=[[0,6],[1,7],[2,8],[3,9],[4,10],[5,11]];
  var hePairs=[[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]];
  var hitPair=function(pairs){return pairs.some(function(pair){return(person.branches.indexOf(pair[0])!==-1&&dBranch===pair[1])||(person.branches.indexOf(pair[1])!==-1&&dBranch===pair[0])})};
  var chong=hitPair(chongPairs);
  var he=hitPair(hePairs);
  var note;
  if(fuyin){note=person.name+'今天日支伏吟，'+SHISHEN[si]+'能量叠加，内心比平时敏感，情绪容易被触发。适合独处消化，不适合硬碰硬'}
  else if(chong){note=person.name+'今天日支相冲，'+SHISHEN[si]+'被冲动，容易有突如其来的情绪或事件。保持冷静，事后再做判断'}
  else if(he){note=person.name+'今天日支相合，'+SHISHEN[si]+'得助力，人缘和贵人运都不错，适合主动沟通、推进想做的事'}
  else{note=person.name+'今天'+SHISHEN[si]+'当令，能量平稳，适合按自己的节奏做事，不必强求也不必回避'}
  return{yi:yi,ji:ji,note:note,sensitive:fuyin||chong}
}
function pickAdvice(sets,lSens,xSens,date,salt){
  var seed=date.getFullYear()*10000+(date.getMonth()+1)*100+date.getDate();
  var x=Math.sin(seed*12.9898+salt*78.233)*43758.5453;
  var idx=Math.floor((x-Math.floor(x))*5);
  if(lSens&&xSens)return sets.both[idx];
  if(lSens)return sets.leonSensitive[idx];
  if(xSens)return sets.xingSensitive[idx];
  return sets.good[idx]
}
