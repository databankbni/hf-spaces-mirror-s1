[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-twin-sem"
version = "0.1.0"
description = "SEM 2027 digital twin physics + strategy optimizer package"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pymoo",
    "cma",
]

[tool.setuptools]
packages = ["digital_twin"]
