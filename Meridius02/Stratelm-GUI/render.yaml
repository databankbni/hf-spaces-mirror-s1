services:
  - type: web
    name: stratelm-gui-fullstack
    env: python
    buildCommand: "npm install --prefix ../frontend && npm run build --prefix ../frontend && pip install -e ../../digital_twin && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    rootDir: Stratelm-GUI/backend
