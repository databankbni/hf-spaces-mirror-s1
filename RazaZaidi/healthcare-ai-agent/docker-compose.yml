services:
  healthcare-ai:
    build: .
    container_name: healthcare-ai
    ports:
      - "7860:7860"
    environment:
      - HOST=0.0.0.0
      - PORT=7860
      - DB_PATH=/app/data/healthcare.db
      - UPLOAD_DIR=/app/uploads
      - SECRET_KEY=${SECRET_KEY:-change-this-secret}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ENABLE_CONTEXT_WEB_SEARCH=${ENABLE_CONTEXT_WEB_SEARCH:-1}
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-1}
    volumes:
      - ./artifacts/data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
