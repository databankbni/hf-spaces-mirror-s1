<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeMask AI | Custom UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container text-center mt-4">
        <nav class="floating-nav">
            <div class="d-flex align-items-center">
                <i class="fas fa-shield-virus text-primary me-2 fs-4"></i>
                <span class="fw-bold fs-5">SafeMask AI</span>
            </div>
            <div class="status-indicator">
                <span class="badge bg-success">System Active</span>
            </div>
        </nav>
    </div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="glass-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold m-0">Live Camera Feed</h5>
                    </div>
                    
                    <div class="video-wrapper" style="position: relative;">
                        <video id="videoElement" autoplay playsinline style="display: none;"></video>
                        <canvas id="outputCanvas" style="width: 100%; height: auto; border-radius: 20px;"></canvas>
                    </div>
                    
                    <div class="mt-3 text-center">
                        <p class="text-muted small">Powered by TensorFlow & Flask on Docker</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
