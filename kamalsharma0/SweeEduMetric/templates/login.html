{% extends "base.html" %}
{% block content %}
<div class="login-wrapper">
    <div class="glass-card auth-card">
        <div class="ai-orb"></div>
        <h1 id="auth-title">System Login</h1>
        <p class="subtitle">SweeEduMetric AI Mathematics</p>
        
        <!-- Login Form -->
        <div id="login-form" class="auth-panel">
            <div class="form-group">
                <label>Student ID</label>
                <input type="text" id="login-username" placeholder="e.g. Sweejal">
            </div>
            <div class="form-group">
                <label>Secure PIN</label>
                <input type="password" id="login-pin" placeholder="Enter PIN (e.g. 1234)">
            </div>
            <button class="btn-primary glow-btn" onclick="attemptAuth('login')">INITIALIZE LINK</button>
            <!-- YAHAN HAI NEW USER KA OPTION -->
            <p class="toggle-text">New Student? <a href="#" onclick="toggleAuth()">Create Profile</a></p>
        </div>

        <!-- Registration Form (New User) -->
        <div id="register-form" class="auth-panel" style="display: none;">
            <div class="form-group">
                <label>New Student ID</label>
                <input type="text" id="reg-username" placeholder="Choose a Username">
            </div>
            <div class="form-group">
                <label>Set Secure PIN</label>
                <input type="password" id="reg-pin" placeholder="Create a PIN">
            </div>
            <button class="btn-secondary glow-btn" onclick="attemptAuth('register')">REGISTER PROFILE</button>
            <p class="toggle-text">Existing Student? <a href="#" onclick="toggleAuth()">Login Here</a></p>
        </div>
        
        <p id="auth-status" class="status-text"></p>
    </div>
</div>
{% endblock %}
