{% extends "base.html" %}
{% block content %}
<h2 class="page-title">Mathematics Modules</h2>
<div class="chapters-grid">
    {% for chap in chapters %}
    <div class="glass-card chapter-card">
        <h3>{{ chap.name }}</h3>
        <p>Module {{ chap.id }} / 12</p>
        <div class="progress-bar"><div class="fill" style="width: {{ chap.progress }}%"></div></div>
        <a href="/practice/{{ chap.id }}" class="btn-secondary">Initiate Practice</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
