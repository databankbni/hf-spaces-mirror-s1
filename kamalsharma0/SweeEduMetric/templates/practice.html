{% extends "base.html" %}
{% block content %}
<div class="practice-header">
    <div>
        <h2 style="margin-bottom: 5px;">{{ chapter.name }}</h2>
        <div style="font-family: 'Rajdhani'; font-size: 1.2rem; background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 8px; border: 1px solid var(--glass-border); display: inline-block;">
            <span style="color: var(--neon-blue);">Attempted: <span id="attempted-count">0</span></span> &nbsp;|&nbsp; 
            <span style="color: var(--neon-purple);">Remaining: <span id="remaining-count">-</span></span>
        </div>
    </div>
    <a href="/learning" class="btn-ghost">Abort Module</a>
</div>

<div class="glass-card question-card" id="q-container">
    <!-- JS se questions inject honge -->
</div>

<script>
    // Jinja template se database ke questions directly JS variable me aa jayenge
    const questions = {{ questions | tojson }};
</script>
{% endblock %}
