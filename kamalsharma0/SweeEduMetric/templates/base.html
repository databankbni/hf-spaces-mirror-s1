<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SweeEduMetric AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="grid-overlay"></div>
    {% if session.get('user_id') %}
    <nav class="glass-nav">
        <div class="logo">SweeEduMetric <span class="ai-badge">CORE</span></div>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/learning">Learning Modules</a>
            <a href="/logout" class="logout-btn">Terminate</a>
        </div>
    </nav>
    {% endif %}
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <div id="toast-container"></div>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
