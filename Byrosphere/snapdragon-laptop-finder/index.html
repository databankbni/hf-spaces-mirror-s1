<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thirst Aid</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f3ecd8;
    }

    header {
        background-color: #1f4d3b;
        color: #fff8e7;
        padding: 24px;
        text-align: center;
        border-bottom: 6px solid #e0a52b;
    }

    header h1 {
        margin: 0;
        font-size: 36px;
        letter-spacing: 2px;
    }

    header p {
        margin-top: 8px;
        font-size: 14px;
        letter-spacing: 3px;
    }

main {
    padding: 24px;
}

.hydration-card {
    background-color: #fff8e7;
    border: 3px solid #1f4d3b;
    border-radius: 16px;
    padding: 24px;
    max-width: 500px;
    margin: 30px auto;
    text-align: center;
}

.hydration-card h2 {
    margin-top: 0;
    color: #1f4d3b;
    letter-spacing: 1px;
}

.water-count {
    font-size: 40px;
    font-weight: bold;
    color: #1f4d3b;
    margin-top: 20px;

}

.button-area button {
  background-color: #1f4d3b;
  color: #fff8e7;
  border: none;
  padding: 12px 18px;
  margin: 5px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.reset-button {
  background-color: #e0a52b;
  color: #1f4d3b;
}
.button-area button:hover {
  opacity: 0.85;
}

.reset-button:hover {
  opacity: 0.75;

}

.progress-bar {
    width: 100%;
    height: 28px;
    background-color: #fff8e7;
    border: 2px solid #1f4d3b;
    border-radius: 14px;
    overflow: hidden;
    margin-top: 20px;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background-color: #2a9d8f;
    transition: width 0.4s ease;
}
</style>
</head>

<body>
    <header>
        <h1>✚ THIRST AID</h1>
        <p>EMERGENCY HYDRATION KIT</p>
    </header>
<main>

    <section class="hydration-card">

        <h2>TODAY'S HYDRATION</h2>

        <div class="water-count">
            <span id="water-total">0</span>
            <span>/ 64 oz</span>
        </div>
<div class="progress-area">

  <div class="progress-bar">
    <div class="progress-fill"></div>
  </div>

<p id="progress-text">0% complete</p>
<p id="status-message">🚨 HYDRATION NEEDED — Take a dose!</p>

</div>

<div class="button-area">
<button onclick="addWater(8)">+ 8 oz</button>
<button onclick="addWater(12)">+ 12 oz</button>
<button onclick="addWater(16)">+ 16 oz</button>
<button class="reset-button" onclick="resetWater()">Reset Day</button>
</div>

</section>

<script>
  let waterTotal = 0;

  function addWater(amount) {
    waterTotal = waterTotal + amount;

    document.getElementById("water-total").textContent = waterTotal;

    let percent = Math.min((waterTotal / 64) * 100, 100);

    document.querySelector(".progress-fill").style.width = percent + "%";

    document.getElementById("progress-text").textContent =
      Math.round(percent) + "% complete";
  }

  function resetWater() {
    waterTotal = 0;

    document.getElementById("water-total").textContent = waterTotal;

    document.querySelector(".progress-fill").style.width = "0%";

    document.getElementById("progress-text").textContent = "0% complete";

let status = document.getElementById("status-message");

if (percent >= 100) {
    status.textContent = "✅ HYDRATION COMPLETE — Patient stabilized!";
} else if (percent >= 75) {
    status.textContent = "💪 ALMOST THERE — Finish strong!";
} else if (percent >= 50) {
    status.textContent = "💧 RECOVERY IN PROGRESS — Looking good!";
} else if (percent >= 25) {
    status.textContent = "🩹 TREATMENT UNDERWAY — Keep sipping!";
} else {
    status.textContent = "🚨 HYDRATION NEEDED — Take a dose!";
}
  }

</script>

</main>
</body>
</html>
