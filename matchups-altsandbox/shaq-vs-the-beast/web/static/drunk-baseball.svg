<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
	<g>
		<!-- dizzy stars -->
		<text x="32" y="34" font-size="13" fill="#ffe066">★</text>
		<text x="116" y="30" font-size="9" fill="#ffe066">✦</text>
		<text x="120" y="112" font-size="10" fill="#ffe066">★</text>

		<!-- legs + shoes, kicked out for balance -->
		<path d="M68 112 Q58 126 50 138" stroke="#caa472" stroke-width="7" fill="none" stroke-linecap="round"/>
		<path d="M94 112 Q106 122 112 136" stroke="#caa472" stroke-width="7" fill="none" stroke-linecap="round"/>
		<ellipse cx="46" cy="141" rx="9" ry="5.5" fill="#3a2a1a" transform="rotate(-12 46 141)"/>
		<ellipse cx="115" cy="139" rx="9" ry="5.5" fill="#3a2a1a" transform="rotate(14 115 139)"/>

		<!-- left arm raising a beer mug -->
		<path d="M58 92 Q34 86 28 64" stroke="#caa472" stroke-width="7" fill="none" stroke-linecap="round"/>
		<g transform="translate(10,40) rotate(-14)">
			<rect x="0" y="8" width="22" height="28" rx="3" fill="#ffce54" stroke="#caa033" stroke-width="2"/>
			<path d="M-7 16 q-7 2 -7 9 q0 7 7 9" fill="none" stroke="#caa033" stroke-width="2.5"/>
			<path d="M1 8 q10 -8 20 0 q-3 6 -10 6 q-7 0 -10 -6 Z" fill="#fff8e7"/>
		</g>

		<!-- right arm holding a footlong hot dog -->
		<path d="M100 92 Q126 84 134 62" stroke="#caa472" stroke-width="7" fill="none" stroke-linecap="round"/>
		<g transform="translate(112,38) rotate(28)">
			<rect x="0" y="0" width="46" height="15" rx="7.5" fill="#e8c189"/>
			<rect x="3" y="3" width="40" height="9" rx="4.5" fill="#c1652f"/>
			<path d="M5 7.5 Q12 2 19 7.5 T33 7.5 T41 7.5" stroke="#f4d35e" stroke-width="2" fill="none" stroke-linecap="round"/>
		</g>

		<!-- baseball body -->
		<circle cx="80" cy="82" r="34" fill="#f7f4ea" stroke="#1a1a1a" stroke-width="2.5"/>
		<path d="M56 62 Q80 72 56 102" stroke="#d6314a" stroke-width="2" fill="none"/>
		<path d="M104 62 Q80 72 104 102" stroke="#d6314a" stroke-width="2" fill="none"/>
		<path d="M58 60 l4 4 M58 104 l4 -4 M52 71 l4.5 1.5 M52 93 l4.5 -1.5 M102 60 l-4 4 M102 104 l-4 -4 M108 71 l-4.5 1.5 M108 93 l-4.5 -1.5" stroke="#d6314a" stroke-width="1.5"/>

		<!-- rosy drunk blush -->
		<circle cx="62" cy="89" r="5.5" fill="#ff9aa2" opacity="0.7"/>
		<circle cx="98" cy="89" r="5.5" fill="#ff9aa2" opacity="0.7"/>

		<!-- wonky eyebrows -->
		<path d="M58 64 q9 -7 16 -1" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
		<path d="M86 62 q9 5 17 -2" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>

		<!-- googly, swimming eyes -->
		<circle cx="67" cy="75" r="7.5" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
		<circle cx="70" cy="78" r="3.2" fill="#1a1a1a"/>
		<circle cx="93" cy="73" r="7.5" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
		<circle cx="88" cy="70" r="3.2" fill="#1a1a1a"/>

		<!-- loose, hiccuping smile -->
		<path d="M64 97 q6 9 16 4 q10 5 16 -5" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
	</g>
</svg>
