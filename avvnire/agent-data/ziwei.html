// 时干支 (五鼠遁): 子时天干 = TG[(riGan%5)*2], 再推进h个时辰
var sg=TG[(riGan%5*2+h)%10];

var dxNames=['限命','限兄','限夫','限子','限财','限疾','限迁','限友','限官','限宅','限福','限父'];
if(selectedPalace>=0){
var lyOffset=(selectedPalace-pIdx+12)%12;
var lyNames=['流命','流兄','流夫','流子','流财','流疾','流迁','流友','流官','流宅','流福','流父'];
var lyMonth=((p.pos-douJun+12)%12)+1;
var lyLunarNames=['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','腊月'];var lyTGIdx=((currentYear-4)%10+10)%10;var lyYinTG=[2,4,6,8,0][lyTGIdx%5];var lyGZ=TG[(lyYinTG+lyMonth-1)%10]+DZ[(2+lyMonth-1)%12];html+='<div class="ly-overlay">'+lyNames[lyOffset]+' '+lyGZ+' '+lyLunarNames[lyMonth-1]+'</div>';
}else{
var by=chartData.birthYear||currentYear-chartData.age;
var dxP=chartData.palaces[selectedDx];
for(var a=dxP.dxStart;a<=dxP.dxEnd;a++){
var yr=by+a-1;
var yDz=((yr-4)%12+12)%12;
if(yDz===p.pos){
html+='<div class="ly-tag">'+yr+'年 '+a+'岁</div>';
break;
}
}
}
html+='<div class="dx-overlay">'+dxNames[dxOffset]+'</div>';
}
html+='</div>';
}
}
}
document.getElementById('chart').innerHTML=html;
}

function renderDxBar(){
if(!chartData)return;
try{
var bar=document.getElementById('dxBar');
var html='';
var sorted=chartData.palaces.map(function(p,i){return{idx:i,start:p.dxStart};}).sort(function(a,b){return a.start-b.start;});
sorted.forEach(function(item){
var i=item.idx;
var p=chartData.palaces[i];
var cls='dx-item';
if(selectedDx===i)cls+=' active';
html+='<div class="'+cls+'" onclick="toggleDx('+i+')">'+p.dxStart+'-'+p.dxEnd+'</div>';
});
bar.innerHTML=html;
}catch(e){showError('大限栏渲染异常: '+e.message);}
}

// ========== 宫位要点数据 ==========
var PALACE_POINTS=null;
fetch('/assets/palace_points.json').then(function(r){return r.json();}).then(function(d){PALACE_POINTS=d;if(window._needPP)renderPalacePoints();}).catch(function(e){console.error('宫位要点数据加载失败',e);});
// ========== 宫位要点渲染 ==========
function renderPalacePoints(){
var box=document.getElementById('palacePointsBox');
if(!chartData){box.style.display='none';return;}
if(!PALACE_POINTS){window._needPP=true;box.innerHTML='<div class="palace-points-title">宫位要点</div><div class="palace-points-empty">数据加载中...</div>';box.style.display='block';return;}
try{
var selIdx=selectedPalace>=0?selectedPalace:chartData.palaces.findIndex(function(p){return p.pos===chartData.mingGong;});
if(selIdx<0){box.style.display='none';return;}
var pal=chartData.palaces[selIdx];
var palName=pal.name;
var mainStars=getMainStars(pal);
var html='';
html+='<div class="palace-points-title">'+palName.replace(/宫$/,'')+'宫要点'+(selectedPalace>=0?'':'（命宫）')+'</div>';
if(mainStars.length===0){
html+='<div class="palace-points-empty">此宫无主星，可参考对宫主星论断。</div>';
}else{
mainStars.forEach(function(star){
var desc=PALACE_POINTS[star]&&PALACE_POINTS[star][palName];
if(desc){
html+='<div class="palace-points-item">';
html+='<div class="palace-points-star">'+star+'坐'+palName+'</div>';
html+='<div class="palace-points-text">'+escapeHtml(desc)+'</div>';
html+='</div>';
}
});
}
box.innerHTML=html;
box.style.display='block';
}catch(e){showError('宫位要点渲染异常: '+e.message);}
}

var POS_PAIRS={0:'子午',1:'丑未',2:'寅申',3:'卯酉',4:'辰戌',5:'巳亥',6:'子午',7:'丑未',8:'寅申',9:'卯酉',10:'辰戌',11:'巳亥'};

function cleanPanshang(s){
return s.replace(/福德持[^，]*，/g,'').replace(/福德无星，/g,'').replace(/疾厄持[^，]*，/g,'').replace(/福德亦无主星，此时以疾厄宫之[^：]*：/g,'').replace(/福德临[^，]*，/g,'');
}
function getMainStars(pal){
var stars=[];
if(pal){pal.stars.forEach(function(s){if(s.type==='main')stars.push(s.name);});}
return stars.sort();
}
function renderPanshang(){
var box=document.getElementById('panshangBox');
if(!chartData){box.style.display='none';return;}
try{
var mg=chartData.mingGong;
var pair=POS_PAIRS[String(mg)]||'';
var qyPos=(mg+6)%12;
var mgPal=chartData.palaces.find(function(p){return p.pos===mg;});
var qyPal=chartData.palaces.find(function(p){return p.pos===qyPos;});
var mgStars=getMainStars(mgPal);
var qyStars=getMainStars(qyPal);
var html='';
var starKey=mgStars.join(',');
if(mgStars.length>0){
var key=pair+'|'+starKey;
var text=PANSHANG_STAR[key];
if(text){html='<div class="panshang-title">命盘解说：</div><div class="panshang-text" id="psText"><span id="psContent">'+escapeHtml(cleanPanshang(text))+'</span><button class="wx-mask-btn" onclick="copyWx()">缘起 · 深度咨询</button></div>';}
}else{
var oppKey=qyStars.join(',');
var key2=pair+'|'+oppKey;
var text2=PANSHANG_NOMAIN[key2];
if(text2){html='<div class="panshang-title">命盘解说：</div><div class="panshang-text" id="psText"><span id="psContent">'+escapeHtml(cleanPanshang(text2))+'</span><button class="wx-mask-btn" onclick="copyWx()">缘起 · 深度咨询</button></div>';}
}
if(html){
box.innerHTML=html;
box.style.display='block';
adjustMask();
}else{
box.style.display='none';
}
}catch(e){showError('命盘解说渲染异常: '+e.message);}
}

function adjustMask(){
var ps=document.getElementById('psContent');
var btn=document.querySelector('.wx-mask-btn');
if(!ps||!btn)return;
var txt=ps.textContent;
if(txt.length<3)return;
var last3=txt.slice(-3);
var tmp=document.createElement('span');
tmp.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:9px/1.6 "KaiTi","STKaiti","serif"';
tmp.textContent=last3;
document.body.appendChild(tmp);
var w=tmp.offsetWidth;
document.body.removeChild(tmp);
btn.style.marginLeft=(-w-1)+'px';
}

// ========== 表单 ==========
function initForm(){
var fr=document.getElementById('formRow');
var h='<div class="cal-type"><button id="btnSolar" class="active" onclick="switchCal(\'solar\')">阳历</button><button id="btnLunar" onclick="switchCal(\'lunar\')">农历</button></div>';
h+='<label>年</label><select id="fYear"></select>';
h+='<span id="solarMD"><label>月</label><select id="fMonth"></select><label>日</label><select id="fDay"></select></span>';
h+='<span id="lunarMD" style="display:none"><label>月</label><select id="fLMonth"></select><label>日</label><select id="fLDay"></select></span>';
h+='<label>时</label><select id="fHour"></select>';
h+='<label>性别</label><select id="fGender"><option value="male">男</option><option value="female">女</option></select>';
h+='<button class="btn" onclick="doPaipan()">排盘</button>';
fr.innerHTML=h;
var ys=document.getElementById('fYear');
for(var y=1940;y<=2030;y++){ys.add(new Option(y+'年',y));}
document.getElementById('fYear').value=1990;
var sm=document.getElementById('fMonth');
for(var m=1;m<=12;m++){sm.add(new Option(m+'月',m));}
var sd=document.getElementById('fDay');
for(var d=1;d<=31;d++){sd.add(new Option(d+'日',d));}
document.getElementById('fMonth').value=6;
document.getElementById('fDay').value=15;
var lm=document.getElementById('fLMonth');
for(var m=1;m<=12;m++){lm.add(new Option(LUNAR_MONTHS[m-1],m));lm.add(new Option('闰'+LUNAR_MONTHS[m-1],m+100));}
var ld=document.getElementById('fLDay');
for(var d=1;d<=30;d++){ld.add(new Option(LUNAR_DAYS[d-1],d));}
var hh=document.getElementById('fHour');
var dzNames=['子时(23-1)','丑时(1-3)','寅时(3-5)','卯时(5-7)','辰时(7-9)','巳时(9-11)','午时(11-13)','未时(13-15)','申时(15-17)','酉时(17-19)','戌时(19-21)','亥时(21-23)'];
for(var i=0;i<12;i++){hh.add(new Option(dzNames[i],i));}
document.getElementById('fHour').value=0;
}

function switchCal(type){
calType=type;
document.getElementById('btnSolar').classList.toggle('active',type==='solar');
document.getElementById('btnLunar').classList.toggle('active',type==='lunar');
document.getElementById('solarMD').style.display=type==='solar'?'':'none';
document.getElementById('lunarMD').style.display=type==='lunar'?'':'none';
if(type==='lunar'){
var y=safeInt(document.getElementById('fYear').value,1940,2030,1990);
var m=safeInt(document.getElementById('fMonth').value,1,12,6);
var d=safeInt(document.getElementById('fDay').value,1,31,15);
try{
var lr=solar2lunar(y,m,d);
var lm=document.getElementById('fLMonth');
for(var i=0;i<lm.options.length;i++){
if(lm.options[i].value==lr.month){lm.selectedIndex=i;break;}
}
document.getElementById('fLDay').value=lr.day;
}catch(e){showError('农历转换失败: '+e.message);}
}else{
var y=safeInt(document.getElementById('fYear').value,1940,2030,1990);
var lm=+document.getElementById('fLMonth').value;
var isLeap=lm>100;if(isLeap)lm-=100;
var ld=safeInt(document.getElementById('fLDay').value,1,30,15);
try{
var sr=lunar2solar(y,lm,ld,isLeap);
if(sr){
document.getElementById('fMonth').value=sr.month;
document.getElementById('fDay').value=sr.day;
}
}catch(e){showError('阳历转换失败: '+e.message);}
}
}

function doPaipan(){
hideError();
var y=safeInt(document.getElementById('fYear').value,1940,2030,1990);
var h=safeInt(document.getElementById('fHour').value,0,11,0);
var gender=document.getElementById('fGender').value;
if(gender!=='male'&&gender!=='female'){gender='male';}
var ny,nm,nd;
var ly,lm,ld,isLeap;
if(calType==='solar'){
nm=safeInt(document.getElementById('fMonth').value,1,12,6);
nd=safeInt(document.getElementById('fDay').value,1,31,15);
ny=y;
try{
var lr=solar2lunar(y,nm,nd);
ly=lr.year;lm=lr.month;ld=lr.day;isLeap=lr.isLeap;
}catch(e){showError('农历转换失败: '+e.message);return;}
}else{
ly=y;
lm=+document.getElementById('fLMonth').value;
isLeap=lm>100;if(isLeap)lm-=100;
ld=safeInt(document.getElementById('fLDay').value,1,30,15);
try{
var sr=lunar2solar(ly,lm,ld,isLeap);
if(!sr){showError('农历日期无效，请检查');return;}
ny=sr.year;nm=sr.month;nd=sr.day;
}catch(e){showError('阳历转换失败: '+e.message);return;}
}
try{
chartData=paipan(ly,lm,ld,isLeap,h,gender,ny,nm,nd);
if(!chartData){showError('排盘计算返回空结果');return;}
selectedDx=chartData.currentDx;
selectedPalace=-1;
renderChart();
renderDxBar();
renderPanshang();
renderPalacePoints();
}catch(e){
showError('排盘计算异常: '+e.message);
console.error(e);
}
}

// ========== 事件 ==========
function togglePalace(idx){
if(selectedPalace===idx){selectedPalace=-1;}else{selectedPalace=idx;}
renderChart();
renderPalacePoints();
}
function toggleDx(idx){
if(selectedDx===idx){selectedDx=-1;}else{selectedDx=idx;}
renderChart();
renderDxBar();
}
window.addEventListener('resize',debounce(adjustMask,150));

// ========== 微信复制 ==========
function copyWx(){
var wx='AVVNIRE';
try{
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(wx).then(showWxModal).catch(function(){_fallbackCopy(wx);});
}else{_fallbackCopy(wx);}
}catch(e){_fallbackCopy(wx);}
}
function _fallbackCopy(text){
var ta=document.createElement('textarea');
ta.value=text;
ta.style.position='fixed';ta.style.opacity='0';
document.body.appendChild(ta);ta.select();
try{document.execCommand('copy');}catch(e){}
document.body.removeChild(ta);
showWxModal();
}
function showWxModal(){
var m=document.createElement('div');
m.className='wx-modal';
m.innerHTML='<div class="wx-modal-box"><div class="wx-modal-text">微信号已复制，打开微信粘贴搜索添加好友开始深度咨询吧！</div><button class="wx-modal-btn" onclick="closeWxModal()">确定</button></div>';
m.addEventListener('click',function(e){if(e.target===m)closeWxModal();});
document.body.appendChild(m);
}
function closeWxModal(){
var m=document.querySelector('.wx-modal');
if(m)m.remove();
}
