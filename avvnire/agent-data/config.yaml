_config_version: 23



# ── Model ──────────────────────────────────────────────────────────────

model:


  default: agnes-2.0-flash

  provider: agnes

  base_url: https://apihub.agnes-ai.com/v1/chat/completions

  api_mode: chat_completions


providers:

  agnes:

    api_key: ${AGNES_API_KEY}


fallback_providers: []



credential_pool_strategies:


  agnes: fill_first


# ── Agent ──────────────────────────────────────────────────────────────

agent:

  max_turns: 150

  gateway_timeout: 1800

  restart_drain_timeout: 180

  api_max_retries: 3

  service_tier: ""

  tool_use_enforcement: auto

  gateway_timeout_warning: 900

  clarify_timeout: 600

  gateway_notify_interval: 180

  gateway_auto_continue_freshness: 3600

  image_input_mode: auto

  disabled_toolsets: []



# ── Memory (Hindsight Cloud) ───────────────────────────────────────────

memory:

  memory_enabled: true

  user_profile_enabled: true

  memory_char_limit: 2200

  user_char_limit: 1375

  provider: hindsight



# ── Terminal ───────────────────────────────────────────────────────────

terminal:

  backend: local

  modal_mode: auto

  cwd: hermes

  timeout: 180

  env_passthrough: []

  shell_init_files: []

  auto_source_bashrc: true

  persistent_shell: true



# ── Web ────────────────────────────────────────────────────────────────

web:

  backend: ""

  search_backend: ""

  extract_backend: ""



# ── Browser ────────────────────────────────────────────────────────────

browser:

  inactivity_timeout: 120

  command_timeout: 30

  record_sessions: false

  allow_private_urls: false

  engine: auto

  auto_local_for_private_urls: true

  dialog_policy: must_respond

  dialog_timeout_s: 300



# ── Checkpoints ────────────────────────────────────────────────────────

checkpoints:

  enabled: false

  max_snapshots: 20

  max_total_size_mb: 500

  max_file_size_mb: 10

  auto_prune: true

  retention_days: 7

  delete_orphans: true

  min_interval_hours: 24



# ── File / Tool Output ─────────────────────────────────────────────────

file_read_max_chars: 100000

tool_output:

  max_bytes: 50000

  max_lines: 2000

  max_line_length: 2000



tool_loop_guardrails:

  warnings_enabled: true

  hard_stop_enabled: false

  warn_after:

    exact_failure: 2

    same_tool_failure: 3

    idempotent_no_progress: 2

  hard_stop_after:

    exact_failure: 5

    same_tool_failure: 8

    idempotent_no_progress: 5



# ── Compression ────────────────────────────────────────────────────────

compression:

  enabled: true

  threshold: 0.5

  target_ratio: 0.2

  protect_last_n: 20

  hygiene_hard_message_limit: 400

  protect_first_n: 3

  abort_on_summary_failure: false



# ── Prompt Caching ────────────────────────────────────────────────────

prompt_caching:

  cache_ttl: "5m"



  response_cache: true

  response_cache_ttl: 300



# ── Auxiliary ──────────────────────────────────────────────────────────

auxiliary:

  vision:

    provider: auto

    model: ""

    base_url: ""

    api_key: ""

    timeout: 120

    extra_body: {}

    download_timeout: 30



# ── Context ────────────────────────────────────────────────────────────

context:

  engine: compressor



# ── Toolsets ───────────────────────────────────────────────────────────

toolsets:

- hermes-cli



# ── Platform Toolsets ─────────────────────────────────────────────────

platform_toolsets:

  cli:

  - browser

  - clarify

  - code_execution

  - computer_use

  - cronjob

  - delegation

  - file

  - image_gen

  - memory

  - messaging

  - session_search

  - skills

  - terminal

  - todo

  - tts

  - vision

  - web

  qqbot:

  - browser

  - clarify

  - code_execution

  - computer_use

  - cronjob

  - delegation

  - file

  - image_gen

  - memory

  - messaging

  - session_search

  - skills

  - terminal

  - todo

  - tts

  - vision

  - web



known_plugin_toolsets:

  cli:

  - spotify



# ── Skills ─────────────────────────────────────────────────────────────

skills:

  external_dirs: []

  guard_agent_created: false

  inline_shell: false

  inline_shell_timeout: 10

  template_vars: true



# ── Sessions ───────────────────────────────────────────────────────────

sessions:

  auto_prune: false

  min_interval_hours: 24

  retention_days: 90

  vacuum_after_prune: true

  write_json_snapshots: false



session_reset:

  at_hour: 4

  idle_minutes: 1440

  mode: none



# ── Logging ────────────────────────────────────────────────────────────

logging:

  backup_count: 3

  level: INFO

  max_size_mb: 5

  memory_monitor:

    enabled: true

    interval_seconds: 300



# ── Security ───────────────────────────────────────────────────────────

security:

  acked_advisories: []

  allow_lazy_installs: true

  allow_private_urls: false

  redact_secrets: true

  tirith_enabled: true

  tirith_fail_open: true

  tirith_path: tirith

  tirith_timeout: 5



# ── Display ────────────────────────────────────────────────────────────

display:

  bell_on_complete: false

  busy_input_mode: interrupt

  compact: false

  copy_shortcut: auto

  ephemeral_system_ttl: 0

  file_mutation_verifier: true

  final_response_markdown: strip

  inline_diffs: true

  interim_assistant_messages: true

  language: zh

  persistent_output: true

  persistent_output_max_lines: 200

  personality: default

  platforms: {}

  resume_display: full

  runtime_footer:

    enabled: false

    fields:

    - model

    - context_pct

    - cwd

  show_cost: false

  show_reasoning: false

  skin: default

  streaming: false

  timestamps: false

  tool_preview_length: 0

  tool_progress: all

  tool_progress_command: false

  tool_progress_overrides: {}

  tui_auto_resume_recent: false

  tui_status_indicator: kaomoji

  user_message_preview:

    first_lines: 2

    last_lines: 2



# ── Delegation ─────────────────────────────────────────────────────────

delegation:

  model: ""

  provider: ""

  base_url: ""

  api_key: ""

  api_mode: ""

  inherit_mcp_toolsets: true

  max_iterations: 50

  child_timeout_seconds: 600

  reasoning_effort: ""

  max_concurrent_children: 3

  max_spawn_depth: 1

  orchestrator_enabled: true

  subagent_auto_approve: false



# ── Cron ───────────────────────────────────────────────────────────────

cron:

  max_parallel_jobs: null

  wrap_response: true



# ── Curator ───────────────────────────────────────────────────────────

curator:

  archive_after_days: 90

  backup:

    enabled: true

    keep: 5

  enabled: true

  interval_hours: 168

  min_idle_hours: 2

  stale_after_days: 30



# ── Goals ──────────────────────────────────────────────────────────────

goals:

  max_turns: 20



# ── Human Delay ────────────────────────────────────────────────────────

human_delay:

  max_ms: 2500

  min_ms: 800

  mode: off



# ── Network ────────────────────────────────────────────────────────────

network:

  force_ipv4: false



# ── Prefill ────────────────────────────────────────────────────────────

prefill_messages_file: ""



# ── Privacy ────────────────────────────────────────────────────────────

privacy:

  redact_pii: false



# ── Model Catalog ─────────────────────────────────────────────────────

model_catalog:

  enabled: true

  providers: {}

  ttl_hours: 24

  url: https://hermes-agent.nousresearch.com/docs/api/model-catalog.json



# ── TTS ────────────────────────────────────────────────────────────────

tts:

  edge:

    voice: zh-CN-XiaoxiaoNeural

  provider: edge



# ── STT ────────────────────────────────────────────────────────────────

stt:

  enabled: false



# ── Voice ──────────────────────────────────────────────────────────────

voice:

  auto_tts: false

  beep_enabled: true

  max_recording_seconds: 120

  record_key: ctrl+b

  silence_duration: 3.0

  silence_threshold: 200



# ── Updates ────────────────────────────────────────────────────────────

updates:

  backup_keep: 5

  pre_update_backup: false



# ── Approvals ──────────────────────────────────────────────────────────

approvals:

  cron_mode: deny

  destructive_slash_confirm: true

  mcp_reload_confirm: true

  mode: manual

  timeout: 60



# ── Hooks ──────────────────────────────────────────────────────────────

hooks: {}

hooks_auto_accept: false



# ── Quick Commands ─────────────────────────────────────────────────────

quick_commands: {}



# ── Personalities ──────────────────────────────────────────────────────

personalities: {}



# ── Kanban ─────────────────────────────────────────────────────────────

kanban:

  auto_decompose: true

  auto_decompose_per_tick: 3

  default_assignee: ""

  dispatch_in_gateway: true

  dispatch_interval_seconds: 60

  dispatch_stale_timeout_seconds: 14400

  failure_limit: 2

  orchestrator_profile: ""

  worker_log_backup_count: 1

  worker_log_rotate_bytes: 2097152



# ── LSP ────────────────────────────────────────────────────────────────

lsp:

  enabled: false



# ── Timezone ───────────────────────────────────────────────────────────

timezone: Asia/Shanghai



# ── Onboarding ─────────────────────────────────────────────────────────

onboarding:

  seen:

    busy_input_prompt: true

    tool_progress_prompt: true



# ── Dashboard ──────────────────────────────────────────────────────────

dashboard:

  show_token_analytics: false

  theme: default



# ── Command Allowlist ──────────────────────────────────────────────────

command_allowlist: []



# ── Code Execution ─────────────────────────────────────────────────────

code_execution:

  mode: project



# ── Bedrock ────────────────────────────────────────────────────────────

bedrock:

  region: ""

  discovery:

    enabled: true

    provider_filter: []

    refresh_interval: 3600

  guardrail:

    guardrail_identifier: ""

    guardrail_version: ""

    stream_processing_mode: async

    trace: disabled



# ── Discord ────────────────────────────────────────────────────────────

discord:

  allow_any_attachment: false

  allowed_channels: ""

  auto_thread: true

  channel_prompts: {}

  dm_role_auth_guild: ""

  free_response_channels: ""

  history_backfill: true

  history_backfill_limit: 50

  max_attachment_bytes: 33554432

  reactions: true

  require_mention: true

  server_actions: ""

  thread_require_mention: false



# ── Slack ──────────────────────────────────────────────────────────────

slack:

  allowed_channels: ""

  channel_prompts: {}

  free_response_channels: ""

  require_mention: true



# ── Telegram ───────────────────────────────────────────────────────────

telegram:

  allowed_chats: ""

  channel_prompts: {}

  reactions: false



# ── Matrix ─────────────────────────────────────────────────────────────

matrix:

  allowed_rooms: ""

  free_response_rooms: ""

  require_mention: true



# ── Mattermost ─────────────────────────────────────────────────────────

mattermost:

  allowed_channels: ""

  channel_prompts: {}

  free_response_channels: ""

  require_mention: true



# ── WhatsApp ───────────────────────────────────────────────────────────

whatsapp: {}



# ── X Search ───────────────────────────────────────────────────────────

x_search:

  model: grok-4.20-reasoning

  retries: 2

  timeout_seconds: 180



# ── Honcho ─────────────────────────────────────────────────────────────

honcho: {}

