const BODY_RATIOS = { '신발':0.00, '발목':0.05, '종아리':0.17, '무릎':0.25, '허벅지':0.36, '골반':0.48, '허리':0.57 };

function calcTotalLength(h, cat, len) {
  const s = START_RATIOS[cat], e = BODY_RATIOS[len];
  return (s != null && e != null && h) ? Math.round((s - e) * h * 10) / 10 : 0;
}

/** CSS pt와 동일하게 캔버스에 그리기 (96 DPI 기준) */
const PT_TO_PX = 96 / 72;
const AI_DISCLOSURE_TEXT = '가상인물포함';
/** 화면 오버레이는 10pt 유지, 저장·일괄 다운로드(캔버스)만 고해상도에서 읽히도록 크게 */
const AI_DISCLOSURE_EXPORT_FONT_PT = 28;
/** 10pt 글자 기준 12pt 여백 비율을 28pt에 맞게 환산한 뒤, 캔버스 크기에 비례해 최소 여백 보장 */
const AI_DISCLOSURE_EXPORT_MARGIN_PT = 12;
function drawAiDisclosureOnCanvas(ctx, canvasWidth, canvasHeight) {
  const fontSize = AI_DISCLOSURE_EXPORT_FONT_PT * PT_TO_PX;
  const minSide = Math.min(canvasWidth, canvasHeight || canvasWidth);
  const marginFromFontRatio =
    AI_DISCLOSURE_EXPORT_MARGIN_PT * (AI_DISCLOSURE_EXPORT_FONT_PT / 10) * PT_TO_PX;
  const marginFromImage = minSide * 0.028;
  const marginFromFont = fontSize * 0.72;
  const margin = Math.round(Math.max(marginFromFontRatio, marginFromImage, marginFromFont, 18));
  ctx.save();
  ctx.font = `300 ${fontSize}px Pretendard, -apple-system, BlinkMacSystemFont, sans-serif`;
  ctx.fillStyle = '#3c3c3c';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillText(AI_DISCLOSURE_TEXT, canvasWidth - margin, margin);
  ctx.restore();
}

const REQUIRED_DESIGN_SLOT_INDEXES = DESIGN_IMAGE_SLOTS
  .map((slot, idx) => slot.required ? idx : null)
  .filter(idx => idx !== null);

function normalizeDesignImages(images = []) {
  return Array.from({ length: MAX_DESIGN_IMAGES }, (_, idx) => images[idx] || null);
}

function getUploadedDesignImages(images = []) {
  return normalizeDesignImages(images).filter(Boolean);
}

function countUploadedDesignImages(images = []) {
  return getUploadedDesignImages(images).length;
}

function hasRequiredDesignImages(images = []) {
  const normalized = normalizeDesignImages(images);
  return REQUIRED_DESIGN_SLOT_INDEXES.every(idx => Boolean(normalized[idx]));
}

function buildDesignSlotImagesPayload(images = []) {
  const normalized = normalizeDesignImages(images);
  return normalized
    .map((img, idx) => (
      img && img.url
        ? {
            slot: idx,
            label: DESIGN_IMAGE_SLOTS[idx]?.label || `slot-${idx}`,
            image: img.url,
            name: img.name || '',
            filename: img.name || '',
          }
        : null
    ))
    .filter(Boolean);
}

function collectDesignImageFilenames(images = []) {
  return normalizeDesignImages(images)
    .filter(Boolean)
    .map((img, idx) => img.name || `product_${idx}.png`);
}

async function generateModelImage(designImagesBase64, shotLabel = SHOT_FRONT.label, imageSize = '2K', referenceImage = null, customPrompt = '', ghostSourceSlot = null, designSlotImages = null, modelPreset = DEFAULT_MODEL_PRESET, bodyType = DEFAULT_BODY_TYPE, productImageFilenames = null) {
  const res = await fetch('/api/generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      promptMode: 'direct',
      designImages: designImagesBase64,
      shotLabel,
      referenceImage: referenceImage || null,
      modelPreset: modelPreset || DEFAULT_MODEL_PRESET,
      bodyType: bodyType || DEFAULT_BODY_TYPE,
      ...(customPrompt.trim() ? { customPrompt: customPrompt.trim() } : {}),
      imageSize: imageSize || '2K',
      ...(ghostSourceSlot != null && ghostSourceSlot !== '' ? { ghostSourceSlot } : {}),
      ...(Array.isArray(designSlotImages) && designSlotImages.length ? { designSlotImages } : {}),
      ...(Array.isArray(productImageFilenames) && productImageFilenames.length
        ? { productImageFilenames, designImageFilenames: productImageFilenames }
        : {}),
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
    throw new Error(err.detail || `HTTP ${res.status}`);
  }
  const data = await res.json();
  return data.imageUrl;
}

async function editGeneratedImage(currentImageBase64, editInstruction, referenceImages, imageSize = '2K', bodyType = null, productImageFilenames = null) {
  const refs = Array.isArray(referenceImages) ? referenceImages : (referenceImages ? [referenceImages] : []);
  const res = await fetch('/api/edit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      currentImage: currentImageBase64,
      editInstruction,
      referenceImages: refs.filter(r => r && r.startsWith && r.startsWith('data:')),
      imageSize: imageSize || '2K',
      ...(bodyType ? { bodyType } : {}),
      ...(Array.isArray(productImageFilenames) && productImageFilenames.length
        ? { productImageFilenames, designImageFilenames: productImageFilenames }
        : {}),
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
    throw new Error(err.detail || `HTTP ${res.status}`);
  }
  const data = await res.json();
  return data.imageUrl;
}

async function generateProductMotionVideo(currentImageBase64, prompt = '', durationSeconds = DEFAULT_VIDEO_DURATION, motionStyle = DEFAULT_VIDEO_MOTION, productImageFilenames = null) {
  const res = await fetch('/api/video', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      currentImage: currentImageBase64,
      motionStyle: motionStyle || DEFAULT_VIDEO_MOTION,
      ...(prompt.trim() ? { prompt: prompt.trim() } : {}),
      durationSeconds: durationSeconds || DEFAULT_VIDEO_DURATION,
      aspectRatio: '9:16',
      resolution: '1080p',
      ...(Array.isArray(productImageFilenames) && productImageFilenames.length
        ? { productImageFilenames, designImageFilenames: productImageFilenames, filename: productImageFilenames[0] }
        : {}),
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
    throw new Error(typeof err.detail === 'string' ? err.detail : (err.detail || `HTTP ${res.status}`));
  }
  const data = await res.json();
  return { videoUrl: data.videoUrl, motionStyle: data.motionStyle || motionStyle, durationSeconds: data.durationSeconds };
}

function downloadDataUrl(dataUrl, filename) {
  const link = document.createElement('a');
  link.href = dataUrl;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

      reader.onload = (ev) => resolve({

        url: ev.target.result,
        name: file.name || 'design-image',
      });
      reader.onerror = () => reject(new Error(`${file.name} 파일을 읽지 못했습니다.`));

  const [startPt, setStartPt] = useState(null);
  const [crop, setCrop] = useState(null);
  const [resizing, setResizing] = useState(null);

  const getPos = useCallback((e) => {
    const rect = imgRef.current?.getBoundingClientRect();
    if (!rect) return null;
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: Math.max(0, Math.min(cx - rect.left, rect.width)), y: Math.max(0, Math.min(cy - rect.top, rect.height)) };
  }, []);

  const handleMouseDown = useCallback((e) => {
    if (e.target.dataset?.handle) { setResizing(e.target.dataset.handle); e.preventDefault(); return; }
    const pos = getPos(e);
    if (!pos) return;
    setDragging(true); setStartPt(pos); setCrop(null);
  }, [getPos]);

  const handleMouseMove = useCallback((e) => {
    const pos = getPos(e);
    if (!pos) return;
    const rect = imgRef.current?.getBoundingClientRect();
    if (!rect) return;
    const W = rect.width, H = rect.height;
    if (resizing && crop) {
      let { x, y, w, h: ch } = crop;
      if (resizing.includes('e')) w = Math.max(20, pos.x - x);
      if (resizing.includes('w')) { const dx = pos.x - x; x = pos.x; w = Math.max(20, w - dx); }
      if (resizing.includes('s')) ch = Math.max(20, pos.y - y);
      if (resizing.includes('n')) { const dy = pos.y - y; y = pos.y; ch = Math.max(20, ch - dy); }
      setCrop({ x: Math.max(0, Math.min(x, W-20)), y: Math.max(0, Math.min(y, H-20)), w: Math.min(w, W-x), h: Math.min(ch, H-y) });
      return;
    }
    if (dragging && startPt) {
      const x = Math.min(startPt.x, pos.x), y = Math.min(startPt.y, pos.y);
      setCrop({ x, y, w: Math.min(Math.abs(pos.x - startPt.x), W - x), h: Math.min(Math.abs(pos.y - startPt.y), H - y) });
    }
  }, [dragging, startPt, resizing, crop, getPos]);

  const handleMouseUp = useCallback(() => { setDragging(false); setStartPt(null); setResizing(null); }, []);

  useEffect(() => {
    window.addEventListener('mouseup', handleMouseUp); window.addEventListener('touchend', handleMouseUp);
    return () => { window.removeEventListener('mouseup', handleMouseUp); window.removeEventListener('touchend', handleMouseUp); };
  }, [handleMouseUp]);

  const doCrop = () => {
    if (!crop || !imgRef.current) return;
    const rect = imgRef.current.getBoundingClientRect();
    const sx = Math.round(crop.x * imgSize.w / rect.width), sy = Math.round(crop.y * imgSize.h / rect.height);
    const sw = Math.round(crop.w * imgSize.w / rect.width), sh = Math.round(crop.h * imgSize.h / rect.height);
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = sw; c.height = sh;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#FFF'; ctx.fillRect(0,0,sw,sh);
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
      onCropDone(c.toDataURL('image/png'));
    };
    img.src = imageUrl;
  };

  const hPos = (p) => {
    const b = { position:'absolute', width:'12px', height:'12px', background:'#3B82F6', border:'2px solid white', borderRadius:'2px', zIndex:10 };
    const m = -6;
    const map = { nw:{top:m,left:m,cursor:'nw-resize'}, n:{top:m,left:'50%',marginLeft:m,cursor:'n-resize'}, ne:{top:m,right:m,cursor:'ne-resize'}, e:{top:'50%',marginTop:m,right:m,cursor:'e-resize'}, se:{bottom:m,right:m,cursor:'se-resize'}, s:{bottom:m,left:'50%',marginLeft:m,cursor:'s-resize'}, sw:{bottom:m,left:m,cursor:'sw-resize'}, w:{top:'50%',marginTop:m,left:m,cursor:'w-resize'} };
    return { ...b, ...map[p] };
  };

  const cropInfo = crop && imgRef.current ? `${Math.round(crop.w * imgSize.w / imgRef.current.getBoundingClientRect().width)} × ${Math.round(crop.h * imgSize.h / imgRef.current.getBoundingClientRect().height)}px` : null;

  return h('div', { className: 'fixed inset-0 z-[70] bg-black/95 flex flex-col items-center justify-center animate-fadeIn', onClick: e => e.stopPropagation() },
    h('div', { className: 'absolute top-0 left-0 right-0 h-14 bg-black/80 backdrop-blur-sm flex items-center justify-between px-6 z-20' },
      h('div', { className: 'flex items-center gap-3' },
        h(Crop, { size: 18, className: 'text-[#3B82F6]' }),
        h('span', { className: 'text-white font-bold text-sm' }, '이미지 크롭'),
        cropInfo ? h('span', { className: 'text-gray-400 text-xs ml-2' }, cropInfo) : null
      ),
      h('div', { className: 'flex items-center gap-2' },
        h('button', { onClick: () => setCrop(null), className: 'px-3 py-1.5 text-xs text-gray-400 hover:text-white border border-gray-700 rounded-lg transition-colors' }, '영역 초기화'),
        h('button', { onClick: onCancel, className: 'px-4 py-1.5 text-xs text-gray-400 hover:text-white border border-gray-700 rounded-lg transition-colors' }, '취소'),
        h('button', { onClick: doCrop, disabled: !crop || crop.w < 10 || crop.h < 10, className: 'px-4 py-1.5 text-xs font-bold text-white bg-[#3B82F6] hover:bg-[#2563EB] disabled:bg-gray-700 disabled:text-gray-500 rounded-lg transition-colors flex items-center gap-1.5' },
          h(Download, { size: 14 }), '크롭 저장')
      )
    ),
    h('div', { className: 'relative mt-14 select-none', style: { cursor: crop ? 'default' : 'crosshair' }, onMouseDown: handleMouseDown, onMouseMove: handleMouseMove, onTouchStart: handleMouseDown, onTouchMove: handleMouseMove },
      h('img', { ref: imgRef, src: imageUrl, onLoad: (e) => setImgSize({ w: e.target.naturalWidth, h: e.target.naturalHeight }), className: 'max-w-[85vw] max-h-[80vh] object-contain rounded-lg', style: { userSelect:'none', pointerEvents:'none' }, draggable: false }),
      crop ? h('div', { className: 'absolute inset-0 pointer-events-none' },
        h('div', { style: { position:'absolute', top:0, left:0, right:0, height:`${crop.y}px`, background:'rgba(0,0,0,0.6)' } }),
        h('div', { style: { position:'absolute', top:`${crop.y+crop.h}px`, left:0, right:0, bottom:0, background:'rgba(0,0,0,0.6)' } }),
        h('div', { style: { position:'absolute', top:`${crop.y}px`, left:0, width:`${crop.x}px`, height:`${crop.h}px`, background:'rgba(0,0,0,0.6)' } }),
        h('div', { style: { position:'absolute', top:`${crop.y}px`, left:`${crop.x+crop.w}px`, right:0, height:`${crop.h}px`, background:'rgba(0,0,0,0.6)' } })
      ) : null,
      crop ? h('div', { style: { position:'absolute', left:`${crop.x}px`, top:`${crop.y}px`, width:`${crop.w}px`, height:`${crop.h}px`, border:'2px solid #3B82F6', pointerEvents:'auto' } },
        h('div', { style: { position:'absolute', left:'33.33%', top:0, bottom:0, width:'1px', background:'rgba(255,255,255,0.2)' } }),
        h('div', { style: { position:'absolute', left:'66.66%', top:0, bottom:0, width:'1px', background:'rgba(255,255,255,0.2)' } }),
        h('div', { style: { position:'absolute', top:'33.33%', left:0, right:0, height:'1px', background:'rgba(255,255,255,0.2)' } }),
        h('div', { style: { position:'absolute', top:'66.66%', left:0, right:0, height:'1px', background:'rgba(255,255,255,0.2)' } }),
        ...['nw','n','ne','e','se','s','sw','w'].map(p => h('div', { key: p, 'data-handle': p, style: hPos(p), onMouseDown: handleMouseDown, onTouchStart: handleMouseDown }))
      ) : null
    ),
    !crop ? h('p', { className: 'absolute bottom-8 text-gray-500 text-xs' }, '드래그하여 크롭 영역을 선택하세요') : null
  );
}

        collectDesignImageFilenames(mainImages)
      );
      setResults(prev => prev.map(r => r.id === result.id ? { ...r, imageUrl: newImageUrl } : r));
      if (isFrontShot) {
        setFrontRefImage(newImageUrl);
      }
      if (previewResult?.id === result.id) setPreviewResult(prev => prev ? { ...prev, imageUrl: newImageUrl } : null);
    } catch (error) {
      alert("이미지 재생성에 실패했습니다: " + error.message);
    } finally {
      setRegeneratingIds(prev => {
        const next = new Set(prev);
        next.delete(result.id);
        return next;
      });
    }
  };

  const setVideoPrompt = (slotIndex, value) => {
    setVideoPrompts(prev => ({ ...prev, [slotIndex]: value }));
  };

  const handleGenerateProductVideo = async (slotIndex) => {
    const normalized = normalizeDesignImages(mainImagesRef.current);
    const img = normalized[slotIndex];
    if (!img?.url) {
      alert('먼저 해당 슬롯에 제품 이미지를 업로드해주세요.');
      return;
    }
    const prompt = (videoPrompts[slotIndex] || '').trim();
    setVideoGeneratingSlots(prev => new Set([...prev, slotIndex]));
    try {
      const { videoUrl, motionStyle, durationSeconds } = await generateProductMotionVideo(
        img.url,
        prompt,
        DEFAULT_VIDEO_DURATION,
        DEFAULT_VIDEO_MOTION,
        img.name ? [img.name] : null
      );
      setProductVideos(prev => ({
        ...prev,
        [slotIndex]: { videoUrl, motionStyle, durationSeconds, prompt },
      }));
    } catch (error) {
      alert('영상 생성에 실패했습니다: ' + (error.message || error));
    } finally {
      setVideoGeneratingSlots(prev => {
        const next = new Set(prev);
        next.delete(slotIndex);
        return next;
      });
    }
  };

  const handleDownloadProductVideo = (slotIndex) => {
    const video = productVideos[slotIndex];
    if (!video?.videoUrl) return;
    const slot = DESIGN_IMAGE_SLOTS[slotIndex];
    const safeLabel = String(slot?.shortLabel || `slot${slotIndex}`).replace(/[\\/:*?"<>|]/g, '_');
    const secs = video.durationSeconds || DEFAULT_VIDEO_DURATION;
    downloadDataUrl(video.videoUrl, `product_${safeLabel}_span_${secs}s.mp4`);
  };

  const handleUpsertDesignImage = async (slotIndex, newImage) => {
    if (!newImage) return;
    const normalizedImages = normalizeDesignImages(mainImagesRef.current);
    normalizedImages[slotIndex] = newImage;
    setMainImages(normalizedImages);
    setProductVideos(prev => {
      const next = { ...prev };
      delete next[slotIndex];
      return next;
    });
    setFrontCandidates([]);
    setSelectedFrontId(null);
    setFrontPreviewCandidate(null);
    setFrontRefImage(null);
    setWorkflowStep('idle');
    setResults([]);
    setSelectedResultId(null);
  };

  const handleRemoveDesignImage = (slotIndex) => {
    const nextImages = normalizeDesignImages(mainImagesRef.current);
    nextImages[slotIndex] = null;
    setMainImages(nextImages);
    setProductVideos(prev => {
      const next = { ...prev };
      delete next[slotIndex];
      return next;
    });
    setVideoPrompts(prev => {
      const next = { ...prev };
      delete next[slotIndex];
      return next;
    });
    setFrontCandidates([]);
    setSelectedFrontId(null);
    setFrontPreviewCandidate(null);
    setFrontRefImage(null);
    setWorkflowStep('idle');
    setResults([]);
    setSelectedResultId(null);
  };

  const handleEditImage = async () => {
    if (!previewResult || !editPrompt.trim()) return;
    setIsEditing(true);
    try {
      const prevUrl = previewResult.imageUrl;
      const updatedUrl = await editGeneratedImage(
        previewResult.imageUrl,
        editPrompt,
        editRefImages,
        outputImageSize,
        null,
        collectDesignImageFilenames(mainImagesRef.current)
      );
      setImageHistory(prev => ({
        ...prev,
        [previewResult.id]: [...(prev[previewResult.id] || []), prevUrl]
      }));
      setResults(prev => prev.map(r => r.id === previewResult.id ? { ...r, imageUrl: updatedUrl } : r));
      setPreviewResult(prev => prev ? { ...prev, imageUrl: updatedUrl } : null);
      setEditPrompt('');
      setEditRefImages([]);
    } catch (error) {
      alert("이미지 수정에 실패했습니다: " + error.message);
    } finally {
      setIsEditing(false);
    }
  };

  const handleBgChange = async (bgPreset) => {
    if (!previewResult || isEditing || changingBg) return;
    setChangingBg(bgPreset.id);
    try {
      const prevUrl = previewResult.imageUrl;
      const updatedUrl = await editGeneratedImage(
        previewResult.imageUrl,
        bgPreset.prompt,
        null,
        outputImageSize,
        null,
        collectDesignImageFilenames(mainImagesRef.current)
      );
      setImageHistory(prev => ({
        ...prev,
        [previewResult.id]: [...(prev[previewResult.id] || []), prevUrl]
      }));
      setResults(prev => prev.map(r => r.id === previewResult.id ? { ...r, imageUrl: updatedUrl } : r));
      setPreviewResult(prev => prev ? { ...prev, imageUrl: updatedUrl } : null);
    } catch (error) {
      alert("배경 변경에 실패했습니다: " + error.message);
    } finally {
      setChangingBg(null);
    }
  };

  const handleUndoEdit = () => {
    if (!previewResult) return;
    const stack = imageHistory[previewResult.id];
    if (!stack || stack.length === 0) return;
    const prevUrl = stack[stack.length - 1];
    setImageHistory(prev => ({
      ...prev,
      [previewResult.id]: stack.slice(0, -1)
    }));
    setResults(prev => prev.map(r => r.id === previewResult.id ? { ...r, imageUrl: prevUrl } : r));
    setPreviewResult(prev => prev ? { ...prev, imageUrl: prevUrl } : null);
  };

  const handleRefFileUpload = (e) => {
    const files = e.target.files;
    if (!files?.length) return;
    Array.from(files).forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => setEditRefImages(prev => [...prev, ev.target.result]);
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  };

  const handleRemoveRefImage = (idx) => setEditRefImages(prev => prev.filter((_, i) => i !== idx));

  const getDataUrlExt = (dataUrl) => {
    const m = dataUrl.match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,/i);
    const mime = (m?.[1] || '').toLowerCase();
    if (mime.includes('jpeg') || mime.includes('jpg')) return 'jpg';
    if (mime.includes('webp')) return 'webp';
    return 'png';
  };

  const handleDownload = async (imageUrl, photoId, withAiDisclosure = false) => {
    const finishWithCanvas = (img) => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      if (withAiDisclosure) drawAiDisclosureOnCanvas(ctx, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = `ai-lookbook-${photoId}.jpg`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      if (withAiDisclosure) {
        finishWithCanvas(img);
        return;
      }
      if (imageUrl.startsWith('data:')) {
        const ext = getDataUrlExt(imageUrl);
        const link = document.createElement('a');
        link.href = imageUrl;
        link.download = `ai-lookbook-${photoId}.${ext}`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        return;
      }
      finishWithCanvas(img);
    };
    img.onerror = () => {
      if (imageUrl.startsWith('data:') && !withAiDisclosure) {
        const ext = getDataUrlExt(imageUrl);
        const link = document.createElement('a');
        link.href = imageUrl;
        link.download = `ai-lookbook-${photoId}.${ext}`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    };
    img.src = imageUrl;
  };

  const handleCropDone = (croppedDataUrl) => {
    setShowCropTool(false);
    const link = document.createElement('a');
    link.href = croppedDataUrl;
    link.download = `ai-lookbook-crop-${previewResult?.photoId || 'img'}.png`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  const handleBatchDownload = async (format) => {
    setShowBatchFormat(false);
    const mimeMap = { jpg: 'image/jpeg', png: 'image/png', webp: 'image/webp' };
    const mime = mimeMap[format] || 'image/png';
    const quality = format === 'png' ? undefined : 0.92;
    const zip = new JSZip();
    const currentPhotoId = results[0]?.photoId;
    if (!currentPhotoId) return;
    const currentResults = results.filter(r => r.photoId === currentPhotoId);

    for (let i = 0; i < currentResults.length; i++) {
      const result = currentResults[i];
      if (!result.imageUrl) continue;
      try {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = result.imageUrl;
        });
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        if (format === 'jpg') {
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        ctx.drawImage(img, 0, 0);
        if (result.aiDisclosure) drawAiDisclosureOnCanvas(ctx, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL(mime, quality);
        const base64 = dataUrl.split(',')[1];
        zip.file(`${result.label || 'shot'}-${i + 1}.${format}`, base64, { base64: true });
      } catch (e) {
        console.error('Batch download error:', e);
      }
    }

    try {
      const blob = await zip.generateAsync({ type: 'blob' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `ai-lookbook-${currentPhotoId}.zip`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    } catch (e) {
      console.error('Zip generation error:', e);
    }
  };

  const handleReset = () => {
    setMainImages(normalizeDesignImages([]));
    setSelectedShotIds(DEFAULT_SELECTED_SHOT_IDS);
    setSelectedGhostIds([]);
    setFrontCandidates([]);
    setSelectedFrontId(null);
    setFrontPreviewCandidate(null);
    setFrontRefImage(null);
    setWorkflowStep('idle');
    setResults([]);
    setSelectedResultId(null);
    setPreviewResult(null);
    setEditPrompt('');
    setEditRefImages([]);
    setImageHistory({});
    setShowCropTool(false);
    setLastGenerationElapsedSec(0);
    setCustomPrompt('');
    setModelPreset(DEFAULT_MODEL_PRESET);
    setBodyType(DEFAULT_BODY_TYPE);
    setPairingIds(new Set());
    setProductVideos({});
    setVideoGeneratingSlots(new Set());
    setVideoPrompts({});
    setShowGhostPanelInResults(false);
  };

  const DB_NAME = 'ai-lookbook-db';
  const DB_VERSION = 1;
  const STORE_NAME = 'sessions';
  const MAX_HISTORY = 2;

  const _openDB = () => new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'photoId' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });

  const _dbGetAll = async () => {
    try {
      const db = await _openDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result.sort((a, b) => (b.savedAt || '').localeCompare(a.savedAt || '')));
        req.onerror = () => resolve([]);
      });
    } catch(e) {
      return [];
    }
  };

  const _dbPut = async (session) => {
    try {
      const db = await _openDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put(session);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      });
    } catch(e) {
      return false;
    }
  };

  const _dbDelete = async (photoId) => {
    try {
      const db = await _openDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.delete(photoId);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      });
    } catch(e) {
      return false;
    }
  };

  const _dbClear = async () => {
    try {
      const db = await _openDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.clear();
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      });
    } catch(e) {
      return false;
    }
  };

  const _compressForThumb = async (dataUrl, maxSize = 200) => {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const scale = Math.min(maxSize / img.width, maxSize / img.height, 1);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = () => resolve('');
      img.src = dataUrl;
    });
  };

  const loadSessionList = async () => {
    const list = await _dbGetAll();
    setSavedSessions(list);
  };

  useEffect(() => {
    loadSessionList();
  }, []);

  useEffect(() => {
    if (!showBatchFormat) return;
    const handler = (e) => {
      if (!e.target.closest('[data-batch-dropdown]')) setShowBatchFormat(false);
    };
    document.addEventListener('click', handler);
    return () => document.removeEventListener('click', handler);
  }, [showBatchFormat]);

  useEffect(() => {
    if (isGenerating) {
      setGenElapsed(0);
      genTimerRef.current = setInterval(() => setGenElapsed(prev => prev + 1), 1000);
    } else if (genTimerRef.current) {
      clearInterval(genTimerRef.current);
      genTimerRef.current = null;
    }
    return () => {
      if (genTimerRef.current) clearInterval(genTimerRef.current);
    };
  }, [isGenerating]);

  useEffect(() => {
    if (results.length === 0) return;
    const photoId = results[0]?.photoId;
    if (!photoId) return;

    (async () => {
      const thumbUrl = results[0]?.imageUrl ? await _compressForThumb(results[0].imageUrl) : '';
      await _dbPut({
        photoId,
        timestamp: results[0]?.timestamp || '',
        savedAt: new Date().toISOString(),
        count: results.length,
        elapsed: results[0]?.elapsedSec ?? lastGenerationElapsedSec ?? genElapsed,
        labels: results.map(r => r.label).filter(Boolean),
        thumbUrl,
        results: results.map(r => ({
          id: r.id,
          label: r.label,
          photoId: r.photoId,
          timestamp: r.timestamp,
          imageUrl: r.imageUrl,
          elapsedSec: r.elapsedSec,
          bodyType: r.bodyType || DEFAULT_BODY_TYPE,
          aiDisclosure: !!r.aiDisclosure,
        })),
      });

      const allSessions = await _dbGetAll();
      if (allSessions.length > MAX_HISTORY) {
        const toDelete = allSessions.slice(MAX_HISTORY);
        for (const s of toDelete) await _dbDelete(s.photoId);
      }
      loadSessionList();
    })();
  }, [results, genElapsed, lastGenerationElapsedSec]);

  const loadSession = (session) => {
    if (!session.results?.length) return;
    setFrontCandidates([]);
    setSelectedFrontId(null);
    setResults(session.results.map((r) => ({ ...r, aiDisclosure: !!r.aiDisclosure })));
    const frontResult = session.results.find(r => r.label === SHOT_FRONT.label);
    setFrontRefImage(frontResult?.imageUrl || null);
    setLastGenerationElapsedSec(session.elapsed || session.results[0]?.elapsedSec || 0);
    setSelectedResultId(session.results[0]?.id || null);
    setWorkflowStep('showing_results');
    setShowHistory(false);
  };

  const deleteSession = async (photoId, e) => {
    e.stopPropagation();
    await _dbDelete(photoId);
    await loadSessionList();
  };

  const clearAllHistory = async () => {
    if (!confirm('모든 히스토리를 삭제하시겠습니까?')) return;
    await _dbClear();
    setSavedSessions([]);
  };

  const closePreview = () => {
    setPreviewResult(null);
    setEditPrompt('');
    setEditRefImages([]);
    setShowCropTool(false);
  };

  const closeFrontPreview = () => {
    setFrontPreviewCandidate(null);
    setFrontEditPrompt('');
    setFrontEditRefImages([]);
  };

  const handleFrontRefFileUpload = (e) => {
    const files = e.target.files;
    if (!files?.length) return;
    Array.from(files).forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => setFrontEditRefImages(prev => [...prev, ev.target.result]);
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  };

  const handleRemoveFrontRefImage = (idx) => setFrontEditRefImages(prev => prev.filter((_, i) => i !== idx));

  const handleEditFrontCandidate = async () => {
    if (!frontPreviewCandidate || !frontEditPrompt.trim() || isFrontEditing) return;
    setIsFrontEditing(true);
    try {
      const prevUrl = frontPreviewCandidate.imageUrl;
      const updatedUrl = await editGeneratedImage(
        frontPreviewCandidate.imageUrl,
        frontEditPrompt,
        frontEditRefImages,
        outputImageSize,
        null,
        collectDesignImageFilenames(mainImagesRef.current)
      );
      setFrontImageHistory(prev => ({
        ...prev,
        [frontPreviewCandidate.id]: [...(prev[frontPreviewCandidate.id] || []), prevUrl]
      }));
      setFrontCandidates(prev => prev.map(c => c.id === frontPreviewCandidate.id ? { ...c, imageUrl: updatedUrl } : c));
      setFrontPreviewCandidate(prev => prev ? { ...prev, imageUrl: updatedUrl } : null);
      setFrontEditPrompt('');
      setFrontEditRefImages([]);
    } catch (error) {
      alert("기준컷 수정에 실패했습니다: " + error.message);
    } finally {
      setIsFrontEditing(false);
    }
  };

  const handleUndoFrontEdit = () => {
    if (!frontPreviewCandidate) return;
    const stack = frontImageHistory[frontPreviewCandidate.id];
    if (!stack || stack.length === 0) return;
    const prevUrl = stack[stack.length - 1];
    setFrontImageHistory(prev => ({
      ...prev,
      [frontPreviewCandidate.id]: stack.slice(0, -1)
    }));
    setFrontCandidates(prev => prev.map(c => c.id === frontPreviewCandidate.id ? { ...c, imageUrl: prevUrl } : c));
    setFrontPreviewCandidate(prev => prev ? { ...prev, imageUrl: prevUrl } : null);
  };

  const selectedResult = selectedResultId ? results.find((r) => r.id === selectedResultId) : null;

  const toggleAiDisclosureForSelected = () => {
    if (!selectedResultId) return;
    setResults((prev) =>
      prev.map((r) => (r.id === selectedResultId ? { ...r, aiDisclosure: !r.aiDisclosure } : r))
    );
    setPreviewResult((prev) =>
      prev && prev.id === selectedResultId ? { ...prev, aiDisclosure: !prev.aiDisclosure } : prev
    );
  };

  return h('div', { className: 'flex flex-col lg:flex-row h-screen bg-[#1a1a1a] overflow-hidden' },

    h('a', {
      href: '/logs/stats',
      target: '_blank',
      rel: 'noopener',
      className: 'fixed bottom-2 right-2 z-50 px-2.5 py-1.5 rounded bg-black/60 border border-white/10 text-[10px] text-white/60 hover:text-white hover:border-white/30'
    }, '사용 통계'),
    (results.length > 0 && !isGenerating && workflowStep === 'showing_results')
      ? h('div', {
          className: 'fixed top-4 right-4 z-40 px-3 py-2 rounded-lg bg-black/60 backdrop-blur-sm border border-white/10 text-right'
        },
          h('p', { className: 'text-[10px] text-gray-400 font-medium' }, '생성 시간'),
          h('p', { className: 'text-xs text-gray-100 font-bold whitespace-nowrap' }, results[0]?.timestamp || '-'),
          h('p', { className: 'text-[10px] text-gray-400 mt-1 font-medium' }, `경과: ${formatElapsed(results[0]?.elapsedSec ?? lastGenerationElapsedSec)}`)
        )
      : null,

    h(Sidebar, {
      designImages: mainImages,
      onUpsertDesignImage: handleUpsertDesignImage,
      onRemoveDesignImage: handleRemoveDesignImage,
      selectedShotIds,
      setSelectedShotIds,
      selectedGhostIds,
      setSelectedGhostIds,
      workflowStep,
      onGenerateFronts: handleGenerateFronts,
      onGenerateExtras: handleGenerateExtras,
      onGenerateGhosts: handleGenerateGhostsOnly,
      isGenerating,
      onReset: handleReset,
      outputImageSize,
      setOutputImageSize,
      customPrompt,
      setCustomPrompt,
      modelPreset,
      setModelPreset,
      bodyType,
      setBodyType,
      productVideos,
      videoGeneratingSlots,
      videoPrompts,
      setVideoPrompt,
      onGenerateProductVideo: handleGenerateProductVideo,
      onDownloadProductVideo: handleDownloadProductVideo
    }),

    h('main', { className: 'flex-1 overflow-y-auto p-4 lg:p-10 flex flex-col gap-8' },
      workflowStep === 'selecting_front' && frontCandidates.length > 0
        ? h('div', { className: 'max-w-5xl mx-auto w-full space-y-6 pb-20 animate-slideUp' },
            h('div', { className: 'text-center space-y-2' },
              h('h2', { className: 'text-2xl font-bold text-white' }, '3/4 기준컷을 선택하세요'),
              h('p', { className: 'text-sm text-gray-400' }, '마음에 드는 3/4 컷 1장을 고른 뒤, 왼쪽에서 추가 샷을 선택해 생성하세요.')
            ),
            h('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-6' },
              ...frontCandidates.map((candidate, idx) =>
                h('div', {
                  key: candidate.id,
                  className: 'group text-left'
                },
                  h('div', {
                    onClick: () => setFrontPreviewCandidate(candidate),
                    className: `relative aspect-[3/4] bg-[#252525] rounded-2xl overflow-hidden border-4 transition-all ${
                      selectedFrontId === candidate.id
                        ? 'border-[#3B82F6] shadow-[0_0_30px_rgba(59,130,246,0.25)]'
                        : 'border-transparent hover:border-gray-700'
                    } cursor-zoom-in`
                  },
                    h('img', { src: candidate.imageUrl, alt: `3/4 기준컷 후보 ${idx + 1}`, className: 'w-full h-full object-cover' }),
                    selectedFrontId === candidate.id
                      ? h('div', { className: 'absolute top-3 right-3 w-8 h-8 bg-[#3B82F6] rounded-full flex items-center justify-center shadow-lg' },
                          h(Check, { size: 18, className: 'text-white' })
                        )
                      : null
                  ),
                  h('button', {
                    type: 'button',
                    onClick: () => setSelectedFrontId(candidate.id),

                onClick: handleEditFrontCandidate,
                disabled: isFrontEditing || !frontEditPrompt.trim(),
                className: 'flex-1 px-4 py-2.5 rounded-xl bg-[#3B82F6] hover:bg-[#2563EB] text-white text-sm font-bold transition-colors shadow-lg disabled:opacity-50 disabled:cursor-not-allowed'
              }, '수정 적용')
            ),
            h('p', { className: 'text-[11px] text-gray-500 leading-relaxed' },
              '참조 이미지는 “이렇게 바꿔줘”의 참고용입니다. 기준컷의 배경/톤은 최대한 유지되도록 편집됩니다.'
            )
          )
        )
      : null,

    previewResult
      ? h('div', {
          className: 'fixed inset-0 z-[60] bg-black/95 flex flex-col lg:flex-row items-stretch justify-center animate-fadeIn',
          onClick: closePreview
        },
          h('div', { className: 'flex-1 flex items-center justify-center p-4 lg:p-10 relative' },
            h('button', {
              className: 'absolute top-6 left-6 p-2 text-white/60 hover:text-white transition-colors lg:hidden',
              onClick: closePreview
            }, h(X, { size: 32 })),
            h('div', { className: 'relative max-w-full max-h-full', onClick: e => e.stopPropagation() },
              h('div', { className: 'relative inline-block max-w-full max-h-[85vh]' },
                h('img', {
                  src: previewResult.imageUrl,
                  alt: 'Preview',
                  className: 'max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl border border-white/10'
                }),
                previewResult.aiDisclosure
                  ? h('span', { className: 'ai-disclosure-overlay' }, AI_DISCLOSURE_TEXT)
                  : null
              ),
              (isEditing || regeneratingIds.has(previewResult.id))
                ? h('div', { className: 'absolute inset-0 bg-black/40 backdrop-blur-[2px] rounded-lg flex flex-col items-center justify-center gap-4 text-white' },
                    h('div', { className: 'w-12 h-12 border-4 border-[#3B82F6] border-t-transparent rounded-full animate-spin' }),
                    h('span', { className: 'font-bold text-lg' },
                      isEditing ? 'AI 이미지 수정 중...' : 'AI 이미지 재생성 중...'
                    )
                  )
                : null
            )
          ),
          h('div', {
            className: 'w-full lg:w-[400px] bg-[#1a1a1a] border-l border-white/10 p-8 flex flex-col gap-6 animate-slideRight overflow-y-auto',
            onClick: e => e.stopPropagation()
          },
            h('div', { className: 'flex items-center justify-between' },
              h('div', { className: 'flex items-center gap-2' },
                h('div', { className: 'p-2 bg-[#3B82F6]/20 rounded-lg' }, h(Edit2, { size: 20, className: 'text-[#3B82F6]' })),
                h('h3', { className: 'text-xl font-bold text-white' }, '이미지 편집')
              ),
              h('button', { className: 'p-2 text-white/40 hover:text-white transition-colors', onClick: closePreview },
                h(X, { size: 24 })
              )
            ),
            h('div', { className: 'space-y-3' },
              h('label', { className: 'text-sm font-medium text-gray-400' }, '참조 이미지 (선택사항, 여러 개 추가 가능)'),
              h('div', { className: 'flex flex-wrap gap-3' },
                ...editRefImages.map((src, idx) =>
                  h('div', { key: idx, className: 'relative w-24 h-24 rounded-lg overflow-hidden border border-white/10 flex-shrink-0' },
                    h('img', { src, className: 'w-full h-full object-cover' }),
                    h('button', {
                      onClick: () => handleRemoveRefImage(idx),
                      className: 'absolute top-1 right-1 p-1 bg-black/60 rounded-full text-white hover:bg-red-500 transition-colors'
                    }, h(Trash2, { size: 12 }))
                  )
                ),
                h('label', {
                  className: 'w-24 h-24 bg-black/40 border border-dashed border-white/10 rounded-lg cursor-pointer hover:bg-white/5 transition-colors flex flex-col items-center justify-center gap-1 flex-shrink-0'
                },
                  h('input', { type: 'file', className: 'hidden', accept: 'image/*', multiple: true, onChange: handleRefFileUpload }),
                  h(ImagePlus, { size: 20, className: 'text-gray-500' }),
                  h('span', { className: 'text-[10px] text-gray-500' }, '추가')
                )
              )
            ),
            h('div', { className: 'space-y-2' },
              h('label', { className: 'text-sm font-medium text-gray-400' }, '배경 변경'),
              h('div', { className: 'grid grid-cols-4 gap-1.5' },
                ...BG_PRESETS.map(bg =>
                  h('button', {
                    key: bg.id,
                    onClick: () => handleBgChange(bg),
                    disabled: isEditing || !!changingBg,
                    className: `flex flex-col items-center gap-1 py-2 px-1 rounded-lg border transition-all text-center ${
                      changingBg === bg.id
                        ? 'bg-[#3B82F6]/20 border-[#3B82F6] text-[#3B82F6]'
                        : 'bg-white/5 border-transparent hover:bg-white/10 hover:border-white/10 text-gray-400 hover:text-white'
                    } disabled:opacity-40`
                  },
                    changingBg === bg.id
                      ? h(RefreshCw, { size: 14, className: 'animate-spin' })
                      : h('span', { className: 'text-base leading-none' }, bg.emoji),
                    h('span', { className: 'text-[10px] font-medium leading-none' }, bg.label)
                  )
                )
              ),
              changingBg
                ? h('p', { className: 'text-[10px] text-[#3B82F6] animate-pulse' }, '배경을 변경하고 있습니다...')
                : null
            ),
            h('div', { className: 'space-y-3' },
              h('label', { className: 'text-sm font-medium text-gray-400' }, '수정 지시어 입력'),
              h('textarea', {
                value: editPrompt,
                onChange: (e) => setEditPrompt(e.target.value),
                placeholder: '예: 피부톤을 더 자연스럽게, 조명을 조금 더 부드럽게...',
                className: 'w-full h-32 bg-black/40 border border-white/10 rounded-xl p-4 text-white text-sm focus:border-[#3B82F6] focus:ring-1 focus:ring-[#3B82F6] outline-none resize-none placeholder:text-gray-600 transition-all'
              }),
              h('p', { className: 'text-[10px] text-gray-600 leading-relaxed' },
                '* 업로드한 참조 이미지와 수정 지시어를 함께 사용해 현재 이미지를 편집합니다.'
              )
            ),
            h('div', { className: 'space-y-3 pt-4' },
              h('button', {
                onClick: handleEditImage,
                disabled: isEditing || !editPrompt.trim(),
                className: 'w-full py-4 bg-[#3B82F6] hover:bg-[#2563EB] disabled:bg-gray-800 disabled:text-gray-500 rounded-xl font-bold text-white flex items-center justify-center gap-2 transition-all shadow-lg'
              },
                isEditing
                  ? h(RefreshCw, { size: 20, className: 'animate-spin' })
                  : h(React.Fragment, null, h(Sparkles, { size: 18 }), h('span', null, '수정 요청하기'))
              ),
              (imageHistory[previewResult.id]?.length > 0)
                ? h('button', {
                    onClick: handleUndoEdit,
                    disabled: isEditing,
                    className: 'w-full py-3 border border-amber-500/30 bg-amber-500/10 hover:bg-amber-500/20 rounded-xl font-bold text-amber-400 flex items-center justify-center gap-2 transition-all text-sm'
                  },
                    h(RotateCcw, { size: 16 }),
                    h('span', null, `이전 이미지로 되돌리기 (${imageHistory[previewResult.id].length}단계)`)
                  )
                : null,
              h('button', {
                onClick: () => handleRegenerateSingle(previewResult),
                disabled: regeneratingIds.has(previewResult.id) || isEditing,
                className: `w-full py-4 border rounded-xl font-bold flex items-center justify-center gap-2 transition-all ${
                  regeneratingIds.has(previewResult.id)
                    ? 'bg-[#3B82F6]/20 border-[#3B82F6] text-[#3B82F6]'
                    : 'bg-white/5 hover:bg-white/10 border-white/10 text-white'
                }`
              },
                h(RefreshCw, { size: 18, className: regeneratingIds.has(previewResult.id) ? 'animate-spin' : '' }),
                h('span', null, regeneratingIds.has(previewResult.id) ? '이미지 생성 중...' : '기존 설정으로 재생성')
              )
            ),
            h('div', { className: 'mt-auto pt-6 border-t border-white/5 flex flex-col gap-3' },
              h('div', { className: 'flex gap-3' },
                h('button', {
                  onClick: () => handleDownload(previewResult.imageUrl, previewResult.photoId, !!previewResult.aiDisclosure),
                  className: 'flex-1 flex flex-col items-center justify-center gap-2 p-4 bg-white/5 hover:bg-white/10 rounded-xl transition-colors text-white/60 hover:text-white'
                },
                  h(Download, { size: 20 }),
                  h('span', { className: 'text-[10px] font-bold' }, '원본 저장')
                ),
                h('button', {
                  onClick: () => setShowCropTool(true),
                  className: 'flex-1 flex flex-col items-center justify-center gap-2 p-4 bg-white/5 hover:bg-white/10 rounded-xl transition-colors text-white/60 hover:text-white'
                },
                  h(Crop, { size: 20 }),
                  h('span', { className: 'text-[10px] font-bold' }, '크롭 저장')
                )
              )
            ),
            showCropTool
              ? h(CropTool, { imageUrl: previewResult.imageUrl, onCropDone: handleCropDone, onCancel: () => setShowCropTool(false) })
              : null
          )
        )
      : null
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
  </script>
</body>
</html>
