<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Titanic - Prediccion de Supervivencia</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 0; padding: 24px 16px 60px; background:#f7f7f9; color:#111; }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.desc { color:#444; font-size: 0.9rem; margin-top: 0; }
  .formulario { background:white; border:1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
  label { display:block; margin-top:12px; font-weight:600; font-size: 0.9rem; }
  input, select { width:100%; padding:8px; margin-top:4px; box-sizing:border-box; font-size:1rem; }
  button { margin-top:20px; width:100%; padding:10px; background:#2563eb; color:white; border:none; border-radius:6px; font-size:1rem; cursor:pointer; }
  button:hover { background:#1d4ed8; }
  .resultados { display: flex; flex-wrap: wrap; gap: 20px; }
  .panel { flex: 1 1 320px; border: 1px solid #ddd; border-radius: 8px; padding: 16px; background: white; }
  .panel h2 { font-size: 1.05rem; margin-top: 0; }
  .panel .metricas { font-size: 0.8rem; color: #666; margin-top: -6px; margin-bottom: 12px; }
  .resultado { padding: 14px; border-radius: 6px; font-weight:600; text-align:center; background:#eee; color:#333; }
  .resultado.sobrevive { background:#dcfce7; color:#166534; }
  .resultado.no-sobrevive { background:#fee2e2; color:#991b1b; }
  @media (max-width: 700px) {
    .resultados { flex-direction: column; }
    .panel { flex-basis: auto; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Titanic: Prediccion de Supervivencia</h1>
  <p class="desc">Taller 3 - SVM (PUJ). Pagina 100% estatica (HTML + JavaScript), sin backend ni dependencias de Python.</p>

  <div class="formulario">
    <label>Clase (Pclass: 1, 2 o 3)</label>
    <input type="number" id="pclass" value="3" min="1" max="3" step="1" />

    <label>Edad (Age)</label>
    <input type="number" id="age" value="30" min="0" max="100" step="0.5" />

    <label>Hermanos/esposos a bordo (SibSp)</label>
    <input type="number" id="sibsp" value="0" min="0" step="1" />

    <label>Padres/hijos a bordo (Parch)</label>
    <input type="number" id="parch" value="0" min="0" step="1" />

    <label>Tarifa pagada (Fare)</label>
    <input type="number" id="fare" value="15" min="0" step="0.1" />

    <label>Genero</label>
    <select id="genero">
      <option value="Mujer">Mujer</option>
      <option value="Hombre">Hombre</option>
    </select>

    <button onclick="predecir()">Predecir</button>
  </div>

  <div class="resultados">
    <div class="panel">
      <h2>SVM Optimizado (rbf)</h2>
      <div class="metricas">Accuracy test: 0.797 | F1 test: 0.707</div>
      <div id="resultado-svm" class="resultado">-</div>
    </div>
    <div class="panel">
      <h2>Regresion Logistica (Taller 2)</h2>
      <div class="metricas">Accuracy test: 0.810 | F1 test: 0.757</div>
      <div id="resultado-lr" class="resultado">-</div>
    </div>
  </div>
</div>

    return z > 0;
