<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>UX AI Assistant</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="container">

        <header>
            <div class="badge">
                🤖 AI UX ANALYZER
            </div>

            <h1>
                Improve your UI<br>
                with AI
            </h1>

            <p>
                Upload a screenshot and let AI detect
                UX problems and suggest improvements.
            </p>
        </header>


        <section class="card">

            <label class="upload-box">

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                >

                <div class="upload-content">

                    <div class="upload-icon">
                        ↑
                    </div>

                    <h3>
                        Upload UI Screenshot
                    </h3>

                    <p>
                        PNG, JPG or WEBP
                    </p>

                </div>

            </label>


            <div id="previewContainer" class="preview hidden">

                <img
                    id="preview"
                    alt="UI Screenshot"
                >

            </div>


            <label class="problem-label">
                Describe your UX problem
            </label>

            <textarea
                id="problemInput"
                placeholder="Example: Users are confused when trying to complete checkout..."
            ></textarea>


            <button
                id="analyzeButton"
                disabled
            >
                Analyze UX
            </button>


            <div
                id="status"
                class="status"
            >
                AI model is not loaded yet.
            </div>

        </section>


        <section
            id="result"
            class="result hidden"
        >

            <h2>
                UX Analysis
            </h2>

            <div id="resultContent"></div>

        </section>

    </main>


    <script type="module" src="app.js"></script>

</body>

</html>
