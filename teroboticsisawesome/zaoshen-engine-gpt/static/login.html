<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登入｜造神引擎GPT版</title><link rel="stylesheet" href="/static/brand/icons.css"><script src="/static/brand/icons.js"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 0,#35162e,transparent 40%),#070910;color:#f5f7fb;font:15px/1.6 "Microsoft JhengHei",system-ui}.box{width:min(420px,92vw);padding:30px;border:1px solid #293247;border-radius:18px;background:#111722ee;box-shadow:0 25px 80px #0008}h1{margin:0;font-size:25px}.sub{color:#929db0;margin:3px 0 24px}label{display:block;color:#b7c0cf;margin-top:13px}input{width:100%;margin-top:5px;padding:12px;border:1px solid #34405a;border-radius:9px;background:#080c13;color:#fff;font-size:16px}button{width:100%;padding:12px;margin-top:20px;border:0;border-radius:9px;background:linear-gradient(90deg,#ff3f81,#9c5cff);color:white;font-weight:900;font-size:15px;cursor:pointer}.hint{margin-top:18px;padding:12px;border:1px solid #ffc85744;border-radius:9px;color:#ffc857;font-size:12px}.err{color:#ff6570;min-height:24px;margin-top:8px}</style></head>
<body><form class="box" id="form"><h1>🔥 造神引擎GPT版</h1><div class="sub">共同活動工作空間</div><label>帳號<input id="username" autocomplete="username" required autofocus></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><div class="err" id="error"></div><button>登入活動</button><div class="hint">本機驗收帳號：wayne、partnera、partnerb、partnerc<br>本機初始密碼：1234<br>正式部署前必須更換。</div></form><script>
const form=document.querySelector('#form'),err=document.querySelector('#error');form.onsubmit=async e=>{e.preventDefault();err.textContent='登入中…';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.detail||'登入失敗');location.href=new URLSearchParams(location.search).get('next')||'/manager'}catch(x){err.textContent=x.message}};
</script></body></html>
