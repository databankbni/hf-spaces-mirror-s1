<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>粉專 Token｜造神引擎</title><link rel="stylesheet" href="/static/brand/icons.css"><script src="/static/brand/icons.js"></script>
<style>:root{--bg:#f6f7fb;--panel:#fff;--line:#e4e7ee;--ink:#20232a;--mut:#707887;--pink:#e83e79;--green:#1f9d64}*{box-sizing:border-box}body{margin:0;padding-left:220px;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,"Microsoft JhengHei"}.side{position:fixed;left:0;top:0;bottom:0;width:220px;background:#111722;padding:20px 14px;color:#fff}.side b{display:block;margin-bottom:22px}.side a{display:block;padding:11px 12px;margin:5px 0;border-radius:9px;color:#929db0;text-decoration:none;font-weight:700}.side a.on,.side a:hover{background:#ff3f8118;color:#fff}.wrap{max-width:900px;margin:auto;padding:32px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}.status{display:inline-block;padding:6px 10px;border-radius:20px;font-weight:800;background:#fff1f4;color:var(--pink)}.status.on{background:#eaf8f1;color:var(--green)}.mut{color:var(--mut)}code{background:#f0f2f6;padding:2px 5px;border-radius:5px}.job{padding:13px 0;border-top:1px solid var(--line)}.job:first-child{border-top:0}.job-head{display:flex;justify-content:space-between;gap:12px}.job p{white-space:pre-wrap;color:#4f5663}.bad{color:var(--pink);font-weight:800}.good{color:var(--green);font-weight:800}@media(max-width:800px){body{padding-left:0}.side{position:static;width:auto}.side b{margin-bottom:8px}.side a{display:inline-block}.wrap{padding:18px}}</style></head><body>
<aside class="side"><b>🔥 造神引擎</b><a href="/warroom">1. 3D 戰情室</a><a href="/">2. 內容中心與認領池</a><a class="on" href="/page-token">3. 粉專 Token</a><a href="/team">4. 個人 RPA</a><a href="/audience">5. 留言與內容</a></aside>
<main class="wrap"><h1>粉專 Token</h1><p class="mut">官方粉專也從統一內容池認領；認領後由 Facebook Page Token 按排程直接發布。</p>
<section class="card"><h2>連線狀態</h2><span id="status" class="status">檢查中…</span><p id="message" class="mut"></p></section>
<section class="card"><h2>我已認領的粉專文章</h2><div id="pageJobs" class="mut">讀取中…</div></section>
<section class="card"><h2>這一頁的責任</h2><p>只管理官方粉專的 Token 連線與發布狀態，不在這裡重複產生或認領文章。內容與認領都在「內容中心與認領池」完成。</p><p class="mut">正式主機需設定 <code>FB_PAGE_ID</code> 與 <code>FB_PAGE_TOKEN</code>；Token 不會顯示給夥伴。</p></section></main>
<script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={queued:'等待排程',running:'發布中',succeeded:'發布成功',failed:'發布失敗',needs_attention:'需要處理'};fetch('/api/fb/status').then(r=>r.json()).then(s=>{const el=document.querySelector('#status');el.textContent=s.connected?`● 已連接 ${s.page||'官方粉專'}`:'● 尚未連接';el.classList.toggle('on',!!s.connected);document.querySelector('#message').textContent=s.connected?'已可由 Graph API 執行認領後的粉專排程。':(s.msg||'尚未設定粉專 Token。')}).catch(()=>document.querySelector('#message').textContent='無法讀取連線狀態');fetch('/api/jobs').then(r=>r.json()).then(rows=>{rows=rows.filter(x=>x.method==='graph_api');document.querySelector('#pageJobs').innerHTML=rows.length?rows.map(x=>`<article class="job"><div class="job-head"><b>#${x.queue_id} ${esc(x.target_name||'粉專')}</b><span class="${x.state==='succeeded'?'good':'bad'}">${labels[x.state]||esc(x.state)}</span></div><div class="mut">排程：${esc(x.scheduled_date||'立即')}</div><p>${esc(x.body)}</p>${x.error?`<div class="bad">原因：${esc(x.error)}</div>`:''}</article>`).join(''):'還沒有認領粉專文章。'});</script></body></html>
