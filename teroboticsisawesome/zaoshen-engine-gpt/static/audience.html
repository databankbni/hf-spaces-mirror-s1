<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>留言與名單｜造神引擎GPT版</title><link rel="stylesheet" href="/static/brand/icons.css"><script src="/static/brand/icons.js"></script>
<style>
:root{--bg:#070910;--panel:#121722;--line:#293144;--ink:#f5f7fb;--mut:#929db0;--pink:#ff3f81;--cyan:#31e8d3;--amber:#ffc857}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#28152d,transparent 35%),var(--bg);color:var(--ink);font:14px/1.5 "Microsoft JhengHei",system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:28px 20px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{margin:0}.btn{display:inline-block;text-decoration:none;color:#fff;background:#242c3c;border:1px solid var(--line);padding:9px 13px;border-radius:9px;font-weight:800}.status{margin:18px 0;padding:14px;border:1px solid #ffc85755;background:#ffc8570b;border-radius:12px;color:var(--amber)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:linear-gradient(145deg,#151b28,#0e121b);border:1px solid var(--line);border-radius:13px;padding:15px}.stat b{display:block;font-size:27px}.mut{color:var(--mut);font-size:11px}.filters{display:flex;gap:8px;margin:18px 0}.filters button{cursor:pointer;border:1px solid var(--line);background:#151b28;color:var(--mut);padding:8px 11px;border-radius:8px}.filters button.on{background:var(--pink);color:#fff}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:80px 1.2fr 1fr 1.5fr;gap:10px;align-items:center}.tag{font-size:10px;color:var(--cyan);font-weight:900}.row a{color:#a9c9ff}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:70px 1fr}.row>:nth-child(n+3){grid-column:2}}
</style><style>body{padding-left:220px}.system-side{position:fixed;left:0;top:0;bottom:0;width:220px;background:#080b12;padding:20px 14px;border-right:1px solid var(--line)}.system-side b{display:block;margin-bottom:22px}.system-side a{display:block;padding:11px 12px;margin:5px 0;border-radius:9px;color:var(--mut);text-decoration:none;font-weight:700}.system-side a.on,.system-side a:hover{background:#ff3f8118;color:#fff}@media(max-width:800px){body{padding-left:0}.system-side{position:static;width:auto}.system-side b{margin-bottom:8px}.system-side a{display:inline-block}}</style></head><body><aside class="system-side"><b>🔥 造神引擎</b><a href="/warroom">1. 3D 戰情室</a><a href="/">2. 內容中心與認領池</a><a href="/page-token">3. 粉專 Token</a><a href="/team">4. 個人 RPA</a><a class="on" href="/audience">5. 留言與內容</a></aside><main>
<div class="top"><div><div class="mut">AUDIENCE OPERATIONS</div><h1>留言與名單</h1></div><div><a class="btn" href="/warroom">返回戰情室</a> <a class="btn" href="/?tab=all&kind=reply">回覆範本</a></div></div>
<div id="commentStatus" class="status">留言同步狀態檢查中…</div>
<section class="stats"><div class="card stat"><span class="mut">全部名單</span><b id="total">—</b></div><div class="card stat"><span class="mut">社團</span><b id="groups">—</b></div><div class="card stat"><span class="mut">KOL／創作者</span><b id="kols">—</b></div><div class="card stat"><span class="mut">留言回覆範本</span><b id="replies">—</b></div></section>
<div class="filters"><button class="on" data-cat="all">全部</button><button data-cat="group">社團</button><button data-cat="kol">KOL／創作者</button></div>
<section class="card"><div id="list" class="list"><div class="mut">載入名單中…</div></div></section>
<script>
let targets=[];const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(cat='all'){const rows=cat==='all'?targets:targets.filter(x=>x.cat===cat);document.querySelector('#list').innerHTML=rows.map(x=>`<div class="row"><span class="tag">${esc(x.cat==='kol'?'KOL':'社團')}</span><b>${esc(x.name)}</b><span>${esc(x.channel||'')}</span><span>${x.handle_url?`<a href="${esc(x.handle_url)}" target="_blank" rel="noopener">開啟對象 ↗</a>`:''} ${esc(x.action||'')}</span></div>`).join('')||'<div class="mut">沒有名單</div>'}
Promise.all([fetch('/api/targets').then(r=>r.json()),fetch('/api/queue?kind=reply').then(r=>r.json()),fetch('/api/fb/status').then(r=>r.json())]).then(([ts,rs,fb])=>{targets=ts;document.querySelector('#total').textContent=ts.length;document.querySelector('#groups').textContent=ts.filter(x=>x.cat==='group').length;document.querySelector('#kols').textContent=ts.filter(x=>x.cat==='kol').length;document.querySelector('#replies').textContent=rs.length;document.querySelector('#commentStatus').textContent=fb.connected?'Facebook 粉專已連線；留言同步尚未啟用，需加入 Meta comments 權限與同步工作。':'Facebook 尚未連線，因此無法同步真實留言。名單與回覆範本仍可使用。';render()}).catch(e=>document.querySelector('#commentStatus').textContent='資料載入失敗：'+e.message);
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('on',x===b));render(b.dataset.cat)});
</script></main></body></html>
