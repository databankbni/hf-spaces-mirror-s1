title: 公告栏
icon: "📢"

# 每个 html 字段对应一条公告，支持 <strong>、<a> 等简单 HTML。
# 调整顺序或增删条目后，刷新首页即可看到变化。
items:
  - html: >-
      <strong>额度重置</strong>：因deepseek上线视觉模型，本服务已进行适配并切换，本月 30 元 API 额度重置。26.08.21

  - html: >-
      <strong>新功能</strong>：「问秋月」和「搜标签」现支持 <strong>本地历史记录</strong> ——侧边栏显示本地历史记录，点击右上角齿轮按钮可导出或导入。历史记录仅保存在本地，绝不在服务器上记录。

  - html: >-
      <strong>新功能</strong>：「问秋月」和「搜标签」现支持<strong>自定义 API</strong>——点击页面右上角齿轮按钮，填入你自己的 API Key / URL / Model，优先使用你自己的额度，你的 Key 仅保存在本地浏览器中，不会上传至服务器

  - html: >-
      推出 ComfyUI 插件版 Agent 工具 <a href="https://github.com/SuzumiyaAkizuki/ComfyUI-NewBie-LLM-Formatter" target="_blank">ComfyUI-NewBie-LLM-Formatter</a>，可以使用 Agent，调用搜索 MCP，书写 NewBie 或 Anima 的提示词
