# 问秋月数据管道配置

# BGE-M3 本地权重路径（绝对路径或 相对于项目根目录）
model_path: "BAAI/bge-m3"

# 博客源文件目录（相对于 data_pipeline/ 目录）
posts_dir: "posts"

# ChromaDB 持久化目录（相对于项目根目录）
chroma_dir: ".chroma"

# ChromaDB collection 名称
collection_name: "akizuki_blog"

# 博客根域名，用于在 front matter 没有完整 URL 时拼接
blog_domains:
  tech: "https://blog.sakizuki.site"
  life: "https://life.sakizuki.site"

# ── API ─────────────────────────────────────────
api:
  # Tavily 网络搜索（留空则禁用 web_search）
  # 环境变量 TAVILY_API_KEY 优先级高于此处配置
  tavily_api_key: ""

# ── 分块策略 ────────────────────────────────────
chunking:
  max_tokens_per_h2: 800
  max_tokens_per_chunk: 800
  target_min_tokens: 300
  target_max_tokens: 600

# ── Embedding ───────────────────────────────────
embedding:
  batch_size: 32
  max_seq_length: 512

# ── 缓存 ────────────────────────────────────────
cache:
  # safetensors embedding 向量缓存目录（相对于项目根目录）
  embeddings_dir: ".cache/embeddings"
  # 破坏性格式变更时递增，触发自动全量重建
  schema_version: 1