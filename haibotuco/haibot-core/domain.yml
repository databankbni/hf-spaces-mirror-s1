version: "3.1"
intents:
  - greet
  - nlu_fallback
  - affirm
  - deny
  - select_option
  - emotional_control
  - affirm_emotional_control
  - deny_emotional_control
  - emotional_control_info_tdah
  - affirm_emotional_control_info_tdah
  - deny_emotional_control_info_tdah
  - emotional_control_info_caregiver
  - affirm_emotional_control_info_caregiver
  - deny_emotional_control_info_caregiver
  - behavioral_control
  - affirm_behavioral_control
  - deny_behavioral_control
  - behavioral_control_info_tdah
  - affirm_behavioral_control_info_tdah
  - deny_behavioral_control_info_tdah
  - behavioral_control_info_caregiver
  - affirm_behavioral_control_info_caregiver
  - deny_behavioral_control_info_caregiver
  - assertive_communication
  - affirm_assertive_communication
  - deny_assertive_communication
  - affirm_assertive_communication_info_tdah
  - deny_assertive_communication_info_tdah
  - psychoeducational_activity
  - affirm_psychoeducational_activity
  - deny_psychoeducational_activity
  - survey_satisfaction_trigger
  - survey_satisfaction_yes
  - survey_satisfaction_no
  - survey_satisfaction_comment
  - survey_satisfaction_recommend_yes
  - survey_satisfaction_recommend_no
  - survey_satisfaction_start
  - skip_comment
  - skip_survey

entities:
  - option_number

responses:
  utter_ask_what_help_needed:
    - text: "De acuerdo, con la información que brindaste anteriormente quisiera saber en qué necesitas ayuda."
  utter_default:
    - text: "No te entendi muy bien. Si quieres, puedes comenzar de nuevo con Hola HAIBOT."
      buttons:
        - title: "Hola HAIBOT"
          payload: "Hola HAIBOT"
  utter_ask_survey_comment:
    - text: "¿Qué no te gustó? Ayúdanos a mejorar"
      buttons:
        - title: "Omitir comentario"
          payload: "Omitir comentario"
      custom:
        type: survey
        survey_step: comment
  utter_survey_satisfaction_recommend:
    - text: "¿Recomendarías la aplicación?"
      buttons:
            - title: "Sí"
              payload: "Sí"
            - title: "No"
              payload: "No"
      custom:
        type: survey
        survey_step: recommend
  utter_survey_satisfaction_end:
    - text: "Nos vemos pronto, espero que con la atención que te brindé encontraras la solución a tu requerimiento."
      custom:
        type: survey
        survey_step: end
  
  utter_survey_satisfaction_start:
    - text: "¿Fue útil la información o recurso que te brindé?"
      buttons:
            - title: "Sí"
              payload: "Sí"
            - title: "No"
              payload: "No"
      custom:
        type: survey
        survey_step: start

  utter_choose_option:
    - text: "Escribe la opción de la que quieras recibir información"

  utter_options_list:
    - text: |
        1. Control emocional
        2. Control comportamental
        3. Comunicación asertiva
        4. Actividad psicoeducativa
      buttons:
            - title: "1"
              payload: "1"
            - title: "2"
              payload: "2"
            - title: "3"
              payload: "3"
            - title: "4"
              payload: "4"

  utter_emotional_control:
    - text: "¿Sabes qué es control emocional?"
      buttons:
            - title: "NO"
              payload: "No"
            - title: "SI"
              payload: "Sí"

  utter_emotional_control_more_info_questions:
    - text: |
        1. ¿Desea recibir más información sobre control emocional y TDAH?
        2. ¿Desea recibir información sobre control emocional para usted como cuidador?
      buttons:
            - title: "1"
              payload: "1"
            - title: "2"
              payload: "2"

  utter_explain_emotional_control:
    - text: |
        La regulación emocional según Shaw et al. (2014) citado en Alpízar (2019) la definen como la habilidad de un individuo para modificar una emoción y lograr un comportamiento más adaptativo que permita la orientación a objetivos; requiere que el individuo seleccione, atienda, evalúe y sea flexible ante los estímulos que le generan una reacción emocional

  utter_emotional_control_info_tdah:
    - text: "¿Desea recibir información sobre control emocional y TDAH?"
      buttons:
            - title: "NO"
              payload: "No"
            - title: "SI"
              payload: "Sí"

  utter_deny_emotional_control_info_tdah:
    - text: "No puedo ayudarte en este requerimiento ¿En cuál otro necesitas ayuda?"

  utter_affirm_emotional_control_info_tdah:
    - text: "De acuerdo, a continuación, te mostraré información sobre control emocional y TDAH, en donde se desplegará una lista de opciones en las que vas a poder encontrar videos, blogs, páginas y algunos grupos en redes sociales en los que puedes encontrar información de interés para tu consulta."
      buttons:
        - title: "Omitir Encuesta"
          payload: "Omitir encuesta"
      custom:
        type: "resource_info"
        isResourceInfo: true
        topic: "emotional_control_tdah"

  utter_emotional_control_info_caregiver:
    - text: "¿Desea recibir información sobre control emocional para usted como cuidador?"
      buttons:
            - title: "NO"
              payload: "No"
            - title: "SI"
              payload: "Sí"

  utter_deny_emotional_control_info_caregiver:
    - text: "No puedo ayudarte en este requerimiento ¿En cuál otro necesitas ayuda?"
    
  utter_affirm_emotional_control_info_caregiver:
    - text: "De acuerdo, a continuación, te mostraré información sobre control emocional para ti como cuidador, en donde se desplegará una lista de opciones en las que vas a poder encontrar videos, blogs, páginas y algunos grupos en redes sociales en los que puedes encontrar información de interés para tu consulta."
      buttons:
        - title: "Omitir Encuesta"
          payload: "Omitir encuesta"
      custom:
        type: "resource_info"
        isResourceInfo: true
        topic: "emotional_control_caregiver"

  utter_behavioral_control:
    - text: "¿Sabes qué es control comportamental?"
      buttons:
            - title: "NO"
              payload: "No"
            - title: "SI"
              payload: "Sí"
          
  utter_explain_behavioral_control:
    - text: "La autorregulación del comportamiento es concebida como la capacidad del individuo para inhibir o frenar las respuestas motoras y emocionales que se pueden producir de forma automática e inmediata a un estímulo, suceso o evento, con el fin de sustituirlas por otras más adecuadas (Barkley, 1997; Servera, 2005). citado en (Ramos, 2015)."

  utter_behavioral_control_more_info_questions:
    - text: |
        1. ¿Desea recibir más información sobre control comportamental y TDAH?
        2. ¿Desea recibir información sobre control comportamental para usted como cuidador?
      buttons:
            - title: "1"
              payload: "1"
            - title: "2"
              payload: "2"


  utter_behavioral_control_info_tdah:
    - text: "¿Desea recibir información sobre control comportamental y TDAH?"
      buttons:
            - title: "NO"
              payload: "No"
            - title: "SI"
              payload: "Sí"

  utter_deny_info_request_general:
    - text: "No puedo ayudarte en este requerimiento ¿En cuál otro necesitas ayuda?"

  utter_affirm_behavioral_control_info_tdah:
    - text: "De acuerdo, a continuación, te mostraré información sobre control comportamental y TDAH, en donde se desplegará una lista de opciones en las que vas a poder encontrar videos, blogs, páginas y algunos grupos en redes sociales en los que puedes encontrar información de interés para tu consulta."
      buttons:
        - title: "Omitir Encuesta"
          payload: "Omitir encuesta"
      custom:
        type: "resource_info"
        isResourceInfo: true
        topic: "behavioral_control_tdah"

  utter_behavioral_control_info_caregiver:
    - text: "¿Desea recibir información sobre control comportamental para usted como cuidador?"
      buttons:
            - title: "NO"
              payload: "No"
            - title: "SI"
              payload: "Sí"

  utter_deny_behavioral_control_info_caregiver:
    - text: "No puedo ayudarte en este requerimiento ¿En cuál otro necesitas ayuda?"
    
  utter_affirm_behavioral_control_info_caregiver:
    - text: "De acuerdo, a continuación, te mostraré información sobre control comportamental para ti como cuidador, en donde se desplegará una lista de opciones en las que vas a poder encontrar videos, blogs, páginas y algunos grupos en redes sociales en los que puedes encontrar información de interés para tu consulta."
      buttons:
        - title: "Omitir Encuesta"
          payload: "Omitir encuesta"
      custom:
        type: "resource_info"
        isResourceInfo: true
        topic: "behavioral_control_caregiver"

  utter_assertive_communication:
    - text: "¿Sabes qué es comunicación asertiva?"
      buttons:
            - title: "NO"
              payload: "No"
            - title: "SI"
              payload: "Sí"

  utter_explain_assertive_communication:
    - text: "La comunicación asertiva tiene que ver con la capacidad de expresarse verbal y preverbalmente en forma apropiada a la cultura y a las situaciones. (Corrales, 2016, p.5)."

  utter_assertive_communication_info_tdah:
    - text: "¿Desea recibir más información sobre la comunicación asertiva y el TDAH?"
      buttons:
            - title: "NO"
              payload: "No"
            - title: "SI"
              payload: "Sí"

  utter_affirm_assertive_communication_info_tdah:
    - text: "De acuerdo, a continuación, te mostraré información sobre comunicación asertiva, en donde se desplegará una lista de opciones en las que vas a poder encontrar videos, blogs, páginas y algunos grupos en redes sociales en los que puedes encontrar información de interés para tu consulta."
      buttons:
        - title: "Omitir Encuesta"
          payload: "Omitir encuesta"
      custom:
        type: "resource_info"
        isResourceInfo: true
        topic: "assertive_communication_tdah"

  utter_psychoeducational_activity:
    - text: "¿Sabes qué es una actividad psicoeducativa?"
      buttons:
            - title: "NO"
              payload: "No"
            - title: "SI"
              payload: "Sí"

  utter_explain_psychoeducational_activity:
    - text: "La intervención psicoeducativa es una estrategia que permite aportar información sobre el TDAH al paciente, padres y educadores con criterios de utilidad, veracidad científica y clarificación sobre los aspectos más importantes del trastorno. (Rodríguez, 2014, p.37)."

  utter_affirm_psychoeducational_activity:
    - text: "De acuerdo, a continuación, te mostraré información sobre actividades psicoeducativas que se relacionen con el tipo de diagnóstico que tiene el menor. Recuerde que es importante que usted esté siempre presente mientras el niño realiza la actividad."
      buttons:
        - title: "Omitir Encuesta"
          payload: "Omitir encuesta"
      custom:
        type: "resource_info"
        isResourceInfo: true
        topic: "psychoeducational_activity"

slots:
  option_number:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: option_number
  survey_comment:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        not_intent: skip_comment
        conditions:
          - active_loop: survey_comment_form
            requested_slot: survey_comment
  survey_data:
    type: any
    initial_value: {}
    influence_conversation: false
    mappings:
      - type: custom

forms:
  survey_comment_form:
    required_slots:
      - survey_comment

actions:
  - action_handle_select_option
  - action_prepare_survey_comment




session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
