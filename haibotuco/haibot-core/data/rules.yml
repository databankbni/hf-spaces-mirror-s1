      - action: utter_affirm_emotional_control_info_tdah

  - rule: Typed affirm emotional control info TDAH
    steps:
      - action: utter_emotional_control_info_tdah
      - intent: affirm
      - action: utter_affirm_emotional_control_info_tdah
      
  - rule: Deny emotional control info TDAH
    steps:
      - intent: deny_emotional_control_info_tdah
      - action: utter_deny_info_request_general
      - action: utter_choose_option
      - action: utter_options_list

  - rule: Typed deny emotional control info TDAH
    steps:
      - action: utter_emotional_control_info_tdah
