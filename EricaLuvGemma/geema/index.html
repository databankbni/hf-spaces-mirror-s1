<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Geema Animation Engine</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >
</head>

<body>

    <main id="app">

        <section id="stage">

            <canvas
                id="animation-canvas"
                width="900"
                height="900"
            ></canvas>

        </section>

        <section
            id="controls"
            aria-label="Animation controls"
        >

            <button
                type="button"
                data-animation="idle-blinking"
            >
                Idle
            </button>

            <button
                type="button"
                data-animation="walking"
            >
                Walk
            </button>

            <button
                type="button"
                data-animation="running"
            >
                Run
            </button>

            <button
                type="button"
                data-animation="kicking"
            >
                Kick
            </button>

            <button
                type="button"
                data-animation="slashing"
            >
                Slash
            </button>

            <button
                type="button"
                data-animation="sliding"
            >
                Slide
            </button>

            <button
                type="button"
                data-animation="falling-down"
            >
                Fall
            </button>

        </section>

    </main>

    <script
        type="module"
        src="./js/app.js"
    ></script>

</body>
</html>
