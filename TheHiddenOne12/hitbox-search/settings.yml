use_default_settings: true
server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "any_random_secret_string"
search:
  formats:
    - html
    - json
engines:
  - name: google
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: bing
    engine: bing
    shortcut: bi
  - name: reddit
    engine: reddit
    shortcut: re