<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYND - Find Your Nearest Desire</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="page-container">
        <!-- Navigation -->
        <nav class="navbar">
            <a href="/" class="logo">FynD</a>
            <div class="nav-links">
                <a href="/about">About</a>
                <a href="/wishlist">Wishlist</a>
                <a href="/mypage">MyPage</a>
            </div>
        </nav>

        <!-- Typographic Hero + Search -->
        <section class="hero-typo">
            <p class="hero-eyebrow"><span id="greeting">Good Afternoon</span></p>
            <h1 class="hero-headline">Find your <em>nearest</em> desire.</h1>
            <p class="hero-sub">
                Describe what you're looking for — a color, a mood, a fit —
                and FYND searches 12,000+ pieces from independent Korean brands.
            </p>

            <form id="search-form" class="search-container">
                <input
                    type="text"
                    id="search-input"
                    class="search-input"
                    placeholder="e.g. a black hooded puffer jacket with diamond quilting"
                    required
                >

                <div class="search-actions">
                    <div class="search-attach">
                        <button type="button" id="add-image-btn" class="add-image-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="12" y1="8" x2="12" y2="16"/>
                                <line x1="8" y1="12" x2="16" y2="12"/>
                            </svg>
                            add image
                        </button>
                        <input type="file" id="image-input" class="hidden-input" accept="image/*">
                        <img id="image-preview" class="image-preview" alt="Preview">
                    </div>

                    <button type="submit" class="submit-btn">Get Recommendation</button>
                </div>
            </form>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <span class="footer-brand">FynD</span>
            <span>© 2026 YunjiHan. All rights reserved.</span>
        </footer>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script src="/static/js/main.js"></script>
</body>
</html>
