<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYND - Recommendations</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="page-container">
        <!-- Navigation -->
        <nav class="navbar with-bg">
            <a href="/" class="logo">FynD</a>
            <div class="nav-links">
                <a href="/about">About</a>
                <a href="/wishlist">Wishlist</a>
                <a href="/mypage">MyPage</a>
            </div>
        </nav>

        <!-- Content -->
        <div class="content-section">
            <h1 class="page-title">Here's what we <em>found</em>.</h1>

            <!-- 현재 쿼리 + refine 칩 -->
            <div class="results-meta">
                <span class="results-query">Results for <em id="query-display"></em></span>
                <span id="refine-chips" style="display: contents;"></span>
            </div>

            <!-- Loading (스켈레톤은 JS가 grid 안에 렌더) -->
            <div id="loading" class="loading"></div>

            <!-- Products Grid -->
            <div id="products-grid" class="products-grid"></div>

            <!-- Refine Search -->
            <div class="refine-container">
                <p class="refine-label">Refine your results</p>
                <form id="refine-form" class="search-container">
                    <input
                        type="text"
                        id="refine-input"
                        class="search-input"
                        placeholder="e.g. lighter blue, slim fitted…"
                    >

                    <div class="search-actions">
                        <span></span>
                        <button type="submit" class="submit-btn">Refine</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <span class="footer-brand">FynD</span>
            <span>© 2026 YunjiHan. All rights reserved.</span>
        </footer>
    </div>

    <!-- Wishlist Modal -->
    <div id="wishlist-modal" class="modal-overlay">
        <div class="modal">
            <h3 class="modal-title">Add this to your wishlist?</h3>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-secondary" onclick="hideWishlistModal()">Cancel</button>
                <button class="modal-btn modal-btn-primary" onclick="confirmAddToWishlist()">Add</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script src="/static/js/main.js"></script>
</body>
</html>
