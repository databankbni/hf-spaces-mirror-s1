<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYND - Wishlist</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="page-container">
        <!-- Navigation -->
        <nav class="navbar with-bg">
            <a href="/" class="logo">FynD</a>
            <div class="nav-links">
                <a href="/about">About</a>
                <a href="/wishlist">Wishlist</a>
                <a href="/mypage">MyPage</a>
            </div>
        </nav>
        
        <!-- Content -->
        <div class="content-section">
            <h1 class="page-title">Love your <em>style</em>.</h1>
            <div class="results-meta">
                <span class="results-query">You can never be overdressed.</span>
            </div>
            
            <!-- Empty State -->
            <div id="wishlist-empty" class="wishlist-empty" style="display: none;">
                Your wishlist is empty.<br>
                Save pieces you love and they'll appear here.
            </div>
            
            <!-- Wishlist Grid -->
            <div id="wishlist-grid" class="products-grid"></div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <span class="footer-brand">FynD</span>
            <span>© 2026 YunjiHan. All rights reserved.</span>
        </footer>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>
    
    <script src="/static/js/main.js"></script>
</body>
</html>
